name: wave-tmn-a2a-staging
services:
  a2a-docker:
    build:
      context: ../..
      dockerfile: infra/tmn-a2a-ssh/Dockerfile
    image: wave-tmn-a2a-staging:local
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.50
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      - WAVE_TMN_A2A_TOKEN
    ports:
      - "127.0.0.1:18761:18761"
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:18761/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
