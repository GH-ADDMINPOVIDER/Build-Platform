<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OGENIC Control Tower</title>
<style>
:root{--bg:#0f0d0c;--panel:#1b1816;--panel2:#24201d;--cream:#f2e7d8;--text:#f8f2ea;--muted:#aa9d90;--gold:#d8b16b;--purple:#a14cff;--green:#50c78f;--amber:#ffbd59;--red:#ef6676;font-family:Inter,system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0c0b0b,#17120f);color:var(--text)}.shell{max-width:760px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 2px 14px}.brand{font-weight:900;letter-spacing:.08em;font-size:14px}.pill{font-size:11px;background:var(--gold);color:#17110d;padding:6px 9px;border-radius:999px;font-weight:800}.command{background:var(--cream);color:#211a16;border-radius:20px;padding:15px;box-shadow:0 18px 50px #0007}.command label{font-size:11px;font-weight:900;letter-spacing:.1em}.row{display:flex;gap:8px;margin-top:8px}.row input{flex:1;min-width:0;border:0;outline:0;background:#fff8ef;border-radius:12px;padding:13px;font-size:15px}.row button,.btn{border:0;border-radius:12px;background:var(--gold);color:#1a1410;padding:10px 13px;font-weight:800;cursor:pointer}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{background:#e6d7c4;border-radius:999px;padding:6px 9px;font-size:11px}.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}.panel{background:var(--panel);border:1px solid #302a26;border-radius:18px;padding:14px}.panel h2{margin:0 0 10px;font-size:14px;color:#f5e4cd}.caps{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cap{background:var(--panel2);border:1px solid #38312c;border-radius:13px;padding:10px}.cap.hot{border-color:#7e612f}.cap b{display:block;font-size:12px;margin-bottom:3px}.cap small{font-size:10px;color:var(--muted)}.route{background:#231c18;border:1px solid #4b392d;border-radius:14px;padding:12px}.route strong{color:#ffbd59}.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 8px;font-size:12px;margin-top:7px}.kv span:nth-child(odd){color:var(--muted)}.status{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #302a26;font-size:12px}.state{font-size:10px;border-radius:999px;padding:4px 7px;background:#302a26;color:#d7ccc2}.state.unknown{color:#ffcf86}.footer{font-size:10px;color:#7f746a;padding:10px 2px 4px;text-align:center}@media(max-width:520px){.caps{grid-template-columns:1fr}.row{flex-direction:column}.row button{width:100%}}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><div class="brand">OGENIC • GOD TOOLKIT <span style="color:var(--gold)">v1.3.0</span></div><div class="pill">AUTO ROUTE</div></div>
  <section class="command">
    <label for="request">ASK OGENIC</label>
    <div class="row"><input id="request" placeholder="Describe the outcome…" value="หาร้านที่กำลังหาซัพพลายเออร์เบเกอรี่"/><button id="routeBtn">Route</button></div>
    <div class="chips"><span class="chip">Build</span><span class="chip">Automate</span><span class="chip">Website</span><span class="chip">Data</span><span class="chip">Sales</span><span class="chip">Media</span><span class="chip">Status</span></div>
  </section>

  <div class="grid">
    <section class="panel">
      <h2>ROUTE</h2>
      <div id="route" class="route"><span style="color:var(--muted)">No route selected yet.</span></div>
    </section>

    <section class="panel">
      <h2>CAPABILITY INDEX</h2>
      <div id="caps" class="caps"></div>
    </section>

    <section class="panel">
      <h2>AGENTS / CONNECTORS</h2>
      <div id="surfaces"></div>
    </section>
  </div>
  <div class="footer">Read before write • Human approval for consequential actions • Verify before claiming success</div>
</div>
<script type="module">
const routeEl=document.querySelector('#route');const capsEl=document.querySelector('#caps');const surfacesEl=document.querySelector('#surfaces');const requestEl=document.querySelector('#request');const routeBtn=document.querySelector('#routeBtn');
let rpcId=0;const pending=new Map();let latest={};
function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*')}
function request(method,params){return new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
window.addEventListener('message',(event)=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result'){const sc=m.params?.structuredContent;if(sc)update(sc)}},{passive:true});
async function init(){try{await request('ui/initialize',{appInfo:{name:'ogenic-control-tower',version:'1.3.0'},appCapabilities:{},protocolVersion:'2026-01-26'});notify('ui/notifications/initialized',{});const [cap,status]=await Promise.all([request('tools/call',{name:'list_capabilities',arguments:{}}),request('tools/call',{name:'get_runtime_status',arguments:{}})]);update(cap?.structuredContent||{});update(status?.structuredContent||{})}catch(e){console.error(e)}}
function update(sc){latest={...latest,...sc};render()}
function render(){if(latest.route)renderRoute(latest.route);if(latest.capabilities)renderCaps(latest.capabilities);if(latest.surfaces)renderSurfaces(latest.surfaces)}
function renderRoute(r){routeEl.innerHTML=`<strong>${esc(r.primary||'unrouted')}</strong><div class="kv"><span>Support</span><span>${esc((r.support||[]).join(', ')||'—')}</span><span>Approval</span><span>${esc(r.approval||'—')}</span><span>Verify</span><span>${r.verify?'required':'—'}</span></div>`}
function renderCaps(caps){capsEl.innerHTML='';for(const c of caps){const div=document.createElement('div');div.className='cap'+(c.id==='06'?' hot':'');div.innerHTML=`<b>${esc(c.id)} · ${esc(c.name)}</b><small>${esc((c.children||[]).slice(0,5).join(' · '))}</small>`;capsEl.appendChild(div)}}
function renderSurfaces(items){surfacesEl.innerHTML='';for(const s of items){const div=document.createElement('div');div.className='status';div.innerHTML=`<span>${esc(s.name)}</span><span class="state ${esc(s.status)}">${esc(s.status)}</span>`;surfacesEl.appendChild(div)}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
routeBtn.addEventListener('click',async()=>{const text=requestEl.value.trim();if(!text)return;routeBtn.disabled=true;routeBtn.textContent='Routing…';try{const r=await request('tools/call',{name:'route_request',arguments:{request:text}});update({route:r?.structuredContent})}catch(e){routeEl.textContent='Routing failed: '+(e?.message||String(e))}finally{routeBtn.disabled=false;routeBtn.textContent='Route'}});
init();
</script>
</body>
</html>
