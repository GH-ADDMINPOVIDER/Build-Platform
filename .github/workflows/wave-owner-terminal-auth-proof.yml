name: WAVE Owner — Runner-1 Terminal & Dual Codex Identity Proof
on:
  push:
    branches: [fix/owner-terminal-runtime-20261017, phase-vi-provider-incentive-metering, task/oge-128-runtime-certificate-20261018]
    paths:
      - ".github/workflows/wave-owner-terminal-auth-proof.yml"
      - "scripts/owner-terminal-auth-proof.mjs"
      - "worker/entry-yellow-stone.ts"
      - "ops/owner-terminal-request.json"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
env:
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}
concurrency:
  group: wave-owner-auth-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  terminal-proof:
    if: github.repository == 'Ogenicchocolate21debug/Build-Platform' && contains(fromJSON('["Ogenicchocolate21debug","Wave-Runner-2"]'), github.actor)
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 25
    steps:
      - name: Checkout exact source SHA without stored GitHub credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert trusted feature branch and self-hosted terminal
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            fix/owner-terminal-runtime-20261017|phase-vi-provider-incentive-metering|task/oge-128-runtime-certificate-20261018) ;;
            *) echo 'REF_SCOPE_NOT_ALLOWED'; exit 64 ;;
          esac
          test "$RUNNER_NAME" = wave-runner-01
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "TERMINAL_TRANSPORT=GITHUB_ACTIONS_SELFHOSTED"
      - name: Validate bounded owner request (no arbitrary terminal command)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync("ops/owner-terminal-request.json", "utf8"));
          const good = r.schema === "ogenic.owner.terminal-request.v1"
            && /^[A-Za-z0-9._-]{8,100}$/.test(r.request_id)
            && r.operation === "READINESS_AND_BUILD"
            && r.target === "wave-runner-01"
            && r.execution === "SEQUENTIAL"
            && r.no_arbitrary_shell === true && r.no_raw_credentials === true;
          if (!good) throw new Error("UNAUTHORIZED_TERMINAL_OPERATION");
          console.log("OWNER_TERMINAL_REQUEST_ACCEPTED="+r.request_id);
          console.log("OWNER_TERMINAL_OPERATION=READINESS_AND_BUILD");
          NODE
      - name: Verify runner-service Codex context with sanitized claims
        shell: bash
        env:
          OPENAI_API_KEY: ""
          CODEX_API_KEY: ""
          CODEX_PROOF_OUTPUT: owner-terminal-auth-proof.json
        run: |
          set -euo pipefail
          node scripts/owner-terminal-auth-proof.mjs
      - name: Discover existing root Codex identity with Docker read-only (no SSH or OAuth changes)
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "wave-runner-01"
          # Reuse an image already installed on Runner-1; no pulling/building.
          # The host root directory is read-only. Never copy or print auth.json.
          mapfile -t images < <(docker image ls --format '{{.Repository}}:{{.Tag}}' | awk '$0 !~ /<none>/')
          shell_image=""
          node_image=""
          for img in "${images[@]}"; do
            if [ -z "$shell_image" ] && docker run --rm --network none --read-only --user 0:0 --entrypoint /bin/sh "$img" -c 'exit 0' >/dev/null 2>&1; then
              shell_image="$img"
            fi
            if [ -z "$node_image" ] && docker run --rm --network none --read-only --user 0:0 --entrypoint /bin/sh "$img" -c 'command -v node >/dev/null 2>&1' >/dev/null 2>&1; then
              node_image="$img"
            fi
            if [ -n "$shell_image" ] && [ -n "$node_image" ]; then break; fi
          done
          if [ -z "$shell_image" ]; then
            echo "ROOT_DOCKER_CONTEXT=NO_PREEXISTING_LOCAL_SHELL_IMAGE"
            exit 0
          fi
          docker run --rm --network none --read-only --user 0:0 --entrypoint /bin/sh \
            -v /root:/host-root:ro "$shell_image" -eu -c '
              for entry in ROOT_DEFAULT:/host-root/.codex ROOT_TS:/host-root/.codex-ts ROOT_GS:/host-root/.codex-gs ROOT_CONFIG_TS:/host-root/.config/codex-ts; do
                label="${entry%%:*}"
                folder="${entry#*:}"
                if [ -f "$folder/auth.json" ]; then echo "CODEX_${label}_AUTH_METADATA=PRESENT"
                elif [ -d "$folder" ]; then echo "CODEX_${label}_AUTH_METADATA=NO_AUTH_JSON"
                else echo "CODEX_${label}_AUTH_METADATA=NO_DIRECTORY"; fi
              done
            '
          if [ -z "$node_image" ]; then
            echo "ROOT_DOCKER_CLAIM_PROOF=NODE_IMAGE_NOT_INSTALLED"
            exit 0
          fi
          # Run the EXISTING claim-only auditor inside ephemeral Docker root.
          # HOME points at the host root's read-only mount; output stays tmpfs.
          docker run --rm --network none --read-only --user 0:0 \
            --tmpfs /tmp:rw,nosuid,noexec,size=4m --workdir /tmp \
            --entrypoint /bin/sh \
            -e HOME=/host-root -e CODEX_HOME=/host-root/.codex \
            -e CODEX_PROOF_OUTPUT=/tmp/root-codex-identity.json \
            -e OPENAI_API_KEY= -e CODEX_API_KEY= -e GH_TOKEN= -e GITHUB_TOKEN= \
            -v /root:/host-root:ro \
            -v "$GITHUB_WORKSPACE/scripts/owner-terminal-auth-proof.mjs":/root-proof.mjs:ro \
            "$node_image" -eu -c 'node /root-proof.mjs'
          echo "ROOT_DOCKER_CLAIM_PROOF=FINISHED_NO_OAUTH_MUTATION"
      - name: Discover canonical Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh
      - name: Load bounded SSH authorization via Infisical OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true
      - name: Verify SSH root Codex context with sanitized claims
        shell: bash
        run: |
          set -euo pipefail
          known_hosts="$RUNNER_TEMP/oge128-known-hosts"
          key_file="$RUNNER_TEMP/oge128-root-ssh-key"
          askpass="$RUNNER_TEMP/oge128-ssh-askpass"
          cleanup() {
            ssh-agent -k >/dev/null 2>&1 || true
            rm -f "$known_hosts" "$key_file" "$askpass"
          }
          trap cleanup EXIT

          # Prefer the dedicated name. Compatibility fallbacks are accepted only
          # when the resolved value is a real private key; values are never printed.
          key_material="${WAVE_RUNNER_01_SSH_PRIVATE_KEY:-${SSH_PRIVATE_KEY:-${SSH_KEY:-}}}"
          case "$key_material" in
            *"BEGIN "*"PRIVATE KEY"*) ;;
            *) echo 'CONFIGURATION_REQUIRED:WAVE_RUNNER_01_SSH_PRIVATE_KEY'; exit 78 ;;
          esac
          umask 077
          printf '%s\n' "$key_material" | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"

          # ssh-add supports encrypted keys without putting the passphrase in
          # command arguments. Prefer a dedicated passphrase secret; the owner-
          # supplied SSH_KEY compatibility fallback is copied only into a masked
          # process environment and is never printed.
          export SSH_EFFECTIVE_KEY_PASSPHRASE="${SSH_PRIVATE_KEY_PASSPHRASE:-${SSH_KEY:-}}"
          printf '%s\n' '#!/bin/sh' 'exec printenv SSH_EFFECTIVE_KEY_PASSPHRASE' > "$askpass"
          chmod 700 "$askpass"
          eval "$(ssh-agent -s)" >/dev/null
          if ! DISPLAY=:0 SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force setsid -w ssh-add "$key_file" </dev/null >/dev/null 2>&1; then
            echo 'CONFIGURATION_REQUIRED:SSH_KEY_PASSPHRASE_OR_KEY_MISMATCH'
            exit 78
          fi
          echo "SSH_PRIVATE_KEY_VALID=true"
          echo "SSH_PRIVATE_KEY_AGENT_LOADED=true"
          loaded_key_fingerprint="$(ssh-add -L | ssh-keygen -lf - -E md5 | awk 'NR==1 {print $2}')"
          echo "SSH_PRIVATE_KEY_FINGERPRINT=$loaded_key_fingerprint"
          if [ "$loaded_key_fingerprint" != "MD5:70:66:fc:1e:e7:18:99:65:b0:d4:82:9d:c7:b8:79:fa" ]; then
            echo "CONFIGURATION_REQUIRED:PRIVATE_KEY_DOES_NOT_MATCH_DIGITALOCEAN_WAVE_IPHONE"
            exit 78
          fi
          echo "DIGITALOCEAN_WAVE_IPHONE_KEY_MATCH=true"

          # The self-hosted runner's Docker group is an existing root-equivalent
          # host capability. Use it only for this exact, validated public key and
          # exact target directory; do not mount any other host path.
          mapfile -t local_images < <(docker image ls --format '{{.Repository}}:{{.Tag}}' | awk '$0 !~ /<none>/')
          repair_image=""
          for candidate in "${local_images[@]}"; do
            if docker run --rm --network none --read-only --user 0:0 --entrypoint /bin/sh "$candidate" -c 'exit 0' >/dev/null 2>&1; then
              repair_image="$candidate"
              break
            fi
          done
          if [ -z "$repair_image" ]; then
            echo "CONFIGURATION_REQUIRED:NO_LOCAL_DOCKER_IMAGE_WITH_SHELL"
            exit 78
          fi
          root_public_key="$(ssh-add -L | awk 'NR==1 {print $1 " " $2 " WAVE-iPhone"}')"
          docker run --rm --network none --user 0:0 --entrypoint /bin/sh \
            -e WAVE_ROOT_PUBLIC_KEY="$root_public_key" \
            -v /root/.ssh:/target-ssh:rw "$repair_image" -eu -c '
              umask 077
              mkdir -p /target-ssh
              touch /target-ssh/authorized_keys
              key_blob="${WAVE_ROOT_PUBLIC_KEY#* }"
              key_blob="${key_blob%% *}"
              if ! awk -v blob="$key_blob" '"'"'$2 == blob { found=1 } END { exit !found }'"'"' /target-ssh/authorized_keys; then
                printf "\n%s\n" "$WAVE_ROOT_PUBLIC_KEY" >> /target-ssh/authorized_keys
              fi
              chown 0:0 /target-ssh /target-ssh/authorized_keys
              chmod 700 /target-ssh
              chmod 600 /target-ssh/authorized_keys
            '
          echo "ROOT_AUTHORIZED_KEY_ENSURED=true"

          ssh-keyscan -H 127.0.0.1 > "$known_hosts" 2>/dev/null
          remote_checkout="$(pwd)"
          ssh -o IdentityAgent="$SSH_AUTH_SOCK" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 \
            -o UserKnownHostsFile="$known_hosts" -o StrictHostKeyChecking=yes \
            root@127.0.0.1 \
            "cd '$remote_checkout' && env PATH='$PATH' OPENAI_API_KEY='' CODEX_API_KEY='' GH_TOKEN='' GITHUB_TOKEN='' CODEX_PROOF_OUTPUT=/tmp/root-codex-auth-proof.json '$(command -v node)' scripts/owner-terminal-auth-proof.mjs"
          scp -o IdentityAgent="$SSH_AUTH_SOCK" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 \
            -o UserKnownHostsFile="$known_hosts" -o StrictHostKeyChecking=yes \
            root@127.0.0.1:/tmp/root-codex-auth-proof.json root-codex-auth-proof.json
          ssh -o IdentityAgent="$SSH_AUTH_SOCK" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 \
            -o UserKnownHostsFile="$known_hosts" -o StrictHostKeyChecking=yes \
            root@127.0.0.1 "rm -f /tmp/root-codex-auth-proof.json"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve repository dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund && npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Wave Command transport typing
        run: npm run typecheck
      - name: Build staging source without any deployment
        run: npm run build
      - name: Publish sanitized credential-free evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-owner-terminal-auth-proof-${{ github.run_id }}
          path: |
            owner-terminal-auth-proof.json
            root-codex-auth-proof.json
          retention-days: 90
          if-no-files-found: warn
      - name: Print exact proof scope
        if: always()
        shell: bash
        run: |
          {
            echo "### WAVE Owner Runner-1 Terminal proof"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Runner: $RUNNER_NAME"
            echo "- Credentials/token contents: not emitted or uploaded"
            echo "- Verifies local Codex identities only, NOT Codex inference or GitHub secondary login session"
            echo "- No secrets/Infisical values changed, no deploy, no production/main/Candy changes"
          } >> "$GITHUB_STEP_SUMMARY"
