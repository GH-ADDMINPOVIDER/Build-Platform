name: OGENIC Phase VI Cloudflare Staging

on:
  push:
    branches: [phase-vi-unified-cloudflare]
    paths:
      - ".github/workflows/phase-vi-cloudflare-staging.yml"
      - "src/**"
      - "worker/**"
      - "database/**"
      - "config/**"
      - "package.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  WORKER_NAME: ogenic-phase-vi-staging
  D1_DATABASE_NAME: ogenic-phase-vi-staging
  STAGING_URL: https://ogenic-phase-vi-staging.tawatchaisamornrum11.workers.dev

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load Cloudflare deploy credentials from Infisical via OIDC
        if: ${{ vars.INFISICAL_IDENTITY_ID != '' && vars.INFISICAL_PROJECT_SLUG != '' && vars.INFISICAL_ENV_SLUG != '' }}
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH || '/connectors/cloudflare' }}

      - name: Report deployment credential source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ vars.INFISICAL_IDENTITY_ID }}" ] && [ -n "${{ vars.INFISICAL_PROJECT_SLUG }}" ] && [ -n "${{ vars.INFISICAL_ENV_SLUG }}" ]; then
            echo "Deployment credential source: Infisical OIDC Machine Identity"
          else
            echo "Deployment credential source: GitHub encrypted-secret fallback (temporary migration path)"
          fi

      - name: Require Cloudflare authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::REAUTH_REQUIRED: missing CLOUDFLARE_API_TOKEN from Infisical OIDC or GitHub fallback"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::REAUTH_REQUIRED: missing CLOUDFLARE_ACCOUNT_ID from Infisical OIDC or GitHub fallback"
            exit 1
          fi

      - name: Verify Cloudflare account token and D1 access
        shell: bash
        run: |
          set -euo pipefail

          VERIFY_JSON="$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")"

          VERIFY_SUCCESS="$(printf '%s' "$VERIFY_JSON" | jq -r '.success // false')"
          VERIFY_STATUS="$(printf '%s' "$VERIFY_JSON" | jq -r '.result.status // "unknown"')"
          echo "Cloudflare account-token verify: success=${VERIFY_SUCCESS}, status=${VERIFY_STATUS}"

          if [ "$VERIFY_SUCCESS" != "true" ] || [ "$VERIFY_STATUS" != "active" ]; then
            printf '%s' "$VERIFY_JSON" | jq -r '.errors[]? | "::error::Cloudflare token verify failed: [\(.code)] \(.message)"'
            exit 1
          fi

          D1_JSON="$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database")"

          D1_SUCCESS="$(printf '%s' "$D1_JSON" | jq -r '.success // false')"
          if [ "$D1_SUCCESS" != "true" ]; then
            printf '%s' "$D1_JSON" | jq -r '.errors[]? | "::error::Cloudflare D1 access failed: [\(.code)] \(.message)"'
            exit 1
          fi

          echo "Cloudflare D1 access probe: success=true"

      - name: Install dependencies
        run: npm install --package-lock-only && npm ci

      - name: Resolve or create staging D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          DB_ID="$(npx wrangler d1 list --json | jq -r --arg NAME "$D1_DATABASE_NAME" '.[] | select(.name == $NAME) | .uuid' | head -n1)"
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Creating staging D1 database: $D1_DATABASE_NAME"
            npx wrangler d1 create "$D1_DATABASE_NAME" --location apac >/tmp/d1-create.txt
            DB_ID="$(npx wrangler d1 list --json | jq -r --arg NAME "$D1_DATABASE_NAME" '.[] | select(.name == $NAME) | .uuid' | head -n1)"
          fi
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "::error::Could not resolve staging D1 database UUID"
            exit 1
          fi
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Generate staging Cloudflare binding
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('wrangler.jsonc')
          cfg = json.loads(path.read_text())
          cfg['name'] = os.environ['WORKER_NAME']
          cfg['d1_databases'] = [{
              'binding': 'DB',
              'database_name': os.environ['D1_DATABASE_NAME'],
              'database_id': os.environ['D1_DATABASE_ID'],
              'migrations_dir': 'database/migrations'
          }]
          path.write_text(json.dumps(cfg, indent=2) + '\n')
          PY

      - name: Apply D1 migrations to staging
        run: npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config wrangler.jsonc

      - name: Typecheck and build staging application
        run: npm run check

      - name: Deploy staging Worker
        run: npx wrangler deploy --config dist/ogenic_phase_vi_staging/wrangler.json

      - name: Verify staging health
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="${STAGING_URL}/api/health"
          echo "Checking ${HEALTH_URL}"
          BODY="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$HEALTH_URL")"
          echo "$BODY"
          printf '%s' "$BODY" | jq -e '.ok == true or .status == "ok" or .status == "healthy"' >/dev/null
          echo "Staging health verified."

      - name: Report staging endpoint
        shell: bash
        run: |
          echo "Staging deployment and health verification completed: ${STAGING_URL}"
