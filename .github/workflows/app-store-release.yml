name: OGENIC App Store Release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the validated OGENIC AI build to App Store Connect"
        required: true
        type: boolean
        default: false
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - ".appstore/release.request"

permissions:
  contents: read
  id-token: write

env:
  BUNDLE_ID: ai.ogenic.chat
  APP_NAME: OGENIC AI
  ARCHIVE_PATH: build/OGENICAI.xcarchive
  EXPORT_PATH: build/appstore
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}
  INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG || 'staging' }}

jobs:
  app-store:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Auto-discover Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load Apple release credentials from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /apple

      - name: Require Apple release credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APPLE_TEAM_ID:-}" || { echo "::error::Missing APPLE_TEAM_ID in Infisical /apple"; exit 1; }
          test -n "${APPSTORE_CONNECT_KEY_ID:-}" || { echo "::error::Missing APPSTORE_CONNECT_KEY_ID in Infisical /apple"; exit 1; }
          test -n "${APPSTORE_CONNECT_ISSUER_ID:-}" || { echo "::error::Missing APPSTORE_CONNECT_ISSUER_ID in Infisical /apple"; exit 1; }
          test -n "${APPSTORE_CONNECT_PRIVATE_KEY:-}" || { echo "::error::Missing APPSTORE_CONNECT_PRIVATE_KEY in Infisical /apple"; exit 1; }
          echo "Apple release credentials are present; values remain masked."

      - name: Install dependencies
        run: npm install

      - name: Typecheck and build web shell
        run: npm run check

      - name: Generate and sync native iOS project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Prepare App Store Connect API key
        id: apple_key
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/appstore-connect"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APPSTORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Archive signed OGENIC AI app
        shell: bash
        env:
          APPLE_KEY_PATH: ${{ steps.apple_key.outputs.key_path }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_CONNECT_ISSUER_ID" \
            archive

      - name: Create App Store export options
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export signed IPA
        shell: bash
        env:
          APPLE_KEY_PATH: ${{ steps.apple_key.outputs.key_path }}
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_CONNECT_ISSUER_ID"
          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH" || { echo "::error::Signed IPA was not produced"; exit 1; }
          echo "IPA ready: $(basename "$IPA_PATH")"

      - name: Save signed IPA as private CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogenic-ai-ios-signed
          path: build/appstore/*.ipa
          if-no-files-found: error
          retention-days: 3

      - name: Validate build with App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "${{ steps.apple_key.outputs.key_path }}" "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"
          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool \
            --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APPSTORE_CONNECT_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_ISSUER_ID"

      - name: Upload build to App Store Connect
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        shell: bash
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APPSTORE_CONNECT_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_ISSUER_ID"
          echo "OGENIC AI upload accepted by App Store Connect. Apple processing/review is separate."
