name: OGE-94 Provider Onboarding Preflight (Zero Paid Calls)

on:
  push:
    branches: [Unified-on-Progress]
    paths:
      - ".github/workflows/oge-94-provider-onboarding-live-proof.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  STAGING_URL: https://wave.ogenicchocolate.com
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}

jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Discover canonical staging Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh
      - name: Load existing staging ops key via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true
      - name: Prove new provider admission contract on live Worker without spending
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OGENIC_OPS_KEY:-}" || { echo "::error::OPS_KEY_NOT_BOUND"; exit 1; }
          route="${STAGING_URL}/api/provider-readiness/onboarding"
          public_http="$(curl -sS --max-time 15 -o /tmp/oge94-unauth.json -w '%{http_code}' "$route" || true)"
          echo "Unauthenticated onboarding route: HTTP $public_http"
          test "$public_http" = 401 || { echo "::error::OWNER_AUTH_BYPASS_OR_ROUTE_MISSING"; exit 1; }
          http="$(curl -sS --max-time 25 -o /tmp/oge94-onboarding.json -w '%{http_code}' -H "x-ogenic-ops-key: ${OGENIC_OPS_KEY}" "$route" || true)"
          echo "Authenticated onboarding route: HTTP $http"
          test "$http" = 200 || { echo "::error::ONBOARDING_ROUTE_UNAVAILABLE"; exit 1; }
          jq -e '
            .ok == true and
            .runtime == "PROVIDER_ONBOARDING_PREFLIGHT_V1" and
            .paid_completion_calls == false and
            .read_only == true and
            .policy.runtime_preflight.paid_provider_calls == 0 and
            any(.providers[]; .provider == "deepseek" and .stage == "ROUTE_ELIGIBLE" and .next_action == "READY_EXPLICIT_ONLY") and
            any(.providers[]; .provider == "gemini" and .stage == "ROUTE_ELIGIBLE" and .next_action == "READY_AUTO_READ") and
            all(.providers[]; (.provider == "gemini" or .provider == "deepseek") or (.route_eligible == false))
          ' /tmp/oge94-onboarding.json >/dev/null
          jq -c '.providers[] | {provider, stage, next_action, readiness, route_eligible}' /tmp/oge94-onboarding.json
          {
            echo "### OGE-94 One-Pass Provider Onboarding"
            echo "- HTTP 401 unauthenticated and HTTP 200 authenticated: PASS"
            echo "- DeepSeek EXPLICIT READ, Gemini existing READ: VERIFIED"
            echo "- Unproven providers not auto-promoted: PASS"
            echo "- Provider completions and new API keys: 0"
          } >> "$GITHUB_STEP_SUMMARY"
