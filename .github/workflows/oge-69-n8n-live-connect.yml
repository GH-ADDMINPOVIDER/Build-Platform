name: OGE-69/70 n8n Live Connect + Execution Fabric Proof

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}
  N8N_SELFHOST_BASE_URL: ${{ vars.N8N_SELFHOST_BASE_URL || 'https://n8n-staging-76b7.up.railway.app' }}
  WORKFLOW_FILE: deploy/n8n-selfhost/workflows/ogenic-core-safe-connector-test-ready.sanitized.json

jobs:
  connect:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: OGE-70 execution-fabric contract
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/oge-70-n8n-execution-fabric.test.mjs
          npm run typecheck
          npm run build

      - name: Discover Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load staging secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true

      - name: Normalize n8n self-host API key alias
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${N8N_SELFHOST_API_KEY:-}" ] && [ -n "${N8N_SELFHOST_REGISTRY_API_KEY:-}" ]; then
            echo "N8N_SELFHOST_API_KEY=${N8N_SELFHOST_REGISTRY_API_KEY}" >> "$GITHUB_ENV"
          elif [ -z "${N8N_SELFHOST_API_KEY:-}" ] && [ -n "${N8N_API_KEY:-}" ]; then
            echo "N8N_SELFHOST_API_KEY=${N8N_API_KEY}" >> "$GITHUB_ENV"
            echo "Using N8N_API_KEY as a compatibility candidate for self-host verification."
          fi

      - name: Verify n8n API authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "${N8N_SELFHOST_API_KEY:-}" || { echo "::error::N8N_SELFHOST_API_KEY missing in Infisical staging"; exit 1; }
          STATUS="$(curl -sS -o /tmp/n8n-workflows.json -w '%{http_code}' \
            -H "Accept: application/json" \
            -H "X-N8N-API-KEY: ${N8N_SELFHOST_API_KEY}" \
            "${N8N_SELFHOST_BASE_URL}/api/v1/workflows?limit=100")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::n8n API authentication failed with HTTP $STATUS"
            exit 1
          fi
          jq -e '.data | type == "array"' /tmp/n8n-workflows.json >/dev/null
          echo "n8n API authentication: READY"

      - name: Import recovered 95-node orchestrator if absent
        id: import
        shell: bash
        run: |
          set -euo pipefail
          NAME="$(jq -r '.name' "$WORKFLOW_FILE")"
          EXISTING_ID="$(jq -r --arg NAME "$NAME" '.data[]? | select(.name == $NAME) | .id' /tmp/n8n-workflows.json | head -n1)"

          if [ -n "$EXISTING_ID" ]; then
            echo "workflow_id=$EXISTING_ID" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Recovered orchestrator already exists; leaving it unchanged."
            exit 0
          fi

          jq '{name,nodes,connections,settings:(.settings // {})}' "$WORKFLOW_FILE" > /tmp/n8n-import.json
          STATUS="$(curl -sS -o /tmp/n8n-created.json -w '%{http_code}' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "X-N8N-API-KEY: ${N8N_SELFHOST_API_KEY}" \
            --data-binary @/tmp/n8n-import.json \
            "${N8N_SELFHOST_BASE_URL}/api/v1/workflows")"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            CODE="$(jq -r '.message // .error // "unknown"' /tmp/n8n-created.json 2>/dev/null || true)"
            echo "::error::n8n workflow import failed: HTTP $STATUS, response=$CODE"
            exit 1
          fi
          ID="$(jq -r '.id // empty' /tmp/n8n-created.json)"
          test -n "$ID" || { echo "::error::n8n create workflow returned no id"; exit 1; }
          echo "workflow_id=$ID" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Recovered orchestrator imported as a new workflow."

      - name: Verify inactive 95-node contract
        shell: bash
        env:
          WORKFLOW_ID: ${{ steps.import.outputs.workflow_id }}
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /tmp/n8n-workflow.json -w '%{http_code}' \
            -H "Accept: application/json" \
            -H "X-N8N-API-KEY: ${N8N_SELFHOST_API_KEY}" \
            "${N8N_SELFHOST_BASE_URL}/api/v1/workflows/${WORKFLOW_ID}")"
          test "$STATUS" = "200" || { echo "::error::workflow verification failed HTTP $STATUS"; exit 1; }
          jq -e '
            (.active == false) and
            ((.nodes // []) | length == 95)
          ' /tmp/n8n-workflow.json >/dev/null
          echo "n8n recovered orchestrator proof: INACTIVE + 95 NODES"

      - name: Sync OGE-70 inactive execution-fabric modules
        shell: bash
        run: |
          set -euo pipefail
          MODULES=(
            "deploy/n8n-selfhost/workflows/ogenic-oge62-flow-preaudit-v1.sanitized.json|5"
            "deploy/n8n-selfhost/workflows/ogenic-evidence-normalizer-v1.sanitized.json|4"
            "deploy/n8n-selfhost/workflows/ogenic-task-router-v1.sanitized.json|4"
            "deploy/n8n-selfhost/workflows/ogenic-violet-pipeline-orchestrator-v1.sanitized.json|4"
          )

          curl -sS --fail \
            -H "Accept: application/json" \
            -H "X-N8N-API-KEY: ${N8N_SELFHOST_API_KEY}" \
            "${N8N_SELFHOST_BASE_URL}/api/v1/workflows?limit=100" \
            -o /tmp/n8n-modules-before.json

          for spec in "${MODULES[@]}"; do
            file="${spec%%|*}"
            expected_nodes="${spec##*|}"
            name="$(jq -r '.name' "$file")"
            existing_id="$(jq -r --arg NAME "$name" '.data[]? | select(.name == $NAME) | .id' /tmp/n8n-modules-before.json | head -n1)"

            if [ -z "$existing_id" ]; then
              jq '{name,nodes,connections,settings:(.settings // {})}' "$file" > /tmp/n8n-module-import.json
              status="$(curl -sS -o /tmp/n8n-module-created.json -w '%{http_code}' \
                -X POST \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -H "X-N8N-API-KEY: ${N8N_SELFHOST_API_KEY}" \
                --data-binary @/tmp/n8n-module-import.json \
                "${N8N_SELFHOST_BASE_URL}/api/v1/workflows")"
              if [ "$status" != "200" ] && [ "$status" != "201" ]; then
                echo "::error::failed to import $name (HTTP $status)"
                exit 1
              fi
              existing_id="$(jq -r '.id // empty' /tmp/n8n-module-created.json)"
              test -n "$existing_id" || { echo "::error::$name returned no workflow id"; exit 1; }
              echo "Imported OGE-70 module: $name"
            else
              echo "OGE-70 module already present: $name"
            fi

            curl -sS --fail \
              -H "Accept: application/json" \
              -H "X-N8N-API-KEY: ${N8N_SELFHOST_API_KEY}" \
              "${N8N_SELFHOST_BASE_URL}/api/v1/workflows/${existing_id}" \
              -o /tmp/n8n-module-verify.json

            jq -e --argjson N "$expected_nodes" '
              (.active == false) and
              ((.nodes // []) | length == $N) and
              ([.nodes[]? | has("credentials")] | all(. == false))
            ' /tmp/n8n-module-verify.json >/dev/null
          done

          echo "OGE-70 n8n execution-fabric modules: IMPORTED/VERIFIED INACTIVE."

      - name: Verify final n8n execution-fabric inventory
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail \
            -H "Accept: application/json" \
            -H "X-N8N-API-KEY: ${N8N_SELFHOST_API_KEY}" \
            "${N8N_SELFHOST_BASE_URL}/api/v1/workflows?limit=100" \
            -o /tmp/n8n-final.json

          EXPECTED_NAMES=(
            "OGENIC | OGE-62 | Flow Pre-Audit | v1 | INACTIVE"
            "OGENIC | Evidence Normalizer | OGE-27/28/43/57 | v1 | INACTIVE"
            "OGENIC | OGE Task Router | OGE-6/57/27/28/43/58/59/60 | v1 | INACTIVE"
            "OGENIC | Violet Pipeline Orchestrator | OGE-37/39/42/47/48/61 | v1 | INACTIVE"
          )
          for name in "${EXPECTED_NAMES[@]}"; do
            jq -e --arg NAME "$name" '.data[]? | select(.name == $NAME and .active == false)' /tmp/n8n-final.json >/dev/null
          done
          echo "Final n8n inventory contains all OGE-70 modules and all are inactive."

      - name: Persist OGE-70 verified proof marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ogenic/proofs
          cat > .ogenic/proofs/oge-70-n8n-closeout.json <<EOF
          {
            "schema": "OGE70_N8N_CLOSEOUT_PROOF_V1",
            "verified": true,
            "source_commit": "$GITHUB_SHA",
            "github_run_id": "$GITHUB_RUN_ID",
            "branch": "$GITHUB_REF_NAME",
            "n8n_api_auth": "READY",
            "recovered_orchestrator": {"node_count": 95, "active": false},
            "execution_fabric_modules": {"expected": 4, "present": 4, "active": false},
            "contract_test": "PASS",
            "typecheck": "PASS",
            "build": "PASS",
            "control_authority": "MAOP_YELLOW",
            "verification_authority": "RUBY_STONE",
            "retention": "GREEN_1LSS_AFTER_VERIFICATION",
            "raw_secrets_persisted": false,
            "main_prod_candy_touched": false,
            "d1_schema_changed": false
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ogenic/proofs/oge-70-n8n-closeout.json
          git commit -m "proof: verify OGE-70 n8n execution fabric" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Write safe summary
        shell: bash
        env:
          WORKFLOW_ID: ${{ steps.import.outputs.workflow_id }}
          CREATED: ${{ steps.import.outputs.created }}
        run: |
          {
            echo "### OGE-69/70 n8n Closeout Proof"
            echo ""
            echo "- API auth: READY"
            echo "- Recovered orchestrator workflow ID: `$WORKFLOW_ID`"
            echo "- Recovered orchestrator created this run: `$CREATED`"
            echo "- Recovered orchestrator: `95 nodes / active=false`"
            echo "- OGE-70 execution-fabric modules: `4/4 present`"
            echo "- OGE-70 execution-fabric modules active: `false`"
            echo "- Contract test: `PASS`"
            echo "- Typecheck/build: `PASS`"
            echo "- Control authority: `MA-OP / Yellow`"
            echo "- Verification authority: `Ruby`"
            echo "- Retention: `Green / 1LSS after verification`"
            echo "- Secret values: not printed"
          } >> "$GITHUB_STEP_SUMMARY"
