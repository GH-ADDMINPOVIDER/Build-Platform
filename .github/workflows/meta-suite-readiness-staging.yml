name: Meta Facebook Staging Readiness

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - ".github/workflows/meta-suite-readiness-staging.yml"
      - "config/meta-suite.staging.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Discover Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load canonical credentials from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: ${{ steps.infisical_project.outputs.secret_env_slug }}
          secret-path: ${{ steps.infisical_project.outputs.secret_path }}

      - name: Load staging credentials from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true

      - name: Probe Facebook and optional Instagram safely
        shell: bash
        run: |
          set -euo pipefail
          graph_get() {
            local url="$1" token="$2" out="$3"
            test -n "$token" || return 10
            local code
            code="$(curl --silent --show-error --output "$out" --write-out '%{http_code}' \
              -H "Authorization: Bearer ${token}" -H 'Accept: application/json' "$url" || true)"
            test "$code" = "200"
          }
          pick() {
            for name in "$@"; do
              eval "value=\${$name:-}"
              if test -n "$value"; then printf '%s' "$value"; return 0; fi
            done
            return 1
          }
          status_line() { printf '%-28s %s\n' "$1" "$2"; }

          PAGE_TOKEN=""
          PAGE_SOURCE="NONE"
          for candidate in META_PAGE_ACCESS_TOKEN META_ACCESS_TOKEN META_ACCESS_AOUTH_TOKEN META_API_CREATE; do
            eval "value=\${$candidate:-}"
            test -n "$value" || continue
            if graph_get 'https://graph.facebook.com/me?fields=id,name' "$value" /tmp/meta-me.json; then
              PAGE_TOKEN="$value"
              PAGE_SOURCE="$candidate"
              break
            fi
          done

          FB_STATE=AUTH_REQUIRED
          if test -n "$PAGE_TOKEN"; then FB_STATE="TOKEN_VALID(${PAGE_SOURCE})";
          elif test -n "${META_PAGE_ACCESS_TOKEN:-}${META_ACCESS_TOKEN:-}${META_ACCESS_AOUTH_TOKEN:-}${META_API_CREATE:-}"; then FB_STATE=TOKEN_INVALID_ALL_CANDIDATES; fi

          IG_TOKEN="$(pick INSTAGRAM_ACCESS_TOKEN IG_ACCESS_TOKEN || true)"
          IG_ID="$(pick INSTAGRAM_BUSINESS_ACCOUNT_ID META_IG_USER_ID IG_USER_ID || true)"
          PAGE_ID="$(pick META_ID_PAGE META_PAGE_ID || true)"
          IG_SOURCE=NONE
          IG_STATE=NOT_REQUIRED

          if test -n "$IG_TOKEN" && test -n "$IG_ID"; then
            if graph_get "https://graph.facebook.com/${IG_ID}?fields=id,username" "$IG_TOKEN" /tmp/meta-ig.json; then
              IG_STATE=OPTIONAL_READY
              IG_SOURCE=EXPLICIT
            else
              IG_STATE=OPTIONAL_UNAVAILABLE
            fi
          elif test -n "$PAGE_TOKEN"; then
            if graph_get 'https://graph.facebook.com/me/accounts?fields=id,name,instagram_business_account{id,username}' "$PAGE_TOKEN" /tmp/meta-accounts.json; then
              DISCOVERED_IG_ID="$(jq -r '[.data[]?.instagram_business_account?.id // empty][0] // empty' /tmp/meta-accounts.json)"
              if test -n "$DISCOVERED_IG_ID"; then
                IG_STATE=OPTIONAL_AUTO_DISCOVERED
                IG_SOURCE=MANAGED_PAGE
              fi
            fi
            if test "$IG_STATE" = "NOT_REQUIRED" && test -n "$PAGE_ID"; then
              if graph_get "https://graph.facebook.com/${PAGE_ID}?fields=instagram_business_account{id,username}" "$PAGE_TOKEN" /tmp/meta-page-ig.json; then
                DISCOVERED_IG_ID="$(jq -r '.instagram_business_account.id // empty' /tmp/meta-page-ig.json)"
                if test -n "$DISCOVERED_IG_ID"; then
                  IG_STATE=OPTIONAL_AUTO_DISCOVERED
                  IG_SOURCE=KNOWN_PAGE
                fi
              fi
            fi
          fi

          APP_SECRET_STATE=MISSING; test -n "${META_APP_SECRET:-}" && APP_SECRET_STATE=PRESENT
          VERIFY_STATE=MISSING; test -n "${META_VERIFY_TOKEN:-}" && VERIFY_STATE=PRESENT

          {
            echo "## Meta Facebook Staging Readiness"
            echo
            echo '```text'
            status_line 'Facebook/Messenger' "$FB_STATE"
            status_line 'Instagram (optional)' "$IG_STATE"
            status_line 'Instagram source' "$IG_SOURCE"
            status_line 'Meta App Secret' "$APP_SECRET_STATE"
            status_line 'Webhook Verify Token' "$VERIFY_STATE"
            echo '```'
            echo
            echo '- Primary sales channels: Facebook Page/Messenger + LINE OA.'
            echo '- Instagram is optional and only used when it can be discovered from the linked Facebook Page or has explicit valid credentials.'
            echo '- WhatsApp, Threads, and Muse are outside the active sales-channel scope.'
            echo '- No post, message, campaign, comment, or customer-visible action was executed.'
            echo '- No raw token or secret was printed.'
          } >> "$GITHUB_STEP_SUMMARY"

          status_line 'Facebook/Messenger' "$FB_STATE"
          status_line 'Instagram (optional)' "$IG_STATE"
          status_line 'Instagram source' "$IG_SOURCE"
          status_line 'Meta App Secret' "$APP_SECRET_STATE"
          status_line 'Webhook Verify Token' "$VERIFY_STATE"

      - name: Validate capability manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          with open('config/meta-suite.staging.json', encoding='utf-8') as f:
              data = json.load(f)
          ids = [m['id'] for m in data['modules']]
          assert len(ids) == len(set(ids))
          assert data['owner_line'] == 'owner-main'
          assert data['scope']['primary'] == ['line', 'meta-facebook-messenger']
          assert data['scope']['optional'] == ['meta-instagram']
          assert data['policy']['no_raw_secrets'] is True
          assert data['policy']['outbound_side_effects_require_approval'] is True
          print('meta_facebook_scope=PASS modules=%d' % len(ids))
          PY
