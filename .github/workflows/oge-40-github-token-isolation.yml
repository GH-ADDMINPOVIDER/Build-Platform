name: OGE-40 GitHub Token Isolation

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}
  INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG || 'staging' }}

jobs:
  isolate:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Discover Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load staging runtime bindings
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true

      - name: Verify GH_ADDMINPROVIDER binding without exposing its value
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .oge40token

          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path

          canonical = os.environ.get("GH_ADDMINPROVIDER", "")
          url = "https://api.github.com/repos/Wave-Runner-2/Build-Platform/contents/tests/athena-guarded-command-handoff.test.mjs?ref=phase-vi-provider-incentive-metering"

          def has_control(value):
              return any(ord(ch) < 32 or ord(ch) == 127 for ch in value)

          def probe(value):
              base = {
                  "present": bool(value),
                  "http_status": 0,
                  "request_ok": False,
                  "contains_control_chars": has_control(value) if value else False,
                  "exception_type": None,
              }
              if not value:
                  return base
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": "Bearer " + value,
                          "User-Agent": "ogenic-token-isolation",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                      method="GET",
                  )
                  with urllib.request.urlopen(req, timeout=15) as response:
                      base["http_status"] = int(response.status)
                      base["request_ok"] = int(response.status) == 200
                  return base
              except urllib.error.HTTPError as exc:
                  base["http_status"] = int(exc.code)
                  base["exception_type"] = "HTTPError"
                  return base
              except Exception as exc:
                  base["exception_type"] = type(exc).__name__
                  return base

          evidence = {
              "schema": "OGE40_GITHUB_TOKEN_ISOLATION_V2",
              "gh_adminprovider": probe(canonical),
              "values_or_hashes_persisted": False,
          }

          if evidence["gh_adminprovider"]["http_status"] == 200:
              evidence["classification"] = "GH_ADDMINPROVIDER_HEALTHY"
          else:
              evidence["classification"] = "GH_ADDMINPROVIDER_NOT_HEALTHY"

          out = Path("docs/evidence/oge-40-github-token-isolation-latest.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Commit sanitized token isolation evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ogenic-runtime-proof"
          git config user.email "runtime-proof@users.noreply.github.com"
          git add docs/evidence/oge-40-github-token-isolation-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "test(oge-40): isolate GitHub runtime binding health"
          git fetch origin phase-vi-provider-incentive-metering
          git rebase origin/phase-vi-provider-incentive-metering
          git push origin HEAD:phase-vi-provider-incentive-metering
