name: OGE-64 WAVE Shell Hygiene Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: OGE-64 route and cache contracts
        run: node --test tests/oge-64-wave-shell-hygiene.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Legacy boundary guard
        run: |
          set -euo pipefail
          ! grep -E 'from "\./(ControlPlaneV2|ChatModelRouter|AppEnhancements|WorkspacePolish|ConnectorPanel|ProviderConnectWizard|GagVault|LiveAssist|ThemeController)"' src/main.tsx
          grep -q 'lazy(() => import("./LegacyControlSurface"))' src/main.tsx
          grep -q 'key.startsWith(CACHE_PREFIX)' public/sw.js
