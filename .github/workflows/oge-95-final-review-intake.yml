name: OGE-95 Final Review Intake - GitHub + Manus + OpenAI

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - "scripts/oge95-final-review-intake.mjs"
      - "tests/oge95-final-review-intake.test.mjs"
      - ".github/workflows/oge-95-final-review-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oge95-review-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reviewer-intake:
    name: Verify external reviewer receipts without invoking providers
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact staging SHA and runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/phase-vi-provider-incentive-metering'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "REVIEWER_INTAKE_GITHUB_SHA_OK"

      - name: Test normalizer and emit honest connection-state artifact
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/oge95-final-review-intake.test.mjs
          node scripts/oge95-final-review-intake.mjs \
            --audit=docs/evidence/oge-62-flow-audit-latest.json \
            --sha="$GITHUB_SHA" \
            --output=oge95-final-review-intake.json
          node -e '
            const fs=require("node:fs");
            const result=JSON.parse(fs.readFileSync("oge95-final-review-intake.json"));
            if(result.github_audit!=="PASS" ||
               result.final_intake_state!=="GITHUB_ONLY_NO_AGENT_REVIEW" ||
               result.reviewers.manus.state!=="NOT_CONNECTED" ||
               result.reviewers.openai.state!=="NOT_CONNECTED" ||
               result.green_verified_promotion!==false ||
               result.yellow_commit_or_deploy_authority!=="NOT_GRANTED") {
              throw Error("REVIEW_INTAKE_FALSE_PROMOTION");
            }
            console.log("OGE95_REVIEW_INTAKE_LOCAL_PASS_NO_PROVIDER_CALL");
          '

      - name: Store read-only intake evidence
        uses: actions/upload-artifact@v4
        with:
          name: oge95-review-intake-${{ github.run_id }}-${{ github.run_attempt }}
          path: oge95-final-review-intake.json
          retention-days: 14
          if-no-files-found: error
