name: OGE-95 Final Review Intake - GitHub + Manus + OpenAI

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: oge95-review-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reviewer-intake:
    name: Verify external reviewer receipts without invoking providers
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact staging SHA and runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/phase-vi-provider-incentive-metering'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "REVIEWER_INTAKE_GITHUB_SHA_OK"

      - name: Check actual OGE-98 Codex host prerequisites without dispatching an agent
        shell: bash
        run: |
          set -euo pipefail
          node scripts/oge98-codex-host-preflight.mjs
          echo "OGE98_PREFLIGHT_ONLY_NOT_AGENT_EXECUTION"

      - name: Recreate deterministic ten-clone evidence for this exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/oge95-same-sha-audit.test.mjs
          node scripts/oge95-same-sha-audit.mjs --output=oge95-same-sha-audit.json
          node -e '
            const a=require("./oge95-same-sha-audit.json");
            if(a.source_sha!==process.env.GITHUB_SHA || a.audit.length!==10 ||
               a.source_sha_attestation.exact_checkout_match!==true ||
               a.source_sha_attestation.genuinely_parallel_runtime_jobs!==false ||
               a.commit_manifest.execution_approved!==false) throw Error("SAME_SHA_EVIDENCE_INVALID");
            console.log("OGE95_CURRENT_SHA_DETERMINISTIC_REPLAY_PASS");
          '
      - name: Test normalizer and emit honest connection-state artifact
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/oge95-final-review-intake.test.mjs
          node --test tests/oge95-manus-plugin-handoff.test.mjs
          node scripts/oge95-final-review-intake.mjs \
            --audit=oge95-same-sha-audit.json \
            --sha="$GITHUB_SHA" \
            --output=oge95-final-review-intake.json
          node -e '
            const fs=require("node:fs");
            const result=JSON.parse(fs.readFileSync("oge95-final-review-intake.json"));
            if(result.github_audit!=="PASS" ||
               result.final_intake_state!=="GITHUB_ONLY_NO_AGENT_REVIEW" ||
               result.reviewers.manus.state!=="NOT_CONNECTED" ||
               result.reviewers.openai.state!=="NOT_CONNECTED" ||
               result.green_verified_promotion!==false ||
               result.yellow_commit_or_deploy_authority!=="NOT_GRANTED") {
              throw Error("REVIEW_INTAKE_FALSE_PROMOTION");
            }
            console.log("OGE95_SAME_SHA_AUDIT_PASS_AGENT_REVIEW_NOT_CONNECTED");
          '

      - name: Restore prior Stone Runner learning snapshot (best-effort, read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS="$RUNNER_TEMP/oge95-prev-learning"
          mkdir -p "$PREVIOUS"
          # No dependency on gh CLI. Read GitHub artifact bytes via ephemeral Actions token.
          ARTIFACT_JSON="$(curl --fail --silent --show-error --max-time 15 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" 2>/dev/null || true)"
          ID="$(printf "%s" "$ARTIFACT_JSON" | jq -r '[.artifacts[]? | select(.expired == false and (.name | test("^oge95-review-intake-[0-9]+-[0-9]+$")))] | sort_by(.created_at) | last | .id // empty' 2>/dev/null || true)"
          if [[ "$ID" =~ ^[0-9]+$ ]]; then
            if curl --fail --silent --show-error --max-time 20 --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" \
              --output "$PREVIOUS/previous.zip" >/dev/null 2>&1; then
              unzip -p "$PREVIOUS/previous.zip" oge95-stone-runner-learning.json \
                > "$PREVIOUS/oge95-stone-runner-learning.json" 2>/dev/null || true
            fi
          fi
          if test -s "$PREVIOUS/oge95-stone-runner-learning.json"; then
            cp "$PREVIOUS/oge95-stone-runner-learning.json" oge95-previous-learning.json
            echo "OGE95_PRIOR_LEARNING_SNAPSHOT_FOUND"
          else
            echo "OGE95_PRIOR_LEARNING_SNAPSHOT_ABSENT_REBUILD_FROM_CURRENT_EVIDENCE"
          fi

      - name: Let Stone Runner learn from GitHub, Manus, OpenAI evidence only
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/oge95-stone-runner-learning.test.mjs
          node scripts/oge95-stone-runner-learning.mjs \
            --sha="$GITHUB_SHA" \
            --intake=oge95-final-review-intake.json \
            --previous=oge95-previous-learning.json \
            --output=oge95-stone-runner-learning.json
          node -e '
            const f=require("node:fs");
            const a=JSON.parse(f.readFileSync("oge95-stone-runner-learning.json","utf8"));
            if(a.schema!=="OGE95_STONE_RUNNER_LEARNING_V1" ||
               a.model_weights_updated!==false ||
               a.permission_to_commit_or_deploy!=="NOT_GRANTED" ||
               a.promoted_to_green_1lss!==false ||
               a.direct_provider_calls!==0) throw Error("LEARNING_MUST_BE_NON_AUTHORITATIVE");
            console.log("OGE95_STONE_RUNNER_3_SOURCE_LEARNING_CACHE_EMITTED_COUNT="+a.observation_count);
          '

      - name: Load existing staging provider bindings through OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG || 'ogenic-sio-ti-rv' }}
          env-slug: staging
          secret-path: /
          recursive: true

      - name: Probe Manus and OpenAI read-only access without consuming model tokens
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/oge95-provider-readiness.test.mjs
          node scripts/oge95-provider-readiness.mjs --output=oge95-provider-readiness.json
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("oge95-provider-readiness.json"));
            if(report.model_inference_calls !== 0 || report.paid_agent_tasks_created !== false) {
              throw Error("READINESS_PROBE_PAID_ACTION_FORBIDDEN");
            }
            console.log("OGE95_PROVIDER_READ_ONLY_PROBE_COMPLETED");
          '

      - name: Store read-only intake evidence
        uses: actions/upload-artifact@v4
        with:
          name: oge95-review-intake-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            oge95-final-review-intake.json
            oge95-same-sha-audit.json
            oge95-provider-readiness.json
            oge95-stone-runner-learning.json
            oge98-codex-host-preflight.json
          retention-days: 30
          if-no-files-found: error

  commit-drain:
    name: Drain EVERY pending staging commit after each push
    uses: ./.github/workflows/oge95-commit-drain.yml
    permissions:
      contents: read
      actions: read
