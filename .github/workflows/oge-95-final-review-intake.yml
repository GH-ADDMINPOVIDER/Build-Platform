name: OGE-95 Final Review Intake - GitHub + Manus + OpenAI

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - "scripts/oge95-final-review-intake.mjs"
      - "tests/oge95-final-review-intake.test.mjs"
      - "scripts/oge95-provider-readiness.mjs"
      - "tests/oge95-provider-readiness.test.mjs"
      - "scripts/oge95-stone-runner-learning.mjs"
      - "tests/oge95-stone-runner-learning.test.mjs"
      - ".github/workflows/oge-95-final-review-intake.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: oge95-review-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reviewer-intake:
    name: Verify external reviewer receipts without invoking providers
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact staging SHA and runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/phase-vi-provider-incentive-metering'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "REVIEWER_INTAKE_GITHUB_SHA_OK"

      - name: Test normalizer and emit honest connection-state artifact
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/oge95-final-review-intake.test.mjs
          node scripts/oge95-final-review-intake.mjs \
            --audit=docs/evidence/oge-62-flow-audit-latest.json \
            --sha="$GITHUB_SHA" \
            --output=oge95-final-review-intake.json
          node -e '
            const fs=require("node:fs");
            const result=JSON.parse(fs.readFileSync("oge95-final-review-intake.json"));
            if(result.github_audit!=="HISTORICAL_UNBOUND" ||
               result.final_intake_state!=="GITHUB_AUDIT_SHA_NOT_ATTESTED" ||
               result.reviewers.manus.state!=="NOT_CONNECTED" ||
               result.reviewers.openai.state!=="NOT_CONNECTED" ||
               result.green_verified_promotion!==false ||
               result.yellow_commit_or_deploy_authority!=="NOT_GRANTED") {
              throw Error("REVIEW_INTAKE_FALSE_PROMOTION");
            }
            console.log("OGE95_INTAKE_HISTORICAL_AUDIT_SHA_UNBOUND_NO_PROVIDER_CALL");
          '

      - name: Restore prior Stone Runner learning snapshot (best-effort, read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS="$RUNNER_TEMP/oge95-prev-learning"
          mkdir -p "$PREVIOUS"
          if command -v gh >/dev/null 2>&1; then
            NAME="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and (.name | test("^oge95-review-intake-[0-9]+-[0-9]+$")))] | sort_by(.created_at) | last | .name // empty' 2>/dev/null || true)"
            if test -n "$NAME"; then
              RUN="$(printf '%s' "$NAME" | awk -F- '{print $(NF-1)}')"
              if [[ "$RUN" =~ ^[0-9]+$ ]]; then
                gh run download "$RUN" --repo "${GITHUB_REPOSITORY}" \
                  --name "$NAME" --dir "$PREVIOUS" >/dev/null 2>&1 || true
              fi
            fi
          fi
          if test -s "$PREVIOUS/oge95-stone-runner-learning.json"; then
            cp "$PREVIOUS/oge95-stone-runner-learning.json" oge95-previous-learning.json
            echo "OGE95_PRIOR_LEARNING_SNAPSHOT_FOUND"
          else
            echo "OGE95_PRIOR_LEARNING_SNAPSHOT_ABSENT_REBUILD_FROM_CURRENT_EVIDENCE"
          fi

      - name: Let Stone Runner learn from GitHub, Manus, OpenAI evidence only
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/oge95-stone-runner-learning.test.mjs
          node scripts/oge95-stone-runner-learning.mjs \
            --sha="$GITHUB_SHA" \
            --intake=oge95-final-review-intake.json \
            --previous=oge95-previous-learning.json \
            --output=oge95-stone-runner-learning.json
          node -e '
            const f=require("node:fs");
            const a=JSON.parse(f.readFileSync("oge95-stone-runner-learning.json","utf8"));
            if(a.schema!=="OGE95_STONE_RUNNER_LEARNING_V1" ||
               a.model_weights_updated!==false ||
               a.permission_to_commit_or_deploy!=="NOT_GRANTED" ||
               a.promoted_to_green_1lss!==false ||
               a.direct_provider_calls!==0) throw Error("LEARNING_MUST_BE_NON_AUTHORITATIVE");
            console.log("OGE95_STONE_RUNNER_3_SOURCE_LEARNING_CACHE_EMITTED");
          '

      - name: Load existing staging provider bindings through OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG || 'ogenic-sio-ti-rv' }}
          env-slug: staging
          secret-path: /
          recursive: true

      - name: Probe Manus and OpenAI read-only access without consuming model tokens
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/oge95-provider-readiness.test.mjs
          node scripts/oge95-provider-readiness.mjs --output=oge95-provider-readiness.json
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("oge95-provider-readiness.json"));
            if(report.model_inference_calls !== 0 || report.paid_agent_tasks_created !== false) {
              throw Error("READINESS_PROBE_PAID_ACTION_FORBIDDEN");
            }
            console.log("OGE95_PROVIDER_READ_ONLY_PROBE_COMPLETED");
          '

      - name: Store read-only intake evidence
        uses: actions/upload-artifact@v4
        with:
          name: oge95-review-intake-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            oge95-final-review-intake.json
            oge95-provider-readiness.json
            oge95-stone-runner-learning.json
          retention-days: 30
          if-no-files-found: error
