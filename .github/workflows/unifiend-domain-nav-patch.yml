name: Unifiend Domain + Nav Patch

on:
  push:
    branches: [Unified-on-Progress]
    paths:
      - "scripts/patch-unifiend-domain-nav.py"
      - ".github/workflows/unifiend-domain-nav-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 20
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: Unified-on-Progress
          fetch-depth: 0

      - name: Apply Unifiend domain and navigation patch
        run: python3 scripts/patch-unifiend-domain-nav.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify tests, typecheck and build
        run: npm run check

      - name: Commit staging-only patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Unifiend Self-host Runner"
          git config user.email "unifiend-runner@users.noreply.github.com"
          git add src/UnifiedChat.tsx src/ControlPlaneV2.tsx tests/chat-modes-usage-ui.test.mjs tests/agent-session-runtime-contract.test.mjs .github/workflows/provider-incentive-staging-deploy.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "ui: connect Unifiend chat dashboard and canonical domain"
          git push origin HEAD:Unified-on-Progress
