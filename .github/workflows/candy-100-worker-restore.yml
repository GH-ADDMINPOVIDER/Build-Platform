name: Restore Candy 103-item Worker

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - ".github/workflows/candy-100-worker-restore.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}
  CANDY_REPO: Ogenicchocolate21debug/ogenic-chocolate
  CANDY_REF: cf-preview-drive-a1-a6-20260908
  WORKER_NAME: bitter-shadow-464a
  LIVE_URL: https://candybaked.ogenicchocolate.com/
  DEPLOY_REV: 75ac246488fe644e7e0223ea6060adffedff4337

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout OGENIC control repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Auto-discover Infisical project and Cloudflare credential source
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load Cloudflare credentials from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: ${{ steps.infisical_project.outputs.secret_env_slug }}
          secret-path: ${{ steps.infisical_project.outputs.secret_path }}

      - name: Require Cloudflare authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "Cloudflare credentials resolved via OIDC without printing secret values."

      - name: Checkout Drive-canonical Candy catalog
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CANDY_REPO }}
          ref: ${{ env.CANDY_REF }}
          path: candy

      - name: Validate 100-item base catalog plus 3-item Special Menu
        shell: bash
        run: |
          set -euo pipefail
          cd candy
          node scripts/validate-wf-sequence.mjs
          git diff --check

      - name: Prepare Worker static assets
        shell: bash
        run: |
          set -euo pipefail
          cd candy
          rm -rf dist
          mkdir -p dist/assets
          cp index.html catalog-cart.js dist/
          cp -R assets/. dist/assets/
          test -s dist/index.html
          test -s dist/catalog-cart.js
          test "$(find dist/assets/catalog -type f -name '*.jpg' | wc -l)" -eq 100
          grep -q '<title>Candy Baked Factory — 103 รายการ</title>' dist/index.html
          grep -q 'id="catalog-total">103' dist/index.html
          ! grep -Eq 'A1 · WEBSITE HEADER VIDEO|A2 · SECOND ROW · 4 IMAGES|A3 · PHOTO STORY|OUR MENU · A4 · GOOGLE DRIVE|CANDY BAKED MOMENTS · A5|THE END · A6' dist/index.html
          grep -q 'catalog-cart.js' dist/index.html
          grep -q 'oaMessage/%40014refkl' dist/catalog-cart.js
          test ! -e dist/assets/posters/PT11.png
          test -s dist/assets/catalog/13/hotpot-small.jpg
          test -s dist/assets/catalog/13/hotpot-medium.jpg
          test -s dist/assets/catalog/13/hotpot-large.jpg
          test -s dist/assets/special-menu/special-menu-poster.jpg
          test -s dist/assets/special-menu/thai-basil-chicken.jpg
          test -s dist/assets/special-menu/all-day-breakfast.jpg
          test -s dist/assets/special-menu/creamy-garden-salad.jpg
          grep -q 'data-product-id="SP.1"' dist/index.html
          grep -q 'data-product-id="SP.2"' dist/index.html
          grep -q 'data-product-id="SP.3"' dist/index.html
          echo "Static bundle ready: 103 products, 100 Drive catalog media files, and 4 Special Menu assets."

      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          cd candy
          npx -y wrangler@4.129.1 deploy --config wrangler.worker.toml

      - name: Verify live Worker
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT
          for attempt in $(seq 1 40); do
            CODE="$(curl -L --silent --show-error --output "$BODY" --write-out '%{http_code}' "$LIVE_URL")"
            if test "$CODE" = "200"               && grep -q '<title>Candy Baked Factory — 103 รายการ</title>' "$BODY"               && grep -q 'id="catalog-total">103' "$BODY"; then
              echo "Worker $WORKER_NAME verified with the 103-item catalog on attempt $attempt."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Live Worker verification failed; status=$CODE"
          exit 1
