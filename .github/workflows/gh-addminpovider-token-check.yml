name: GH-ADDMINPOVIDER token check - Ollama, GitBook, DeepSeek, Manus (status only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/gh-addminpovider-token-check.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  check:
    if: github.repository_id == '1429580446' && github.repository_owner_id == '342175560'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Find key names and test validity (values never printed)
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re,json,urllib.request,urllib.parse,urllib.error
          BASE="https://app.infisical.com"
          PROJECT="e8cfba67-ea99-4d79-bc9f-87b862f9129c"
          IDENTITY="b0962d69-bd33-4ac3-b4f4-48589535ca38"
          AUD="https://github.com/GH-ADDMINPOVIDER"
          def call(url,headers=None,data=None,method=None):
              h={"User-Agent":"GH-ADDMINPOVIDER-token-check","Accept":"application/json"}
              h.update(headers or {})
              b=None
              if data is not None:
                  h["Content-Type"]="application/json";b=json.dumps(data).encode()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=h,data=b,method=method),timeout=20) as r:
                      return r.status,r.read()
              except urllib.error.HTTPError as e:
                  return e.code,e.read()
              except Exception as e:
                  return 0,str(type(e).__name__).encode()
          def js(b):
              try:return json.loads(b)
              except Exception:return {}
          u=urllib.parse.urlsplit(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"])
          s,b=call(urllib.parse.urlunsplit(u._replace(query=urllib.parse.urlencode(urllib.parse.parse_qsl(u.query)+[("audience",AUD)]))),{"Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          jwt=js(b)["value"]
          s,b=call(BASE+"/api/v1/auth/oidc-auth/login",data={"identityId":IDENTITY,"jwt":jwt})
          tok=js(b)["accessToken"]
          q=urllib.parse.urlencode({"workspaceId":PROJECT,"environment":"staging","secretPath":"/","recursive":"true","viewSecretValue":"true"})
          s,b=call(BASE+"/api/v3/secrets/raw?"+q,{"Authorization":"Bearer "+tok})
          allsecrets=js(b).get("secrets",[])
          print("infisical read HTTP",s,"total secret names:",len(allsecrets))
          PAT=re.compile(r"ollama|gitbook|manus|deepseek|gemini",re.I)
          S={}
          for x in allsecrets:
              k=x["secretKey"]
              if not PAT.search(k): continue
              v=x.get("secretValue") or ""
              multi="\n" in v
              if not multi and v.strip(): print("::add-mask::"+v.strip())
              S[k]=None if multi else v.strip()
              print(f"name={k} length={len(v)} multiline={multi} empty={not v.strip()}")
          print("--- tests (status only):")
          def pick(rx):
              for k,v in S.items():
                  if re.search(rx,k,re.I) and v: return k,v
              return None,None
          k,v=pick(r"deepseek")
          if v:
              c,b=call("https://api.deepseek.com/user/balance",{"Authorization":"Bearer "+v})
              d=js(b); inf=(d.get("balance_infos") or [{}])[0]
              print(f"deepseek balance: HTTP {c} is_available={d.get('is_available')} currency={inf.get('currency')} total_balance={inf.get('total_balance')}")
          else: print("deepseek: no usable key name found")
          k,v=pick(r"gitbook")
          if v:
              c,b=call("https://api.gitbook.com/v1/user",{"Authorization":"Bearer "+v})
              print(f"gitbook /v1/user: HTTP {c}")
          else: print("gitbook: no key name found in Infisical staging")
          k,v=pick(r"gemini")
          if v:
              c,b=call("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1",{"x-goog-api-key":v})
              print(f"gemini models list: HTTP {c}")
          else: print("gemini: no key name found")
          print("ollama:", "key name present (validity not tested)" if any(re.search("ollama",k,re.I) for k in S) else "no key name found in Infisical staging")
          print("manus:", "key name present (validity not tested)" if any(re.search("manus",k,re.I) for k in S) else "no key name found in Infisical staging")
          print("check done")
          PY
