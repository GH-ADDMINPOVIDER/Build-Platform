name: OpenAI Runtime Connectivity CI

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Auto-discover Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh
      - name: Load staging secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
      - name: Verify OpenAI auth and complimentary models without inference
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "::error::CONFIGURATION_REQUIRED: OPENAI_API_KEY missing"; exit 1; }
          HEADERS=(-H "Authorization: Bearer ${OPENAI_API_KEY}")
          if [ -n "${OPENAI_PROJECT_ID:-}" ]; then HEADERS+=(-H "OpenAI-Project: ${OPENAI_PROJECT_ID}"); fi
          STATUS="$(curl -sS -o /tmp/models.json -w '%{http_code}' "${HEADERS[@]}" https://api.openai.com/v1/models)"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            CODE="$(jq -r '.error.code // .error.type // "unknown"' /tmp/models.json 2>/dev/null || true)"
            echo "::error::OpenAI auth failed: HTTP ${STATUS}, code=${CODE}"
            exit 1
          fi
          for MODEL in gpt-5.6-sol gpt-5.6-terra gpt-5.6-luna gpt-5.1-codex; do
            if jq -e --arg m "$MODEL" '.data[]?.id | select(. == $m)' /tmp/models.json >/dev/null; then
              echo "${MODEL}=AVAILABLE"
            else
              echo "${MODEL}=NOT_LISTED"
            fi
          done
          echo "OpenAI runtime connectivity: AUTHENTICATED (no inference performed)"
