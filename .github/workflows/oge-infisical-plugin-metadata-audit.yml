name: OGENIC Infisical plugin/service metadata audit (no secret values)
on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths: [".github/workflows/oge-infisical-plugin-metadata-audit.yml"]
permissions:
  contents: read
  id-token: write
jobs:
  list_names_only:
    if: github.repository == 'Ogenicchocolate21debug/Build-Platform' && github.actor == 'Ogenicchocolate21debug'
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 10
    env:
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
      INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
      INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
    steps:
      - name: Checkout exact staging audit script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read Infisical secret-key metadata via existing GitHub OIDC identity
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = wave-runner-01
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          node scripts/infisical-plugin-metadata-audit.mjs
      - name: Upload sanitized service-only registry (no tokens or raw key names)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogenic-infisical-service-map-${{ github.run_id }}
          path: oge-infisical-plugin-metadata-audit.json
          retention-days: 14
          if-no-files-found: warn
      - name: State factual metadata-audit status
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.audit.outcome }}
        run: |
          {
            echo "## OGENIC Infisical service metadata audit"
            echo "- Runner: $RUNNER_NAME"
            echo "- Status: $RESULT"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Scope: OGENIC organization, project environments visible to existing Runner-01 Machine Identity"
            echo "- No secret values, no raw secret names, no downloaded credential files, no auth tokens in outputs"
            echo "- Credentials in Infisical do not establish plugin installation in either GS or GT ChatGPT account"
          } >> "$GITHUB_STEP_SUMMARY"
