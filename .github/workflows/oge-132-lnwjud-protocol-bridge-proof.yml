name: OGE-132 lnwjud Protocol Bridge Proof
on:
  push:
    branches:
      - feature/oge-132-lnwjud-connector-protocol-bridge-20261019
    paths:
      - "worker/connector-protocol-bridge.ts"
      - "worker/mcp-config-api.ts"
      - "worker/entry-yellow-stone.ts"
      - "tests/oge-132-lnwjud-protocol-bridge.test.mjs"
      - "tests/oge-132-mcp-runtime-bridge.test.mjs"
      - ".github/workflows/oge-132-lnwjud-protocol-bridge-proof.yml"
      - "docs/integrations/OGE132_LNWJUD_15_MODE_PROTOCOL_BRIDGE.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oge132-protocol-bridge-proof
  cancel-in-progress: false
jobs:
  protocol-contract-and-local-http:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact feature scope and original Runner-1
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = feature/oge-132-lnwjud-connector-protocol-bridge-20261019
          test "$RUNNER_NAME" = wave-runner-01
      - name: Install dependencies for bounded verification
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Test all 15 protocols and original command/Owner guards
        run: node --test tests/oge-132-mcp-runtime-bridge.test.mjs tests/oge-132-lnwjud-protocol-bridge.test.mjs tests/oge-131-unified-connector-endpoint.test.mjs tests/wave-connector-endpoint.test.mjs tests/wave-command-contract.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build (NOT deploy)
        run: npm run build
      - name: Local Worker HTTP admission smoke (NO secrets, NO deployment)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8789 --var OGENIC_OPS_KEY:oge132-fixture-only-owner-key >/tmp/oge132-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; wait "$worker_pid" 2>/dev/null || true; rm -f /tmp/oge132-worker.log' EXIT
          ready=0
          for i in $(seq 1 24); do
            status=$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8789/api/connector-endpoint/v1/protocols || true)
            if [ "$status" = 401 ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then echo "OGE132_LOCAL_WORKER_NOT_READY"; exit 1; fi
          status=$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"transport":"mcp","operation":"invoke_read"}' http://127.0.0.1:8789/api/connector-endpoint/v1/operate)
          test "$status" = 401
          hook=$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"probe":"unsigned"}' http://127.0.0.1:8789/api/connector-endpoint/v1/ingress/generic)
          if [ "$hook" = 200 ] || [ "$hook" = 201 ] || [ "$hook" = 202 ]; then echo "OGE132_UNSIGNED_WEBHOOK_ACCEPTED"; exit 1; fi
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          const base="http://127.0.0.1:8789";
          const login=await fetch(base+"/api/session",{
            method:"POST", headers:{"Content-Type":"application/json"},
            body:JSON.stringify({owner_key:"oge132-fixture-only-owner-key"})
          });
          assert.equal(login.status,200,"Fixture Owner session must be issued");
          const cookie=(login.headers.get("set-cookie")||"").split(";")[0];
          assert.match(cookie,/^ogenic_owner_session=/);
          const modes=["mcp","n8n","api","token","secret","credential","pr_api","agent_api",
            "function_calling","npx","npm","sdk","a2a","webhook","agent_sign_run"];
          for (const transport of modes) {
            const response=await fetch(base+"/api/connector-endpoint/v1/operate",{
              method:"POST",headers:{"Content-Type":"application/json",cookie},
              body:JSON.stringify({transport,operation:"inspect",environment:"staging"})
            });
            const result=await response.json();
            assert.equal(response.status,200,transport+": "+JSON.stringify(result));
            assert.equal(result.transport,transport);
            assert.equal(result.configured_is_not_live_e2e,true);
          }
          const bad=await fetch(base+"/api/connector-endpoint/v1/operate",{
            method:"POST",headers:{"Content-Type":"application/json",cookie},
            body:JSON.stringify({transport:"api",operation:"inspect",environment:"production"})
          });
          assert.equal(bad.status,422,"Production scope rejected");
          const forged=await fetch(base+"/api/connector-endpoint/v1/operate",{
            method:"POST",headers:{"Content-Type":"application/json",cookie},
            body:JSON.stringify({transport:"npx",operation:"confirm",command:"Audit source",
              approval:{confirmed:true,approval_id:"forged"}})
          });
          assert.equal(forged.status,422,"Forged Owner approval rejected");
          const operate=async body=>{
            const r=await fetch(base+"/api/connector-endpoint/v1/operate",{
              method:"POST",headers:{"Content-Type":"application/json",cookie},
              body:JSON.stringify({...body,environment:"staging"})
            });
            return {status:r.status,body:await r.json()};
          };
          const protocols=await fetch(base+"/api/connector-endpoint/v1/protocols",{headers:{cookie}});
          assert.equal(protocols.status,200);
          assert.equal((await protocols.json()).mode_count,15);
          const mcpSim=await operate({transport:"mcp",operation:"discover",provider:"simulated"});
          assert.equal(mcpSim.status,200);
          assert.equal(mcpSim.body.state,"SIMULATED");
          assert.equal(mcpSim.body.real_available,false);
          const unknown=await operate({transport:"function_calling",operation:"invoke_read",
            name:"execute_shell",arguments:{}});
          assert.equal(unknown.status,409);
          assert.equal(unknown.body.code,"HUMAN_APPROVAL_REQUIRED");
          const noOpsSession=await fetch(base+"/api/connector-endpoint/v1/operate",{
            method:"POST",
            headers:{"content-type":"application/json","x-ogenic-ops-key":"oge132-fixture-only-owner-key"},
            body:JSON.stringify({transport:"mcp",operation:"inspect"})
          });
          assert.equal(noOpsSession.status,401,"Raw OPS header is not Owner session for operate");
          const n8nHealth=await operate({transport:"n8n",operation:"probe"});
          assert.notEqual(n8nHealth.body.workflow_execution_proven,true);
          if(n8nHealth.status!==200){
            assert.equal(n8nHealth.status,503);
            assert.equal(n8nHealth.body.ok,false);
          }
          console.log("OGE132_LOCAL_MCP_SIMULATED_DISCOVERY=PASS_FIXTURE");
          console.log("OGE132_LOCAL_UNKNOWN_FUNCTION_AND_OPS_ONLY=DENIED");
          console.log("OGE132_LOCAL_N8N_HEALTH_TRUTHFUL=PASS");
          console.log("OGE132_LOCAL_OWNER_SESSION=PASS");
          console.log("OGE132_LOCAL_15_MODE_INSPECT_HTTP=15/15_PASS");
          console.log("OGE132_LOCAL_PROD_AND_FORGED_APPROVAL=DENIED");
          JS
          echo "OGE132_LOCAL_HTTP_UNAUTH_PROTOCOLS=401"
          echo "OGE132_LOCAL_HTTP_UNAUTH_OPERATE=401"
          echo "OGE132_LOCAL_HTTP_UNSIGNED_HOOK=DENIED"
      - name: CI scope receipt
        shell: bash
        run: |
          echo "OGE132_15_MODE_SOURCE_CONTRACT=PASS"
          echo "OGE132_LOCAL_HTTP=PASS"
          echo "OGE132_LIVE_STAGING_PROVIDER_E2E=NOT_VERIFIED"
          echo "OGE132_MCP_READ_PROVIDER_CALL=REQUIRES_OWNER_READ_ALLOWLIST"
          echo "OGE132_RUNNER_NATIVE_NPX_NPM_SDK_ADAPTER=NOT_VERIFIED"
          echo "OGE132_AGENT_OWNER_SIGN_RUN_D1_E2E=NOT_VERIFIED"
          echo "OGE132_INFISICAL_D1_MIRROR=NOT_VERIFIED"
          echo "OGE132_PRODUCTION_MUTATED=FALSE"
