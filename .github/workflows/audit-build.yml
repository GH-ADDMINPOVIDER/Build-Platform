name: Validate and Bundle OGENIC Phase VI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Phase VI toolkit
        run: python scripts/validate_toolkit.py

      - name: Build single toolkit bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r dist/ogenic-phase-vi.zip \
            .codex-plugin \
            skills/ogenic-phase-vi \
            plugins/oge-athena \
            assets/toolkit-manifest.json \
            config \
            database \
            worker \
            src \
            index.html package.json tsconfig.json vite.config.ts wrangler.jsonc \
            docs/integrations/WAVE_REMOTE_MCP_DATA_STONE.md \
            README.md PRIVACY.md TERMS.md \
            -x "**/__pycache__/**" "*.pyc"

      - name: Upload OGENIC Phase VI toolkit
        uses: actions/upload-artifact@v4
        with:
          name: ogenic-phase-vi
          path: dist/ogenic-phase-vi.zip
          if-no-files-found: error
