name: Validate and Bundle OGENIC Phase VI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-bundle:
    # The existing one-host WAVE gateway replaces unavailable GitHub-hosted minutes.
    # Never execute untrusted fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'Ogenicchocolate21debug/Build-Platform'
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Phase VI toolkit
        run: python scripts/validate_toolkit.py

      - name: Build single toolkit bundle (Python stdlib, no zip/sudo required)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          include = [
              ".codex-plugin", "skills/ogenic-phase-vi", "assets/toolkit-manifest.json",
              "config", "database", "worker", "src",
              "index.html", "package.json", "tsconfig.json", "vite.config.ts",
              "wrangler.jsonc", "README.md", "PRIVACY.md", "TERMS.md",
          ]
          Path("dist").mkdir(exist_ok=True)
          with ZipFile("dist/ogenic-phase-vi.zip", "w", ZIP_DEFLATED) as archive:
              for name in include:
                  path = Path(name)
                  if not path.exists():
                      raise SystemExit(f"BUNDLE_SOURCE_MISSING:{name}")
                  files = (sorted(path.rglob("*")) if path.is_dir() else [path])
                  for candidate in files:
                      if not candidate.is_file() or "__pycache__" in candidate.parts or candidate.suffix == ".pyc":
                          continue
                      archive.write(candidate, candidate.as_posix())
          print("OGENIC_TOOLKIT_ARCHIVE_CREATED")
          PY

      - name: Upload OGENIC Phase VI toolkit
        uses: actions/upload-artifact@v4
        with:
          name: ogenic-phase-vi
          path: dist/ogenic-phase-vi.zip
          if-no-files-found: error
