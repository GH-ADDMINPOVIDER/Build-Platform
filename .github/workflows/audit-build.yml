name: Validate and Bundle OGENIC Phase VI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-bundle:
    # The existing one-host WAVE gateway replaces unavailable GitHub-hosted minutes.
    # Never execute untrusted fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'Ogenicchocolate21debug/Build-Platform'
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Phase VI toolkit
        run: python scripts/validate_toolkit.py

      - name: Build single toolkit bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r dist/ogenic-phase-vi.zip \
            .codex-plugin \
            skills/ogenic-phase-vi \
            assets/toolkit-manifest.json \
            config \
            database \
            worker \
            src \
            index.html package.json tsconfig.json vite.config.ts wrangler.jsonc \
            README.md PRIVACY.md TERMS.md \
            -x "**/__pycache__/**" "*.pyc"

      - name: Upload OGENIC Phase VI toolkit
        uses: actions/upload-artifact@v4
        with:
          name: ogenic-phase-vi
          path: dist/ogenic-phase-vi.zip
          if-no-files-found: error
