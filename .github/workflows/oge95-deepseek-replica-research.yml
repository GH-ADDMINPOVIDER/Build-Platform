name: OGE-95 DeepSeek Replica Architecture Research (One-Shot)
# One authorized bounded research job triggered by this workflow source change.
# Other project commits will NOT trigger another paid call.
on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths: [".github/workflows/oge95-deepseek-replica-research.yml"]
  workflow_dispatch:
    inputs:
      confirm_single_paid_call:
        description: "One metered DeepSeek request, with existing cost/context budget"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  id-token: write
env:
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}
jobs:
  one-shot:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_single_paid_call == true) }}
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover staging Infisical
        id: project
        shell: bash
        run: bash scripts/infisical-discover-project.sh
      - name: Load existing DeepSeek key through OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true
      - name: Resolve Infisical DeepSeek alias without output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          meta=json.loads(Path("config/staging-runtime-bindings.json").read_text())
          key=os.environ.get("DEEPSEEK_API_KEY","").strip()
          for alias in meta.get("aliases",{}).get("DEEPSEEK_API_KEY",[]):
              if not key: key=os.environ.get(alias,"").strip()
          if not key: raise SystemExit("CONFIGURATION_REQUIRED_DEEPSEEK_KEY")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write("DEEPSEEK_API_KEY="+key+"\n")
          print("Key present [REDACTED]")
          PY
      - name: Read current repo source and retrieve official external documentation
        shell: bash
        run: node scripts/replica-runner/research-sources.mjs
      - name: Validate evidence packet budget before calling any provider
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const data=JSON.parse(readFileSync("oge95-research-packet.json","utf8"));
          assert.equal(data.schema_version,"OGE95_DUAL_SOURCE_RESEARCH_V1");
          assert.ok(data.prompt.length<=8500);
          assert.ok(data.repo_files_read>=4);
          assert.ok(data.external.length>=3);
          assert.equal(data.source_sha,process.env.GITHUB_SHA);
          console.log(JSON.stringify({repo_files:data.repo_files_read,external_live_fetches:data.external_fetch_count,external_references:data.external.length,context_chars:data.prompt.length}));
          JS
      - name: One DeepSeek architecture research call via existing Yellow READ
        shell: bash
        run: node scripts/replica-runner/deepseek-via-yellow.mjs
      - name: Ingest real research only when model returned source-backed content
        if: always()
        shell: bash
        run: |
          if test -f /tmp/oge95-deepseek-architecture-review.json; then
            node scripts/replica-runner/factory-run.mjs \
              --operation deepseek_research_ingest \
              --task OGE-95-deepseek-research \
              --input /tmp/oge95-deepseek-architecture-review.json \
              --source-run-id "$GITHUB_RUN_ID" \
              --source-sha "$GITHUB_SHA" || true
            if test -f oge95-factory-receipt.json; then
              jq '{status,job_id,stages,auto_deploy,retain_in_green}' oge95-factory-receipt.json
            fi
          fi
      - name: Upload model evidence and factory receipt (zero secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oge95-one-shot-deepseek-research-${{ github.run_id }}
          path: |
            /tmp/oge95-deepseek-architecture-review.json
            oge95-factory-receipt.json
            oge95-research-packet.json
          retention-days: 14
          if-no-files-found: warn
      - name: Record one-pass proof
        if: always()
        shell: bash
        run: |
          {
            echo "### DeepSeek OGE-95 researched architecture review"
            echo "- Existing Infisical key, one call max"
            echo "- Public code/CI facts only; no user content or D1 data sent"
            echo "- No unapproved code changes, no retries, no fallback"
            echo "- Architecture proposal in uploaded artifact. No auto implementation or second model run"
          } >> "$GITHUB_STEP_SUMMARY"
