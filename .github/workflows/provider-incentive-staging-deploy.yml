name: Provider Incentive Staging Deploy

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - ".github/workflows/provider-incentive-staging-deploy.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "capacitor.config.ts"
      - "worker/**"
      - "scripts/infisical-discover-project.sh"
      - "scripts/oge34-github-worker-binding.mjs"
      - "scripts/verify-openbot-launchroom-staging.mjs"
      - "scripts/unifiend-command-consumer.mjs"
      - ".github/workflows/oge-36-staging-cloud-fallback.yml"
      - "scripts/infisical-cloudflare-source-select.sh"
      - "tests/infisical-cloudflare-source.test.mjs"
      - "tests/oge-89-deepseek-yellow-integration.test.mjs"
      - "tests/mcp-config-contract.test.mjs"
      - "workflows/**"
      - "database/**"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
  workflow_dispatch:

# One staging deploy per branch; new pushes supersede queued/running stale deploys.
# Keep separate from the continuous latest-HEAD CI group.
concurrency:
  group: oge95-staging-auto-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  WORKER_NAME: ogenic-phase-vi-staging
  D1_DATABASE_NAME: ogenic-phase-vi-staging
  STAGING_URL: https://wave.ogenicchocolate.com
  OGENIC_GIT_SHA: ${{ github.sha }}
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}
  INFISICAL_ENV_SLUG: staging
  INFISICAL_CLOUDFLARE_SOURCE_ENV: staging
  INFISICAL_CLOUDFLARE_SOURCE_PATH: /
  INFISICAL_CLOUDFLARE_PROJECT_ID: e8cfba67-ea99-4d79-bc9f-87b862f9129c
  INFISICAL_CLOUDFLARE_PROJECT_SLUG: ogenic-sio-ti-rv
  N8N_BASE_URL: ${{ vars.N8N_BASE_URL || 'https://ogenic-registry.app.n8n.cloud' }}
  # Existing OGE-69 Railway self-host; dedicated Infisical credential is required.
  N8N_SELFHOST_BASE_URL: ${{ vars.N8N_SELFHOST_BASE_URL || 'https://n8n-staging-76b7.up.railway.app' }}

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Reject superseded staging SHA before credentials or deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "Unified-on-Progress"
          REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/Unified-on-Progress | awk '{print $1}')"
          if ! [[ "$REMOTE_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to verify authoritative staging HEAD; refusing deployment"
            exit 1
          fi
          if test "$GITHUB_SHA" != "$REMOTE_HEAD"; then
            echo "::error::Stale staging source $GITHUB_SHA (current HEAD $REMOTE_HEAD); refusing superseded deployment"
            exit 1
          fi
          echo "Verified exact staging source SHA $GITHUB_SHA"

      - name: Detect staging change scope
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          UI_ONLY=false
          DB_CHANGED=false
          if test "${GITHUB_EVENT_NAME}" = "push" && [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            fi
            CHANGED="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
            if test -n "$CHANGED" && ! printf '%s\n' "$CHANGED" | grep -Eqv '^(src/|tests/|docs/)'; then
              UI_ONLY=true
            fi
            if printf '%s\n' "$CHANGED" | grep -Eq '^database/'; then
              DB_CHANGED=true
            fi
          fi
          echo "ui_only=$UI_ONLY" >> "$GITHUB_OUTPUT"
          echo "db_changed=$DB_CHANGED" >> "$GITHUB_OUTPUT"
          echo "Frontend-only deploy: $UI_ONLY; database changes: $DB_CHANGED."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Auto-discover Infisical project and Cloudflare credential source
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load Cloudflare credentials from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ steps.infisical_project.outputs.project_slug }}
          env-slug: ${{ steps.infisical_project.outputs.secret_env_slug }}
          secret-path: ${{ steps.infisical_project.outputs.secret_path }}

      - name: Load staging runtime secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true

      - name: Probe Discord bot token from Infisical
        id: discord_token_probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          output = Path(os.environ["GITHUB_OUTPUT"])

          def report(status: str, detail: str) -> None:
              with output.open("a", encoding="utf-8") as stream:
                  stream.write(f"status={status}\n")
              with summary.open("a", encoding="utf-8") as stream:
                  stream.write("### Discord credential probe\n\n")
                  stream.write(f"- Status: **{status}**\n")
                  stream.write(f"- Detail: {detail}\n")
                  stream.write("- Bot token value was not printed or persisted to an artifact.\n\n")

          token = os.environ.get("DISCORD_TOKEN", "").strip()
          if not token:
              print("::warning::DISCORD_TOKEN was not loaded from Infisical staging root; Discord probe skipped.")
              report("missing", "DISCORD_TOKEN not found in the job environment.")
              raise SystemExit(0)

          request = Request(
              "https://discord.com/api/v10/users/@me",
              headers={
                  "Authorization": f"Bot {token}",
                  "User-Agent": "OGENIC-UNIFIEND-Discord-Credential-Probe/1.0",
              },
              method="GET",
          )
          try:
              with urlopen(request, timeout=15) as response:
                  status = response.status
                  data = json.loads(response.read().decode("utf-8"))
          except HTTPError as error:
              print(f"::warning::Discord token probe returned HTTP {error.code}; response body withheld.")
              report("failed", f"Discord returned HTTP {error.code}; response body withheld.")
              raise SystemExit(0)
          except (URLError, TimeoutError, OSError, json.JSONDecodeError) as error:
              print(f"::warning::Discord token probe could not complete ({type(error).__name__}); details withheld.")
              report("unreachable", f"Request failed ({type(error).__name__}); details withheld.")
              raise SystemExit(0)

          bot_id = str(data.get("id", ""))
          username = str(data.get("username", ""))
          if status != 200 or data.get("bot") is not True or not bot_id or not username:
              print("::warning::Discord accepted the request but response was not a recognizable bot identity.")
              report("unexpected_identity", "Response did not identify a bot account.")
              raise SystemExit(0)

          print(f"::notice::Discord bot credential verified: {username} (ID {bot_id}); token not printed.")
          report("verified", f"Bot username: {username}; bot ID: {bot_id}.")
          PY

      - name: Verify Unifiend capability Actions-write and export protected staging runtime binding
        # Uses existing Infisical staging OIDC from the previous steps.
        # Rejects retired store fallback, incorrect principal, missing branch and
        # Actions 403 before deploying. No new PAT, secret or gateway.
        shell: bash
        env:
          OGE34_EXPORT_CANONICAL: "1"
        run: |
          set -euo pipefail
          node scripts/oge34-github-worker-binding.mjs

      - name: Normalize canonical runtime secret names
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          manifest = json.loads(Path('config/staging-runtime-bindings.json').read_text())
          normalized = 0
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for canonical, aliases in manifest.get('aliases', {}).items():
                  # Never overwrite the canonical dispatch PAT with a retired store alias.
                  # The previous step verifies identity and Actions write before
                  # exporting GITHUB_TOKEN into the protected staging job environment.
                  if canonical == 'GITHUB_TOKEN':
                      if os.environ.get('OGE34_GH_ADDMINPROVIDER_BOUND') != '1' or not os.environ.get('GITHUB_TOKEN'):
                          raise SystemExit('CONFIGURATION_REQUIRED: GH_ADDMINPROVIDER Actions write was not verified')
                      continue
                  if os.environ.get(canonical):
                      continue
                  for alias in aliases:
                      value = os.environ.get(alias)
                      if value:
                          output.write(f'{canonical}={value}\n')
                          normalized += 1
                          break
          print(f'Normalized {normalized} runtime secret aliases; values not printed.')
          PY

      - name: Report staging runtime binding coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          manifest = json.loads(Path('config/staging-runtime-bindings.json').read_text())
          keys = manifest['required'] + manifest['provider_optional']
          configured = [key for key in keys if os.environ.get(key)]
          missing = [key for key in keys if not os.environ.get(key)]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Staging runtime binding coverage\n\n')
              summary.write('| Binding | State |\n|---|---|\n')
              for key in keys:
                  summary.write(f'| `{key}` | {"CONFIGURED" if os.environ.get(key) else "MISSING"} |\n')
              summary.write('\nNo secret values are printed.\n')
          print(f'Runtime binding coverage: {len(configured)} configured, {len(missing)} missing; values not printed.')
          PY

      - name: Require staging authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "${OPENAI_API_KEY:-}" || { echo "::error::missing OPENAI_API_KEY"; exit 1; }
          test -n "${OGENIC_OPS_KEY:-}" || { echo "::error::missing OGENIC_OPS_KEY"; exit 1; }

      - name: Install dependencies
        run: npm install --package-lock-only && npm ci

      - name: Paid provider live smoke deferred by owner
        if: steps.scope.outputs.ui_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "DeepSeek and Perplexity live smoke are billing-deferred by owner."
          echo "No paid provider call is allowed to block unrelated staging deploys."
          echo "Readiness attestations remain unchanged until a dedicated provider proof succeeds."

      - name: Load verified provider readiness attestations
        if: steps.scope.outputs.ui_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path('config/provider-readiness-attestations.json')
          if not path.exists():
              print('No checked-in provider readiness attestation file; leaving readiness unchanged.')
              raise SystemExit(0)

          payload = json.loads(path.read_text())
          allowed_api = {'REACHABLE', 'UNREACHABLE'}
          allowed_quota = {'AVAILABLE', 'EXHAUSTED', 'RATE_LIMITED'}
          allowed_billing = {'ACTIVE', 'INACTIVE'}
          exported = []

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for provider, row in payload.get('providers', {}).items():
                  if str(row.get('verification_state', '')).upper() != 'VERIFIED':
                      continue
                  prefix = provider.upper().replace('-', '_')
                  api = str(row.get('api', '')).upper()
                  quota = str(row.get('quota', '')).upper()
                  billing = str(row.get('billing', '')).upper()
                  if api not in allowed_api or quota not in allowed_quota or billing not in allowed_billing:
                      raise SystemExit(f'invalid readiness attestation for {provider}')
                  output.write(f'OGENIC_READINESS_{prefix}_API={api}\n')
                  output.write(f'OGENIC_READINESS_{prefix}_QUOTA={quota}\n')
                  output.write(f'OGENIC_READINESS_{prefix}_BILLING={billing}\n')
                  exported.append(provider)

          print(f'Loaded verified readiness attestations for {len(exported)} provider(s); no secret values printed.')
          PY

      - name: Resolve staging D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          DB_ID="$(npx wrangler d1 list --json | jq -r --arg NAME "$D1_DATABASE_NAME" '.[] | select(.name == $NAME) | .uuid' | head -n1)"
          test -n "$DB_ID" && test "$DB_ID" != "null" || { echo "::error::staging D1 database not found"; exit 1; }
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Generate staging binding
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('wrangler.jsonc')
          cfg = json.loads(path.read_text())
          cfg['name'] = os.environ['WORKER_NAME']
          vars = cfg.setdefault('vars', {})
          vars['OGENIC_GIT_SHA'] = os.environ['OGENIC_GIT_SHA']
          for key in [
              'OGENIC_READINESS_PERPLEXITY_API',
              'OGENIC_READINESS_PERPLEXITY_QUOTA',
              'OGENIC_READINESS_PERPLEXITY_BILLING',
              'OGENIC_READINESS_DEEPSEEK_API',
              'OGENIC_READINESS_DEEPSEEK_QUOTA',
              'OGENIC_READINESS_DEEPSEEK_BILLING',
              'OGENIC_READINESS_GEMINI_API',
              'OGENIC_READINESS_GEMINI_QUOTA',
              'OGENIC_READINESS_GEMINI_BILLING',
              'OGENIC_READINESS_XAI_API',
              'OGENIC_READINESS_XAI_QUOTA',
              'OGENIC_READINESS_XAI_BILLING',
              'OGENIC_READINESS_META_MODEL_API',
              'OGENIC_READINESS_META_MODEL_QUOTA',
              'OGENIC_READINESS_META_MODEL_BILLING',
          ]:
              if os.environ.get(key):
                  vars[key] = os.environ[key]
          cfg['d1_databases'] = [{
              'binding': 'DB',
              'database_name': os.environ['D1_DATABASE_NAME'],
              'database_id': os.environ['D1_DATABASE_ID'],
              'migrations_dir': 'database/migrations'
          }]
          path.write_text(json.dumps(cfg, indent=2) + '\n')
          PY

      - name: Apply D1 migrations only for database changes
        if: steps.scope.outputs.db_changed == 'true'
        run: npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config wrangler.jsonc

      - name: Typecheck and build
        run: npm run check

      - name: Prepare protected runtime secret bundle
        if: steps.scope.outputs.ui_only != 'true'
        id: runtime_secrets
        shell: bash
        run: |
          set -euo pipefail
          SECRETS_FILE="$(mktemp)"
          chmod 600 "$SECRETS_FILE"
          export SECRETS_FILE
          python - <<'PY'
          import json, os
          from pathlib import Path

          manifest = json.loads(Path('config/staging-runtime-bindings.json').read_text())
          keys = manifest['required'] + manifest['provider_optional'] + manifest['connector_optional']
          payload = {key: os.environ[key] for key in keys if os.environ.get(key)}
          missing_required = [key for key in manifest['required'] if not payload.get(key)]
          if missing_required:
              raise SystemExit('required Worker runtime secret missing: ' + ', '.join(missing_required))
          with open(os.environ['SECRETS_FILE'], 'w', encoding='utf-8') as output:
              json.dump(payload, output)

          actor_map = manifest.get('actor_map', {})
          expected = [actor for key, actor in actor_map.items() if payload.get(key)]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('expected_actor_ids=' + ','.join(expected) + '\n')
          print(f'Prepared {len(payload)} protected runtime bindings; values not printed.')
          print(f'Expecting {len(expected)} Blue runtime actors to expose server-side references.')
          PY
          echo "file=$SECRETS_FILE" >> "$GITHUB_OUTPUT"

      - name: Deploy staging Worker with protected bindings
        shell: bash
        env:
          SECRETS_FILE: ${{ steps.runtime_secrets.outputs.file }}
          UI_ONLY: ${{ steps.scope.outputs.ui_only }}
        run: |
          set -euo pipefail
          # Recheck immediately before the side effect: a newer push may have
          # arrived while credentials, dependencies, and build were prepared.
          REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/Unified-on-Progress | awk '{print $1}')"
          if ! [[ "$REMOTE_HEAD" =~ ^[0-9a-f]{40}$ ]] || test "$GITHUB_SHA" != "$REMOTE_HEAD"; then
            echo "::error::Staging HEAD changed or cannot be verified before deploy; refusing superseded Worker mutation"
            exit 1
          fi
          echo "Deployment source still current: $GITHUB_SHA"
          if test "$UI_ONLY" = "true"; then
            npx wrangler deploy --config dist/ogenic_phase_vi_staging/wrangler.json --keep-vars
            echo "Frontend-only staging code deployed; existing secrets kept; D1 migrations skipped."
          else
            trap 'rm -f "$SECRETS_FILE"' EXIT
            npx wrangler deploy --config dist/ogenic_phase_vi_staging/wrangler.json --secrets-file "$SECRETS_FILE"
            echo "Staging code + protected bindings deployed atomically."
          fi

      - name: Verify staging health
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "${STAGING_URL}/api/health")"
          echo "$BODY"
          printf '%s' "$BODY" | jq -e '.ok == true or .status == "ok" or .status == "healthy"' >/dev/null
          echo "Staging deploy verified: ${STAGING_URL}"

      # One Owner-signed OpenBot READ-only check only on OpenBot implementation pushes.
      # This job only dispatches; it deliberately releases Ocian-S-Host before the
      # existing Codex consumer can execute and persist its D1 result.
      - name: OGE-OpenBot Launch Room live Owner-signed READ-only dispatch
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'openbot')
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-openbot-launchroom-staging.mjs
          node scripts/verify-openbot-launchroom-staging.mjs

      - name: Verify connector mode endpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OGENIC_OPS_KEY:-}" || { echo "::error::OGENIC_OPS_KEY is unavailable for connector endpoint verification"; exit 1; }
          BODY="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            -H "x-ogenic-ops-key: ${OGENIC_OPS_KEY}" \
            "${STAGING_URL}/api/connector-modes/status?probe=1")"
          printf '%s' "$BODY" | jq -e '.ok == true and .modes_documented == 15 and .full_e2e_proven == false and (.modes | length == 15)' >/dev/null
          printf '%s' "$BODY" | jq -e '([paths(scalars) as $p | getpath($p) | strings | select(test("(?i)(sk-[A-Za-z0-9_-]{12,}|gh[pousr]_[A-Za-z0-9]{12,}|bearer\\s+[A-Za-z0-9._~+/-]{12,}|-----BEGIN .*PRIVATE KEY-----)"))] | length) == 0' >/dev/null
          echo "Connector mode endpoint verified: 15 modes returned; no secret-like values detected."

      - name: Verify Unifiend shared-theme surface routes
        shell: bash
        run: |
          set -euo pipefail
          for route in / /chat /overview /maop; do
            BODY_FILE="$(mktemp)"
            CODE="$(curl --silent --show-error --output "$BODY_FILE" --write-out '%{http_code}' "${STAGING_URL}${route}")"
            test "$CODE" = "200" || { echo "::error::Unifiend surface ${route} returned HTTP ${CODE}"; cat "$BODY_FILE"; rm -f "$BODY_FILE"; exit 1; }
            grep -q 'id="root"' "$BODY_FILE" || { echo "::error::Unifiend surface ${route} missing app root"; rm -f "$BODY_FILE"; exit 1; }
            rm -f "$BODY_FILE"
          done
          echo "Unifiend Web / Chat / Operate / MA-OP staging routes verified after shared-theme build."
          {
            echo "### OGE-65 shared-theme staging routes"
            echo ""
            echo "PASS — /, /chat, /overview, and /maop returned the canonical Unifiend app root."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: OGE-67 live MA-OP Web Lab proof
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HEADER="x-ogenic-ops-key: ${OGENIC_OPS_KEY}"

          STATUS="$(curl --fail --silent --show-error -H "$AUTH_HEADER" "${STAGING_URL}/api/maop/lab/status")"
          printf '%s' "$STATUS" | jq -e '.ok == true and .protocol_version == "0.1.0" and .live_bridges.github_file_read == true and .live_bridges.writes == false' >/dev/null

          CORE="$(curl --fail --silent --show-error -X POST -H "$AUTH_HEADER" -H 'content-type: application/json' --data '{"scenario":"happy_path"}' "${STAGING_URL}/api/maop/lab/core")"
          printf '%s' "$CORE" | jq -e '.ok == true and .result.ok == true and .result.ruby_verified == true and .result.retention_eligible == true and (.result.lifecycle | index("RETAIN")) != null' >/dev/null

          GITHUB_READ="$(curl --fail --silent --show-error -X POST -H "$AUTH_HEADER" -H 'content-type: application/json' --data '{"path":"package.json"}' "${STAGING_URL}/api/maop/lab/github")"
          printf '%s' "$GITHUB_READ" | jq -e '.ok == true and .result.ok == true and .result.verification_state == "verified" and .result.ruby_verified == false and .result.retention_eligible == false' >/dev/null

          RUBY="$(curl --fail --silent --show-error -H "$AUTH_HEADER" "${STAGING_URL}/api/ruby/scorecard")"
          printf '%s' "$RUBY" | jq -e '.runtime == "RUBY_STONE_TEST_LAYER_V1" and (.tests | type == "array")' >/dev/null

          echo "MA-OP Web Lab live proof PASS: core + Yellow GitHub READ + Ruby scorecard."
          {
            echo "### OGE-67 MA-OP Web Lab"
            echo ""
            echo "PASS — /maop is live; Core lifecycle passed; GitHub READ traversed MA-OP → Yellow; Ruby scorecard responded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: OGE-68 legacy n8n preservation status
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Legacy n8n Cloud workspace is paused; recovered owner export is the canonical migration source."
          {
            echo "### OGE-68 legacy n8n preservation"
            echo ""
            echo "DEFERRED LIVE CLOUD READ — owner export preserved; no external mutation or credential export attempted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: OGE-69 categorized n8n migration catalog proof
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HEADER="x-ogenic-ops-key: ${OGENIC_OPS_KEY}"
          CATALOG="$(curl --fail --silent --show-error -H "$AUTH_HEADER" "${STAGING_URL}/api/n8n/migration/catalog")"
          printf '%s' "$CATALOG" | jq -e '.ok == true and .runtime == "N8N_LEGACY_MIGRATION_CATALOG_V1" and .secrets_included == false and .raw_workflow_parameters_included == false and .catalog.control_plane.execution_authority == "YELLOW_STONE_ONLY" and .catalog.control_plane.verification_authority == "RUBY_STONE" and (.catalog.categories | length) == 8' >/dev/null
          echo "OGE-69 categorized n8n migration catalog PASS."

      - name: OGE-69 live n8n self-host readiness proof
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HEADER="x-ogenic-ops-key: ${OGENIC_OPS_KEY}"
          SELFHOST="$(curl --fail --silent --show-error -H "$AUTH_HEADER" "${STAGING_URL}/api/n8n/migration/selfhost/status")"
          printf '%s' "$SELFHOST" | jq -e '
            .ok == true and
            .runtime == "N8N_SELFHOST_READINESS_V1" and
            .destination.configured == true and
            .destination.reachable == true and
            .destination.api_key_bound == true and
            .control.execution_authority == "YELLOW_STONE_ONLY" and
            .control.workflow_import_allowed == false and
            .control.workflow_execution_allowed == false
          ' >/dev/null

          INVENTORY="$(curl --fail --silent --show-error -H "$AUTH_HEADER" "${STAGING_URL}/api/n8n/migration/selfhost/workflows")"
          printf '%s' "$INVENTORY" | jq -e '
            .ok == true and
            .runtime == "N8N_SELFHOST_INVENTORY_V1" and
            .source.api_key_bound == true and
            .control.execution_authority == "YELLOW_STONE_ONLY" and
            .control.workflow_mutation_allowed == false and
            .control.workflow_execution_allowed == false and
            any(.inventory.workflows[];
              (.active == false) and
              (.node_count == 95) and
              (.name | contains("MIGRATION INACTIVE"))
            )
          ' >/dev/null
          echo "OGE-69 n8n self-host readiness + inactive 95-node inventory PASS."

      # OGE-70: resolving an executable descriptor never implies an adapter exists.
      # Machine Ops key cannot sign as Owner. A signed Owner session is final
      # authorization, but missing n8n execution adapter still fails closed.
      - name: OGE-70 Yellow n8n resolver and signed Owner adapter gate
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HEADER="x-ogenic-ops-key: ${OGENIC_OPS_KEY}"
          REQUEST='{"provider":"n8n","capability":"workflow_run","environment":"staging","allowMigration":false,"allowOptional":false}'

          RESOLVED="$(curl --fail --silent --show-error             -H 'content-type: application/json'             -H "$AUTH_HEADER"             --data "$REQUEST"             "${STAGING_URL}/api/capabilities/resolve")"
          printf '%s' "$RESOLVED" | jq -e '
            .ok == true and
            .status == "RESOLVED" and
            .descriptor.provider_id == "n8n" and
            .descriptor.capability_id == "workflow_run" and
            .descriptor.permission_class == "EXECUTE" and
            .descriptor.environment == "staging" and
            .descriptor.executable == true
          ' >/dev/null

          OPS_HTTP="$(curl --silent --show-error -o /tmp/oge70-ops-only.json -w '%{http_code}'             -H 'content-type: application/json' -H "$AUTH_HEADER" --data "$REQUEST"             "${STAGING_URL}/api/capabilities/execute")"
          test "$OPS_HTTP" = "401" || { echo "::error::OGE-70 Ops-only call must not receive Owner authority; got HTTP $OPS_HTTP"; exit 1; }
          jq -e '.ok == false and .code == "REAUTH_REQUIRED"' /tmp/oge70-ops-only.json >/dev/null

          # Reuse the existing owner login flow; never print token or secret.
          LOGIN_PAYLOAD="$(jq -nc --arg key "$OGENIC_OPS_KEY" '{owner_key:$key}')"
          SESSION_JSON="$(curl --fail --silent --show-error -H 'content-type: application/json'             -H 'x-ogenic-client: native' --data "$LOGIN_PAYLOAD"             "${STAGING_URL}/api/session")"
          OWNER_TOKEN="$(printf '%s' "$SESSION_JSON" | jq -r '.session_token // empty')"
          test -n "$OWNER_TOKEN" || { echo "::error::OGE-70 signed Owner session unavailable"; exit 1; }
          echo "::add-mask::$OWNER_TOKEN"

          HTTP_STATUS="$(curl --silent --show-error -o /tmp/oge70-owner-signed.json -w '%{http_code}'             -H 'content-type: application/json' -H "authorization: Bearer $OWNER_TOKEN"             --data "$REQUEST" "${STAGING_URL}/api/capabilities/execute")"
          test "$HTTP_STATUS" = "501" || { echo "::error::OGE-70 expected unsupported n8n adapter HTTP 501, got $HTTP_STATUS"; exit 1; }
          jq -e '
            .ok == false and
            .code == "ADAPTER_NOT_IMPLEMENTED" and
            .approval.required == false and
            .approval.authority == "SIGNED_OWNER_SESSION" and
            .verification.status == "blocked" and
            .verification.reason == "NO_IMPLEMENTED_NON_READ_ADAPTER"
          ' /tmp/oge70-owner-signed.json >/dev/null
          echo "OGE-70 PASS: Ops-only denied; signed Owner authorized; unimplemented adapter blocked."

      - name: OGE-57 live staging task inbox roundtrip
        if: steps.scope.outputs.ui_only != 'true'
        shell: bash
        run: |
          set -euo pipefail

          LOGIN_PAYLOAD="$(jq -nc --arg key "$OGENIC_OPS_KEY" '{owner_key:$key}')"
          SESSION_JSON="$(curl --fail --silent --show-error             -H 'content-type: application/json'             -H 'x-ogenic-client: native'             --data "$LOGIN_PAYLOAD"             "$STAGING_URL/api/session")"
          OWNER_TOKEN="$(printf '%s' "$SESSION_JSON" | jq -r '.session_token // empty')"
          test -n "$OWNER_TOKEN" || { echo "::error::OGE-57 staging owner session unavailable"; exit 1; }
          echo "::add-mask::$OWNER_TOKEN"

          SESSIONS_JSON="$(curl --fail --silent --show-error             -H "authorization: Bearer $OWNER_TOKEN"             "$STAGING_URL/api/1lss/sessions?limit=50")"

          mapfile -t SESSION_REFS < <(
            printf '%s' "$SESSIONS_JSON" | jq -r '
              [.sessions[]? | select(.source_surface != "openai-agent") | .session_ref]
              | unique
              | .[]
            ' | head -n 2
          )

          if test "${#SESSION_REFS[@]}" -lt 2; then
            echo "::notice::OGE-57 live E2E DEFERRED: fewer than two non-provider 1LSS session refs are available."
            {
              echo "### OGE-57 staging E2E"
              echo ""
              echo "DEFERRED — fewer than two non-provider session refs are available in owner-main."
              echo "Core CI remains verified; no schema change was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ORIGIN_REF="${SESSION_REFS[0]}"
          TARGET_REF="${SESSION_REFS[1]}"
          IDEMPOTENCY="oge57-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ASSIGN_BODY="$(jq -nc             --arg title "OGE-57 staging cross-session roundtrip"             --arg origin "$ORIGIN_REF"             --arg target "$TARGET_REF"             '{title:$title,origin_session_ref:$origin,target_session_ref:$target,priority:60}')"

          ASSIGN_JSON="$(curl --fail --silent --show-error             -H "authorization: Bearer $OWNER_TOKEN"             -H "Idempotency-Key: $IDEMPOTENCY"             -H 'content-type: application/json'             --data "$ASSIGN_BODY"             "$STAGING_URL/api/task-inbox/assign")"
          TASK_ID="$(printf '%s' "$ASSIGN_JSON" | jq -r '.task.id // empty')"
          test -n "$TASK_ID" || { echo "::error::OGE-57 assignment returned no task id"; exit 1; }

          INBOX_JSON="$(curl --fail --silent --show-error             -H "authorization: Bearer $OWNER_TOKEN"             --get --data-urlencode "session_ref=$TARGET_REF"             "$STAGING_URL/api/task-inbox")"
          printf '%s' "$INBOX_JSON" | jq -e --arg task "$TASK_ID" '.tasks | any(.id == $task)' >/dev/null

          RESULT_BODY="$(jq -nc             --arg session "$TARGET_REF"             --arg ref "github-actions://${GITHUB_RUN_ID}/oge-57"             --arg summary "Staging target session completed the deterministic OGE-57 roundtrip."             '{session_ref:$session,status:"DONE",result_ref:$ref,summary:$summary}')"

          RESULT_JSON="$(curl --fail --silent --show-error             -H "authorization: Bearer $OWNER_TOKEN"             -H 'content-type: application/json'             --data "$RESULT_BODY"             "$STAGING_URL/api/task-inbox/$TASK_ID/result")"
          printf '%s' "$RESULT_JSON" | jq -e '.ok == true and .task.status == "DONE"' >/dev/null

          TRAIL_JSON="$(curl --fail --silent --show-error             -H "authorization: Bearer $OWNER_TOKEN"             "$STAGING_URL/api/task-inbox/$TASK_ID/trail")"
          printf '%s' "$TRAIL_JSON" | jq -e '
            .ok == true and
            .canonical_trail == "owner-main" and
            ([.events[].event_type] | index("TASK_ASSIGNED") != null) and
            ([.events[].event_type] | index("TASK_RESULT_DONE") != null)
          ' >/dev/null

          {
            echo "### OGE-57 staging E2E"
            echo ""
            echo "PASS — assignment → target inbox → DONE result → owner-main event trail."
            echo "Task id: \`$TASK_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify configured provider bindings in Blue registry
        if: steps.scope.outputs.ui_only != 'true'
        shell: bash
        env:
          EXPECTED_ACTORS: ${{ steps.runtime_secrets.outputs.expected_actor_ids }}
        run: |
          set -euo pipefail
          REGISTRY="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            -H "x-ogenic-ops-key: ${OGENIC_OPS_KEY}" \
            "${STAGING_URL}/api/blue-diamond/registry")"
          printf '%s' "$REGISTRY" | jq -e '.ok == true' >/dev/null
          IFS=',' read -r -a ACTORS <<< "${EXPECTED_ACTORS:-}"
          for actor in "${ACTORS[@]}"; do
            test -n "$actor" || continue
            printf '%s' "$REGISTRY" | jq -e --arg actor "$actor" \
              '.actors[] | select(.actor_id == $actor) | (.state != "CONFIGURATION_REQUIRED" and .state != "OFFLINE" and .auth_ref == "SERVER_SIDE_REFERENCE_PRESENT")' >/dev/null \
              || { echo "::error::runtime binding verification failed for ${actor}"; exit 1; }
          done
          printf '%s' "$REGISTRY" | jq -r '.actors[] | select(.actor_id | test("^(athena-command|codex-execution-agent|manus-candidate|perplexity-candidate|deepseek-candidate|claude-candidate|gemini-candidate|grok-candidate|meta-model-candidate)$")) | "\(.actor_id)=\(.state)"' >> "$GITHUB_STEP_SUMMARY"
          echo "STAGING_PROVIDER_BINDINGS_VERIFIED"

      - name: Verify owner auth, dashboard, connector hub, and Browser Run bridge
        shell: bash
        run: |
          set -euo pipefail
          COOKIE_JAR="$(mktemp)"
          UNAUTH_BODY="$(mktemp)"
          trap 'rm -f "$COOKIE_JAR" "$UNAUTH_BODY"' EXIT

          UNAUTH_CODE=""
          for attempt in $(seq 1 15); do
            UNAUTH_CODE="$(curl --silent --show-error --output "$UNAUTH_BODY" --write-out '%{http_code}' "${STAGING_URL}/api/dashboard")"
            if test "$UNAUTH_CODE" = "401" && jq -e '.ok == false and .code == "REAUTH_REQUIRED"' "$UNAUTH_BODY" >/dev/null 2>&1; then
              echo "Protected dashboard rollout observed on attempt $attempt."
              break
            fi
            if test "$attempt" = "15"; then
              echo "::error::unauthenticated dashboard did not converge to HTTP 401; last HTTP $UNAUTH_CODE"
              cat "$UNAUTH_BODY"
              exit 1
            fi
            sleep 2
          done

          UNAUTH_CODE="$(curl --silent --show-error --output "$UNAUTH_BODY" --write-out '%{http_code}' "${STAGING_URL}/api/connectors")"
          test "$UNAUTH_CODE" = "401" || { echo "::error::unauthenticated connectors returned HTTP $UNAUTH_CODE"; cat "$UNAUTH_BODY"; exit 1; }

          UNAUTH_CODE="$(curl --silent --show-error --output "$UNAUTH_BODY" --write-out '%{http_code}' "${STAGING_URL}/api/browser-session")"
          test "$UNAUTH_CODE" = "401" || { echo "::error::unauthenticated browser session returned HTTP $UNAUTH_CODE"; cat "$UNAUTH_BODY"; exit 1; }

          UNAUTH_CODE="$(curl --silent --show-error --output "$UNAUTH_BODY" --write-out '%{http_code}' "${STAGING_URL}/api/manus/status")"
          test "$UNAUTH_CODE" = "401" || { echo "::error::unauthenticated Manus status returned HTTP $UNAUTH_CODE"; cat "$UNAUTH_BODY"; exit 1; }

          printf '{"owner_key":%s}' "$(jq -Rn --arg value "$OGENIC_OPS_KEY" '$value')" \
            | curl --fail --silent --show-error --cookie-jar "$COOKIE_JAR" \
                --header 'Content-Type: application/json' --data-binary @- "${STAGING_URL}/api/session" \
            | jq -e '.ok == true and .authenticated == true and .user.role == "owner"' >/dev/null

          DASHBOARD="$(curl --fail --silent --show-error --cookie "$COOKIE_JAR" "${STAGING_URL}/api/dashboard")"
          printf '%s' "$DASHBOARD" | jq -e '
            .ok == true and
            .app.version == "0.2" and
            .runtime.branch == "Unified-on-Progress" and
            ([.tools[].id] | sort) == (["github", "linear", "meta", "n8n"] | sort) and
            ([.tools[].state] | all(. == "LIVE" or . == "CONFIGURATION_REQUIRED" or . == "ERROR"))
          ' >/dev/null

          # Owner-authorized, read-only proof of the original certificate in staging D1.
          CERTIFICATE_JSON="$(curl --fail --silent --show-error --cookie "$COOKIE_JAR" "${STAGING_URL}/api/system/certificate-lincenc")"
          printf '%s' "$CERTIFICATE_JSON" | jq -e '
            .ok == true and .read_only == true and
            .integrity == "D1_DOCUMENT_SHA256_MATCH" and
            .certificate_id == "oge-128-wave-runner-01-baseline-20261018" and
            .plugins.total == 23 and .plugins.historical_verified_read_api == 18 and
            .runtime_e2e_verified == false and
            .storage.database == "ogenic-phase-vi-staging" and
            .storage.table == "certificate_lincenc"
          ' >/dev/null || { echo "::error::Original Certificate lincenc D1 readback failed"; exit 1; }
          echo "CERTIFICATE_LINCENC_STAGING_OWNER_ENDPOINT_READBACK=PASS"
          echo "- Certificate lincenc: **Owner-authenticated D1 SHA-256 readback PASS**; 23 plugin groups; runtime E2E reported separately." >> "$GITHUB_STEP_SUMMARY"
          CONNECTORS="$(curl --fail --silent --show-error --cookie "$COOKIE_JAR" "${STAGING_URL}/api/connectors")"
          printf '%s' "$CONNECTORS" | jq -e '
            .ok == true and
            ([.connectors[].id] | index("line") != null) and
            ([.connectors[].id] | index("meta") != null) and
            ([.connectors[].id] | index("n8n") != null) and
            ([.connectors[].id] | index("openai_hooks") != null)
          ' >/dev/null

          BROWSER_BRIDGE="$(curl --fail --silent --show-error --cookie "$COOKIE_JAR" "${STAGING_URL}/api/browser-session")"
          printf '%s' "$BROWSER_BRIDGE" | jq -e '
            .ok == true and
            .state == "READY" and
            .provider == "cloudflare_browser_run" and
            .live_view == true and
            .human_in_the_loop == true
          ' >/dev/null

          MANUS_BRIDGE="$(curl --fail --silent --show-error --cookie "$COOKIE_JAR" "${STAGING_URL}/api/manus/status")"
          printf '%s' "$MANUS_BRIDGE" | jq -e '
            .ok == true and
            .provider == "manus_api_v2" and
            (.state == "BOUND" or .state == "CONFIGURATION_REQUIRED")
          ' >/dev/null

          if printf '%s\n%s\n%s\n%s' "$DASHBOARD" "$CONNECTORS" "$BROWSER_BRIDGE" "$MANUS_BRIDGE" | grep -Eq 'OPENAI_API_KEY|OPENAI_EXECUTOR_API_KEY|OGENIC_OPS_KEY|LINE_CHANNEL_ACCESS_TOKEN|LINE_SECRET_CHANNEL|META_APP_SECRET|META_PAGE_ACCESS_TOKEN|N8N_API_KEY|GITHUB_TOKEN|LINEAR_API_KEY|MANUS_API_KEY|PERPLEXITY_API_KEY|DEEPSEEK_API_KEY|ANTHROPIC_API_KEY|GEMINI_API_KEY|XAI_API_KEY|META_MODEL_API_KEY'; then
            echo "::error::control plane response leaked a protected binding name"
            exit 1
          fi
          echo "Owner auth, connector hub, Browser Run mobile bridge, and Manus bridge state verified without starting billable sessions/tasks."

      - name: Bootstrap Discord workspace (idempotent)
        if: steps.scope.outputs.ui_only != 'true'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          if test -z "${DISCORD_TOKEN:-}"; then
            echo "::warning::DISCORD_TOKEN is not configured in Infisical; skipping Discord workspace bootstrap."
            echo "- Discord workspace bootstrap: skipped (DISCORD_TOKEN missing)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          STATUS_FILE="$(mktemp)"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$STATUS_FILE" "$BODY_FILE"' EXIT

          STATUS_CODE="$(curl --silent --show-error --output "$STATUS_FILE" --write-out '%{http_code}' \
            --header "x-ogenic-ops-key: ${OGENIC_OPS_KEY}" \
            "${STAGING_URL}/api/discord/status")"
          echo "Discord status probe HTTP $STATUS_CODE"
          if jq -e 'type == "object"' "$STATUS_FILE" >/dev/null 2>&1; then
            jq '{ok,state,code,message,missing,bot,guild,channel_count:(.channels|length),capabilities}' "$STATUS_FILE"
          else
            echo "Discord status response was not JSON; bytes=$(wc -c < "$STATUS_FILE")"
          fi

          HTTP_CODE="$(curl --silent --show-error --output "$BODY_FILE" --write-out '%{http_code}' \
            --request POST \
            --header "x-ogenic-ops-key: ${OGENIC_OPS_KEY}" \
            --header 'content-type: application/json' \
            --data '{}' \
            "${STAGING_URL}/api/discord/workspace/bootstrap")"

          if test "$HTTP_CODE" != "200" && test "$HTTP_CODE" != "207"; then
            echo "::error::Discord workspace bootstrap endpoint returned HTTP $HTTP_CODE; response bytes=$(wc -c < "$BODY_FILE")"
            if test -s "$BODY_FILE"; then jq '{ok,state,code,message,guild,created_count,reused_count,issues}' "$BODY_FILE" 2>/dev/null || head -c 1200 "$BODY_FILE"; fi
            echo "- Discord workspace bootstrap: HTTP $HTTP_CODE (see status probe in step log)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          jq -e '.state == "BOOTSTRAPPED" or .state == "PARTIAL"' "$BODY_FILE" >/dev/null || {
            echo "::error::Discord workspace bootstrap returned an unexpected response."
            cat "$BODY_FILE"
            exit 1
          }
          STATE="$(jq -r '.state' "$BODY_FILE")"
          CREATED="$(jq -r '.created_count // 0' "$BODY_FILE")"
          REUSED="$(jq -r '.reused_count // 0' "$BODY_FILE")"
          CHANNELS="$(jq -r '.channel_count // 0' "$BODY_FILE")"
          ISSUES="$(jq -c '.issues // []' "$BODY_FILE")"
          echo "Discord workspace bootstrap result: state=$STATE created=$CREATED reused=$REUSED channels=$CHANNELS"
          echo "- Discord workspace bootstrap: **$STATE**; created $CREATED; reused $REUSED; server channels $CHANNELS." >> "$GITHUB_STEP_SUMMARY"
          if test "$STATE" != "BOOTSTRAPPED"; then
            echo "::warning::Discord workspace bootstrap was partial: $ISSUES"
            echo "- Issues: `$ISSUES`" >> "$GITHUB_STEP_SUMMARY"
          fi
