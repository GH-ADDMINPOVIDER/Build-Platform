name: Provider Incentive Staging Deploy

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - ".github/workflows/provider-incentive-staging-deploy.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "capacitor.config.ts"
      - "worker/**"
      - "workflows/**"
      - "database/**"
      - "config/**"
      - "package.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  WORKER_NAME: ogenic-phase-vi-staging
  D1_DATABASE_NAME: ogenic-phase-vi-staging
  STAGING_URL: https://wave.ogenicchocolate.com
  OGENIC_GIT_SHA: ${{ github.sha }}
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}
  INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG || 'staging' }}
  N8N_BASE_URL: ${{ vars.N8N_BASE_URL || 'https://ogenic-registry.app.n8n.cloud' }}

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect staging change scope
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          UI_ONLY=false
          DB_CHANGED=false
          if test "${GITHUB_EVENT_NAME}" = "push" && [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            fi
            CHANGED="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
            if test -n "$CHANGED" && ! printf '%s\n' "$CHANGED" | grep -Eqv '^(src/|tests/|docs/)'; then
              UI_ONLY=true
            fi
            if printf '%s\n' "$CHANGED" | grep -Eq '^database/'; then
              DB_CHANGED=true
            fi
          fi
          echo "ui_only=$UI_ONLY" >> "$GITHUB_OUTPUT"
          echo "db_changed=$DB_CHANGED" >> "$GITHUB_OUTPUT"
          echo "Frontend-only deploy: $UI_ONLY; database changes: $DB_CHANGED."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Auto-discover Infisical project and Cloudflare credential source
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load Cloudflare credentials from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: ${{ steps.infisical_project.outputs.secret_env_slug }}
          secret-path: ${{ steps.infisical_project.outputs.secret_path }}

      - name: Load staging runtime secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true

      - name: Normalize canonical runtime secret names
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          manifest = json.loads(Path('config/staging-runtime-bindings.json').read_text())
          normalized = 0
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for canonical, aliases in manifest.get('aliases', {}).items():
                  # OGE-40 regression isolation proved the staging GITHUB_TOKEN
                  # binding can be malformed while the established OGE34 alias is healthy.
                  # Preserve the last-known-good authoritative GitHub READ binding without
                  # exposing or mutating the secret at rest.
                  if canonical == 'GITHUB_TOKEN':
                      proven_github = os.environ.get('GITHUB_TOKEN_OGE34')
                      if proven_github:
                          output.write(f'{canonical}={proven_github}\n')
                          normalized += 1
                          continue
                  if os.environ.get(canonical):
                      continue
                  for alias in aliases:
                      value = os.environ.get(alias)
                      if value:
                          output.write(f'{canonical}={value}\n')
                          normalized += 1
                          break
          print(f'Normalized {normalized} runtime secret aliases; values not printed.')
          PY

      - name: Report staging runtime binding coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          manifest = json.loads(Path('config/staging-runtime-bindings.json').read_text())
          keys = manifest['required'] + manifest['provider_optional']
          configured = [key for key in keys if os.environ.get(key)]
          missing = [key for key in keys if not os.environ.get(key)]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Staging runtime binding coverage\n\n')
              summary.write('| Binding | State |\n|---|---|\n')
              for key in keys:
                  summary.write(f'| `{key}` | {"CONFIGURED" if os.environ.get(key) else "MISSING"} |\n')
              summary.write('\nNo secret values are printed.\n')
          print(f'Runtime binding coverage: {len(configured)} configured, {len(missing)} missing; values not printed.')
          PY

      - name: Require staging authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "${OPENAI_API_KEY:-}" || { echo "::error::missing OPENAI_API_KEY"; exit 1; }
          test -n "${OGENIC_OPS_KEY:-}" || { echo "::error::missing OGENIC_OPS_KEY"; exit 1; }

      - name: Install dependencies
        run: npm install --package-lock-only && npm ci

      - name: Paid provider live smoke deferred by owner
        if: steps.scope.outputs.ui_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "DeepSeek and Perplexity live smoke are billing-deferred by owner."
          echo "No paid provider call is allowed to block unrelated staging deploys."
          echo "Readiness attestations remain unchanged until a dedicated provider proof succeeds."

      - name: Resolve staging D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          DB_ID="$(npx wrangler d1 list --json | jq -r --arg NAME "$D1_DATABASE_NAME" '.[] | select(.name == $NAME) | .uuid' | head -n1)"
          test -n "$DB_ID" && test "$DB_ID" != "null" || { echo "::error::staging D1 database not found"; exit 1; }
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Generate staging binding
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('wrangler.jsonc')
          cfg = json.loads(path.read_text())
          cfg['name'] = os.environ['WORKER_NAME']
          vars = cfg.setdefault('vars', {})
          vars['OGENIC_GIT_SHA'] = os.environ['OGENIC_GIT_SHA']
          for key in [
              'OGENIC_READINESS_PERPLEXITY_API',
              'OGENIC_READINESS_PERPLEXITY_QUOTA',
              'OGENIC_READINESS_PERPLEXITY_BILLING',
              'OGENIC_READINESS_DEEPSEEK_API',
              'OGENIC_READINESS_DEEPSEEK_QUOTA',
              'OGENIC_READINESS_DEEPSEEK_BILLING',
          ]:
              if os.environ.get(key):
                  vars[key] = os.environ[key]
          cfg['d1_databases'] = [{
              'binding': 'DB',
              'database_name': os.environ['D1_DATABASE_NAME'],
              'database_id': os.environ['D1_DATABASE_ID'],
              'migrations_dir': 'database/migrations'
          }]
          path.write_text(json.dumps(cfg, indent=2) + '\n')
          PY

      - name: Apply D1 migrations only for database changes
        if: steps.scope.outputs.db_changed == 'true'
        run: npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config wrangler.jsonc

      - name: Typecheck and build
        run: npm run check

      - name: Prepare protected runtime secret bundle
        if: steps.scope.outputs.ui_only != 'true'
        id: runtime_secrets
        shell: bash
        run: |
          set -euo pipefail
          SECRETS_FILE="$(mktemp)"
          chmod 600 "$SECRETS_FILE"
          export SECRETS_FILE
          python - <<'PY'
          import json, os
          from pathlib import Path

          manifest = json.loads(Path('config/staging-runtime-bindings.json').read_text())
          keys = manifest['required'] + manifest['provider_optional'] + manifest['connector_optional']
          payload = {key: os.environ[key] for key in keys if os.environ.get(key)}
          missing_required = [key for key in manifest['required'] if not payload.get(key)]
          if missing_required:
              raise SystemExit('required Worker runtime secret missing: ' + ', '.join(missing_required))
          with open(os.environ['SECRETS_FILE'], 'w', encoding='utf-8') as output:
              json.dump(payload, output)

          actor_map = manifest.get('actor_map', {})
          expected = [actor for key, actor in actor_map.items() if payload.get(key)]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('expected_actor_ids=' + ','.join(expected) + '\n')
          print(f'Prepared {len(payload)} protected runtime bindings; values not printed.')
          print(f'Expecting {len(expected)} Blue runtime actors to expose server-side references.')
          PY
          echo "file=$SECRETS_FILE" >> "$GITHUB_OUTPUT"

      - name: Deploy staging Worker with protected bindings
        shell: bash
        env:
          SECRETS_FILE: ${{ steps.runtime_secrets.outputs.file }}
          UI_ONLY: ${{ steps.scope.outputs.ui_only }}
        run: |
          set -euo pipefail
          if test "$UI_ONLY" = "true"; then
            npx wrangler deploy --config dist/ogenic_phase_vi_staging/wrangler.json --keep-vars
            echo "Frontend-only staging code deployed; existing secrets kept; D1 migrations skipped."
          else
            trap 'rm -f "$SECRETS_FILE"' EXIT
            npx wrangler deploy --config dist/ogenic_phase_vi_staging/wrangler.json --secrets-file "$SECRETS_FILE"
            echo "Staging code + protected bindings deployed atomically."
          fi

      - name: Verify staging health
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "${STAGING_URL}/api/health")"
          echo "$BODY"
          printf '%s' "$BODY" | jq -e '.ok == true or .status == "ok" or .status == "healthy"' >/dev/null
          echo "Staging deploy verified: ${STAGING_URL}"

      - name: OGE-57 live staging task inbox roundtrip
        if: steps.scope.outputs.ui_only != 'true'
        shell: bash
        run: |
          set -euo pipefail

          LOGIN_PAYLOAD="$(jq -nc --arg key "$OGENIC_OPS_KEY" '{owner_key:$key}')"
          SESSION_JSON="$(curl --fail --silent --show-error             -H 'content-type: application/json'             -H 'x-ogenic-client: native'             --data "$LOGIN_PAYLOAD"             "$STAGING_URL/api/session")"
          OWNER_TOKEN="$(printf '%s' "$SESSION_JSON" | jq -r '.session_token // empty')"
          test -n "$OWNER_TOKEN" || { echo "::error::OGE-57 staging owner session unavailable"; exit 1; }
          echo "::add-mask::$OWNER_TOKEN"

          SESSIONS_JSON="$(curl --fail --silent --show-error             -H "authorization: Bearer $OWNER_TOKEN"             "$STAGING_URL/api/1lss/sessions?limit=50")"

          mapfile -t SESSION_REFS < <(
            printf '%s' "$SESSIONS_JSON" | jq -r '
              [.sessions[]? | select(.source_surface != "openai-agent") | .session_ref]
              | unique
              | .[]
            ' | head -n 2
          )

          if test "${#SESSION_REFS[@]}" -lt 2; then
            echo "::notice::OGE-57 live E2E DEFERRED: fewer than two non-provider 1LSS session refs are available."
            {
              echo "### OGE-57 staging E2E"
              echo ""
              echo "DEFERRED — fewer than two non-provider session refs are available in owner-main."
              echo "Core CI remains verified; no schema change was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ORIGIN_REF="${SESSION_REFS[0]}"
          TARGET_REF="${SESSION_REFS[1]}"
          IDEMPOTENCY="oge57-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ASSIGN_BODY="$(jq -nc             --arg title "OGE-57 staging cross-session roundtrip"             --arg origin "$ORIGIN_REF"             --arg target "$TARGET_REF"             '{title:$title,origin_session_ref:$origin,target_session_ref:$target,priority:60}')"

          ASSIGN_JSON="$(curl --fail --silent --show-error             -H "authorization: Bearer $OWNER_TOKEN"             -H "Idempotency-Key: $IDEMPOTENCY"             -H 'content-type: application/json'             --data "$ASSIGN_BODY"             "$STAGING_URL/api/task-inbox/assign")"
          TASK_ID="$(printf '%s' "$ASSIGN_JSON" | jq -r '.task.id // empty')"
          test -n "$TASK_ID" || { echo "::error::OGE-57 assignment returned no task id"; exit 1; }

          INBOX_JSON="$(curl --fail --silent --show-error             -H "authorization: Bearer $OWNER_TOKEN"             --get --data-urlencode "session_ref=$TARGET_REF"             "$STAGING_URL/api/task-inbox")"
          printf '%s' "$INBOX_JSON" | jq -e --arg task "$TASK_ID" '.tasks | any(.id == $task)' >/dev/null

          RESULT_BODY="$(jq -nc             --arg session "$TARGET_REF"             --arg ref "github-actions://${GITHUB_RUN_ID}/oge-57"             --arg summary "Staging target session completed the deterministic OGE-57 roundtrip."             '{session_ref:$session,status:"DONE",result_ref:$ref,summary:$summary}')"

          RESULT_JSON="$(curl --fail --silent --show-error             -H "authorization: Bearer $OWNER_TOKEN"             -H 'content-type: application/json'             --data "$RESULT_BODY"             "$STAGING_URL/api/task-inbox/$TASK_ID/result")"
          printf '%s' "$RESULT_JSON" | jq -e '.ok == true and .task.status == "DONE"' >/dev/null

          TRAIL_JSON="$(curl --fail --silent --show-error             -H "authorization: Bearer $OWNER_TOKEN"             "$STAGING_URL/api/task-inbox/$TASK_ID/trail")"
          printf '%s' "$TRAIL_JSON" | jq -e '
            .ok == true and
            .canonical_trail == "owner-main" and
            ([.events[].event_type] | index("TASK_ASSIGNED") != null) and
            ([.events[].event_type] | index("TASK_RESULT_DONE") != null)
          ' >/dev/null

          {
            echo "### OGE-57 staging E2E"
            echo ""
            echo "PASS — assignment → target inbox → DONE result → owner-main event trail."
            echo "Task id: `$TASK_ID`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify configured provider bindings in Blue registry
        if: steps.scope.outputs.ui_only != 'true'
        shell: bash
        env:
          EXPECTED_ACTORS: ${{ steps.runtime_secrets.outputs.expected_actor_ids }}
        run: |
          set -euo pipefail
          REGISTRY="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            -H "x-ogenic-ops-key: ${OGENIC_OPS_KEY}" \
            "${STAGING_URL}/api/blue-diamond/registry")"
          printf '%s' "$REGISTRY" | jq -e '.ok == true' >/dev/null
          IFS=',' read -r -a ACTORS <<< "${EXPECTED_ACTORS:-}"
          for actor in "${ACTORS[@]}"; do
            test -n "$actor" || continue
            printf '%s' "$REGISTRY" | jq -e --arg actor "$actor" \
              '.actors[] | select(.actor_id == $actor) | (.state != "CONFIGURATION_REQUIRED" and .state != "OFFLINE" and .auth_ref == "SERVER_SIDE_REFERENCE_PRESENT")' >/dev/null \
              || { echo "::error::runtime binding verification failed for ${actor}"; exit 1; }
          done
          printf '%s' "$REGISTRY" | jq -r '.actors[] | select(.actor_id | test("^(athena-command|codex-execution-agent|manus-candidate|perplexity-candidate|deepseek-candidate|claude-candidate|gemini-candidate|grok-candidate)$")) | "\(.actor_id)=\(.state)"' >> "$GITHUB_STEP_SUMMARY"
          echo "STAGING_PROVIDER_BINDINGS_VERIFIED"

      - name: Verify owner auth, dashboard, connector hub, and Browser Run bridge
        shell: bash
        run: |
          set -euo pipefail
          COOKIE_JAR="$(mktemp)"
          UNAUTH_BODY="$(mktemp)"
          trap 'rm -f "$COOKIE_JAR" "$UNAUTH_BODY"' EXIT

          UNAUTH_CODE=""
          for attempt in $(seq 1 15); do
            UNAUTH_CODE="$(curl --silent --show-error --output "$UNAUTH_BODY" --write-out '%{http_code}' "${STAGING_URL}/api/dashboard")"
            if test "$UNAUTH_CODE" = "401" && jq -e '.ok == false and .code == "REAUTH_REQUIRED"' "$UNAUTH_BODY" >/dev/null 2>&1; then
              echo "Protected dashboard rollout observed on attempt $attempt."
              break
            fi
            if test "$attempt" = "15"; then
              echo "::error::unauthenticated dashboard did not converge to HTTP 401; last HTTP $UNAUTH_CODE"
              cat "$UNAUTH_BODY"
              exit 1
            fi
            sleep 2
          done

          UNAUTH_CODE="$(curl --silent --show-error --output "$UNAUTH_BODY" --write-out '%{http_code}' "${STAGING_URL}/api/connectors")"
          test "$UNAUTH_CODE" = "401" || { echo "::error::unauthenticated connectors returned HTTP $UNAUTH_CODE"; cat "$UNAUTH_BODY"; exit 1; }

          UNAUTH_CODE="$(curl --silent --show-error --output "$UNAUTH_BODY" --write-out '%{http_code}' "${STAGING_URL}/api/browser-session")"
          test "$UNAUTH_CODE" = "401" || { echo "::error::unauthenticated browser session returned HTTP $UNAUTH_CODE"; cat "$UNAUTH_BODY"; exit 1; }

          UNAUTH_CODE="$(curl --silent --show-error --output "$UNAUTH_BODY" --write-out '%{http_code}' "${STAGING_URL}/api/manus/status")"
          test "$UNAUTH_CODE" = "401" || { echo "::error::unauthenticated Manus status returned HTTP $UNAUTH_CODE"; cat "$UNAUTH_BODY"; exit 1; }

          printf '{"owner_key":%s}' "$(jq -Rn --arg value "$OGENIC_OPS_KEY" '$value')" \
            | curl --fail --silent --show-error --cookie-jar "$COOKIE_JAR" \
                --header 'Content-Type: application/json' --data-binary @- "${STAGING_URL}/api/session" \
            | jq -e '.ok == true and .authenticated == true and .user.role == "owner"' >/dev/null

          DASHBOARD="$(curl --fail --silent --show-error --cookie "$COOKIE_JAR" "${STAGING_URL}/api/dashboard")"
          printf '%s' "$DASHBOARD" | jq -e '
            .ok == true and
            .app.version == "0.2" and
            .runtime.branch == "phase-vi-provider-incentive-metering" and
            ([.tools[].id] | sort) == (["github", "linear", "meta", "n8n"] | sort) and
            ([.tools[].state] | all(. == "LIVE" or . == "CONFIGURATION_REQUIRED" or . == "ERROR"))
          ' >/dev/null

          CONNECTORS="$(curl --fail --silent --show-error --cookie "$COOKIE_JAR" "${STAGING_URL}/api/connectors")"
          printf '%s' "$CONNECTORS" | jq -e '
            .ok == true and
            ([.connectors[].id] | index("line") != null) and
            ([.connectors[].id] | index("meta") != null) and
            ([.connectors[].id] | index("n8n") != null) and
            ([.connectors[].id] | index("openai_hooks") != null)
          ' >/dev/null

          BROWSER_BRIDGE="$(curl --fail --silent --show-error --cookie "$COOKIE_JAR" "${STAGING_URL}/api/browser-session")"
          printf '%s' "$BROWSER_BRIDGE" | jq -e '
            .ok == true and
            .state == "READY" and
            .provider == "cloudflare_browser_run" and
            .live_view == true and
            .human_in_the_loop == true
          ' >/dev/null

          MANUS_BRIDGE="$(curl --fail --silent --show-error --cookie "$COOKIE_JAR" "${STAGING_URL}/api/manus/status")"
          printf '%s' "$MANUS_BRIDGE" | jq -e '
            .ok == true and
            .provider == "manus_api_v2" and
            (.state == "BOUND" or .state == "CONFIGURATION_REQUIRED")
          ' >/dev/null

          if printf '%s\n%s\n%s\n%s' "$DASHBOARD" "$CONNECTORS" "$BROWSER_BRIDGE" "$MANUS_BRIDGE" | grep -Eq 'OPENAI_API_KEY|OPENAI_EXECUTOR_API_KEY|OGENIC_OPS_KEY|LINE_CHANNEL_ACCESS_TOKEN|LINE_SECRET_CHANNEL|META_APP_SECRET|META_PAGE_ACCESS_TOKEN|N8N_API_KEY|GITHUB_TOKEN|LINEAR_API_KEY|MANUS_API_KEY|PERPLEXITY_API_KEY|DEEPSEEK_API_KEY|ANTHROPIC_API_KEY|GEMINI_API_KEY|XAI_API_KEY'; then
            echo "::error::control plane response leaked a protected binding name"
            exit 1
          fi
          echo "Owner auth, connector hub, Browser Run mobile bridge, and Manus bridge state verified without starting billable sessions/tasks."
