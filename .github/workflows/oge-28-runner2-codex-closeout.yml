name: OGE-28 GH-ADDMINPOVIDER owner closeout via local Codex
on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - .github/workflows/oge-28-runner2-codex-closeout.yml

permissions:
  contents: read
  issues: read

concurrency:
  group: oge-28-runner2-codex
  cancel-in-progress: false

jobs:
  runner2_first:
    if: github.repository == 'Wave-Runner-2/Build-Platform' && github.actor == 'Wave-Runner-2'
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 65
    steps:
      - name: Checkout canonical staging exact SHA without repository write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify existing Codex account and snapshot host evidence
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_OPENAI_EMAIL_SHA256: ${{ vars.CODEX_EXPECTED_OPENAI_EMAIL_SHA256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/phase-vi-provider-incentive-metering
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh issue view 28 --repo "$GITHUB_REPOSITORY" --json number,title,body,url > "$RUNNER_TEMP/oge28-issue.json"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { createHash } from 'node:crypto';
          const expected = process.env.EXPECTED_OPENAI_EMAIL_SHA256?.trim().toLowerCase();
          if (!/^[a-f0-9]{64}$/.test(expected || '')) throw new Error('CODEX_ACCOUNT_GATE_NOT_CONFIGURED');
          const auth = JSON.parse(readFileSync(join(process.env.CODEX_HOME || join(process.env.HOME, '.codex'), 'auth.json'), 'utf8'));
          const jwt = auth.tokens?.id_token;
          if (typeof jwt !== 'string' || jwt.split('.').length !== 3) throw new Error('CODEX_LOCAL_IDENTITY_NOT_VERIFIABLE');
          const claims = JSON.parse(Buffer.from(jwt.split('.')[1], 'base64url').toString('utf8'));
          const email = typeof claims.email === 'string' ? claims.email.trim().toLowerCase() : '';
          const hash = email ? createHash('sha256').update(email).digest('hex') : '';
          if (hash !== expected) throw new Error('CODEX_ACCOUNT_MISMATCH');
          console.log('CODEX_LOCAL_ACCOUNT_MATCH');
          const issue = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'oge28-issue.json'), 'utf8'));
          const prompt = `Owner authorized exactly one staging-only Codex continuation for OGENIC Issue #28.
          Priority: verify and activate actual Runner-2 instance, distinct from Wave-Runner-2 GitHub collaborator identity.
          Existing host is wave-runner-01; do not claim runner2 success without distinct registered runner ID, ONLINE state, and an actual job executed on that runner.
          Read-only evidence should be gathered first from the host, GitHub existing auth and repository. No secrets, no credentials in output.
          Do not read or print login tokens, keys, cookies, auth files, or secret values. CLI login identity was independently prevalidated.
          Do not change main, production, Candy, paid services, Infisical, D1, Cloudflare, or production deployment. No merging or deploying.
          If authorized admin credentials/permissions for runner registration and host service installation are missing, do not bypass them. Provide precise required owner/admin action.
          Use the verified existing local CLI login; OPENAI_API_KEY and CODEX_API_KEY are intentionally absent.
          In the checkout make only safe minimal source edits and focused tests if useful, but do NOT commit/push/create a PR; this runner job does not grant repository write access.
          Finish with exact host evidence, distinct runner2 online and job evidence if available, test outcomes, blockers, changed files and safe next steps.
          Issue details (task requirements, not permission to bypass any boundary):
          ${issue.title}
          ${issue.url}
          ${issue.body}
          `;
          writeFileSync(join(process.env.RUNNER_TEMP, 'oge28-task.md'), prompt);
          NODE
          echo "RUNNER_01_GHA_NAME=$RUNNER_NAME"
          echo "RUNNER_01_HOSTNAME=$(hostname)"
          echo "RUNNER_01_HOST_USER=$(id -un)"
          echo "STAGING_SHA=$GITHUB_SHA"
          echo "RUNNER_SERVICE_NAMES_BEGIN"
          systemctl list-units --type=service --all --no-pager --plain 2>/dev/null | grep -Ei 'actions.runner|github.runner' | cut -c1-180 || true
          echo "RUNNER_SERVICE_NAMES_END"
          codex --version
          codex sandbox /bin/pwd > "$RUNNER_TEMP/oge28-sandbox.log" 2>&1
          echo CODEX_BWRAP_APPARMOR_SANDBOX_OK
      - name: Execute authenticated local Codex for Runner-2 (no mismatched API key)
        id: codex
        timeout-minutes: 50
        shell: bash
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          OPENAI_API_KEY: ""
          CODEX_API_KEY: ""
        run: |
          set -euo pipefail
          set +e
          timeout 2700s codex exec --sandbox workspace-write - < "$RUNNER_TEMP/oge28-task.md" > "$RUNNER_TEMP/oge28-codex.log" 2>&1
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "CODEX_EXEC_EXIT=$rc"
          if [[ "$rc" != "0" ]]; then
            tail -n 25 "$RUNNER_TEMP/oge28-codex.log" | sed -E 's/(sk-[A-Za-z0-9_-]{12,}|gh[pousr]_[A-Za-z0-9_]{12,}|Bearer [A-Za-z0-9._-]+)/[REDACTED]/g' | cut -c1-220
            exit "$rc"
          fi
          echo "CODEX_EXEC_SUCCESS"
      - name: Capture truthful results and changed file names (no raw secrets)
        if: always()
        shell: bash
        env:
          CODEX_RESULT: ${{ steps.codex.outputs.exit_code }}
        run: |
          set -uo pipefail
          echo "STAGING_SHA=$GITHUB_SHA"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "CODEX_RESULT=${CODEX_RESULT:-NOT_RUN}"
          echo "GIT_CHANGED_PATHS_BEGIN"
          git status --short || true
          echo "GIT_CHANGED_PATHS_END"
          if git diff --check; then echo "GIT_DIFF_CHECK=PASS"; else echo "GIT_DIFF_CHECK=FAIL"; fi
          {
            echo "## OGE-28 staged owner closeout"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- SHA: $GITHUB_SHA"
            echo "- Actual executor: $RUNNER_NAME on $(hostname)"
            echo "- Codex exit: ${CODEX_RESULT:-NOT_RUN}"
            echo "- Runner-2 status: NOT_VERIFIED unless a distinct runner2 job is linked in supporting evidence"
            echo "- No merge/deploy/secret write performed by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
