name: OGE-78 USE CARD check

on:
  push:
    branches:
      - phase-vi-provider-incentive-metering
    paths:
      - "config/use-card-policy.json"
      - "worker/use-card-policy.ts"
      - "worker/use-card-api.ts"
      - "worker/capability-execution-api.ts"
      - "worker/entry-yellow-stone.ts"
      - "tests/oge-78-use-card.test.mjs"
      - "tests/oge-79-ccs-protocol.test.mjs"
      - "tests/oge-82-ccs-authority.test.mjs"
      - "worker/capability-card-stone.ts"
      - "worker/web-toolkit-alias.ts"
      - "worker/web-toolkit-alias.ts"
      - "worker/capability-card-stone-api.ts"
      - "worker/web-toolkit-alias.ts"
      - "config/capability-card-stone.json"
      - "assets/toolkit-manifest.json"
      - "docs/CCS_AUTHORITY_CONTRACT.md"
      - "docs/WEB_TOOLKIT_COST_GUARD.md"
      - "tests/web-toolkit-card-contract.test.mjs"
      - "worker/web-toolkit-alias.ts"
      - ".github/workflows/oge-78-use-card-check.yml"
  pull_request:
    branches:
      - phase-vi-provider-incentive-metering
    paths:
      - "config/capability-card-stone.json"
      - "worker/capability-card-stone.ts"
      - "worker/capability-card-stone-api.ts"
      - "assets/toolkit-manifest.json"
      - "docs/CCS_AUTHORITY_CONTRACT.md"
      - "docs/WEB_TOOLKIT_COST_GUARD.md"
      - "tests/oge-78-use-card.test.mjs"
      - "tests/oge-79-ccs-protocol.test.mjs"
      - "tests/oge-82-ccs-authority.test.mjs"
      - "tests/web-toolkit-card-contract.test.mjs"
      - ".github/workflows/oge-78-use-card-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Repository intentionally has no committed package-lock; generate an ephemeral one before npm ci.
      - run: npm install --package-lock-only --ignore-scripts && npm ci
      - run: node --test tests/oge-78-use-card.test.mjs tests/oge-79-ccs-protocol.test.mjs tests/oge-82-ccs-authority.test.mjs tests/web-toolkit-card-contract.test.mjs
      - run: npm run typecheck
      - run: npm run build
