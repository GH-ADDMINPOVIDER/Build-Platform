name: OGE-50 Unifiend Operate Evidence Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --package-lock-only && npm ci

      - name: Jobs runs and evidence regression
        run: node --test tests/unifiend-operate-evidence.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
