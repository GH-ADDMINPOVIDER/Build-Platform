name: GH2 WAVE D1 to Discord New Data and System Log End-to-End
on:
  push:
    branches: [feat/ccs-multi-protocol-docker-20261023]
    paths:
      - 'scripts/gh2-wave-d1-to-discord-e2e.mjs'
      - '.github/workflows/gh2-wave-d1-to-discord-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  real-d1-discord-pipeline:
    if: github.repository == 'Wave-Runner-2/Build-Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
      INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || 'ogenic-sio-ti-rv' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: staging
          secret-path: /
          recursive: false
      - name: Actual live D1 source receipt -> owner-signed WAVE Discord API -> two-channel POST/GET
        run: node scripts/gh2-wave-d1-to-discord-e2e.mjs
      - name: E2E gate boundaries
        if: always()
        run: echo 'LIVE_D1_TO_DISCORD_REQUIRES_GENUINE_RECEIPT; GREENSTONE_AND_ALL_SEVEN=NOT_CLAIMED'
