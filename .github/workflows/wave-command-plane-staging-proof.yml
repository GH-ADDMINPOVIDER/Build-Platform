name: WAVE Command Plane Staging Proof

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - "src/.wave-deploy-trigger"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  STAGING_URL: https://wave.ogenicchocolate.com
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}
  INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG || 'staging' }}

jobs:
  command-plane-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Discover Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load owner proof authorization via Infisical OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true

      - name: Wait for canonical staging command-plane endpoints
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OGENIC_OPS_KEY:-}" || { echo '::error::CONFIGURATION_REQUIRED: OGENIC_OPS_KEY'; exit 78; }
          echo "::add-mask::$OGENIC_OPS_KEY"
          COOKIE="$RUNNER_TEMP/wave-command-plane-cookie.jar"

          for _ in $(seq 1 60); do
            rm -f "$COOKIE"
            AUTH_CODE="$(printf '{\"owner_key\":%s}' "$(jq -Rn --arg value "$OGENIC_OPS_KEY" '$value')" \
              | curl --silent --show-error --cookie-jar "$COOKIE" \
                  --header 'Content-Type: application/json' --data-binary @- \
                  --output /tmp/wave-auth.json --write-out '%{http_code}' \
                  "${STAGING_URL}/api/session" || true)"
            if [ "$AUTH_CODE" = "200" ] && jq -e '.ok == true and .authenticated == true and .user.role == "owner"' /tmp/wave-auth.json >/dev/null 2>&1; then
              MCP_CODE="$(curl --silent --show-error --cookie "$COOKIE" --output /tmp/mcp-state.json --write-out '%{http_code}' "${STAGING_URL}/api/mcp-config/state" || true)"
              WD_CODE="$(curl --silent --show-error --cookie "$COOKIE" --output /tmp/wd-registry.json --write-out '%{http_code}' "${STAGING_URL}/api/white-diamond/registry" || true)"
              if [ "$MCP_CODE" = "200" ] && [ "$WD_CODE" = "200" ]; then
                echo 'WAVE_COMMAND_PLANE_ENDPOINTS_READY'
                exit 0
              fi
            fi
            sleep 5
          done
          echo '::error::WAVE_COMMAND_PLANE_ENDPOINT_TIMEOUT'
          exit 1

      - name: Verify OGE-29 MCP Config Center runtime contract
        shell: bash
        run: |
          set -euo pipefail
          COOKIE="$RUNNER_TEMP/wave-command-plane-cookie.jar"
          curl --fail --silent --show-error --cookie "$COOKIE" "${STAGING_URL}/api/mcp-config/state" > /tmp/mcp-state.json
          jq -e '.ok == true and .runtime == "WAVE_MCP_CONFIG_V1" and .canonical.conversation_id == "owner-main" and .canonical.session_line == "1LSS_OWNER_MAIN" and .policy == "OGE26_APPROVAL_REQUIRED_FOR_CONSEQUENTIAL_TOOLS"' /tmp/mcp-state.json >/dev/null

          curl --fail --silent --show-error --cookie "$COOKIE" "${STAGING_URL}/api/mcp-config/discover?provider=simulated" > /tmp/mcp-discovery.json
          jq -e '.ok == true and .state == "SIMULATED" and .real_available == false and (.tools | length) >= 2 and ([.tools[].risk] | all(. == "READ")) and .policy == "NO_EXTERNAL_SIDE_EFFECTS"' /tmp/mcp-discovery.json >/dev/null
          echo 'OGE29_MCP_CONFIG_RUNTIME_PROOF_OK'

      - name: Verify OGE-30 White Diamond registry and TEAM_3 plan
        shell: bash
        run: |
          set -euo pipefail
          COOKIE="$RUNNER_TEMP/wave-command-plane-cookie.jar"
          curl --fail --silent --show-error --cookie "$COOKIE" "${STAGING_URL}/api/white-diamond/registry" > /tmp/wd-registry.json
          jq -e '.ok == true and .runtime == "WHITE_DIAMOND_AGENT_REGISTRY_V1" and (.agents | length) == 15 and .max_active_specialists == 15 and .yellow_stone_required == true and .policy == "NO_DIRECT_EXECUTION_BYPASS" and .canonical.conversation_id == "owner-main" and .canonical.session_line == "1LSS_OWNER_MAIN" and (.canonical.latest_sequence | type == "number")' /tmp/wd-registry.json >/dev/null

          curl --fail --silent --show-error --cookie "$COOKIE" \
            --header 'Content-Type: application/json' \
            --data '{"intent":"inspect canonical repository and runtime status","mode":"TEAM_3","permission_class":"READ","parallel":true,"execute":false}' \
            "${STAGING_URL}/api/white-diamond/plan" > /tmp/wd-plan.json
          jq -e '.ok == true and (.run_id | startswith("wd_")) and .mode == "TEAM_3" and (.selected_agents | length) == 3 and (.children | length) == 3 and .parallel == true and .yellow_stone_required == true and .next == "/api/capabilities/resolve" and ([.children[].execution_authority] | all(. == "YELLOW_STONE_ONLY"))' /tmp/wd-plan.json >/dev/null
          echo 'OGE30_WHITE_DIAMOND_TEAM3_PROOF_OK'

      - name: Prove White Diamond cannot bypass Yellow Stone for writes
        shell: bash
        run: |
          set -euo pipefail
          COOKIE="$RUNNER_TEMP/wave-command-plane-cookie.jar"
          HTTP_CODE="$(curl --silent --show-error --cookie "$COOKIE" \
            --header 'Content-Type: application/json' \
            --data '{"intent":"write a deployment change","mode":"TEAM_3","permission_class":"WRITE","parallel":true,"execute":true}' \
            --output /tmp/wd-write-block.json --write-out '%{http_code}' \
            "${STAGING_URL}/api/white-diamond/plan")"
          test "$HTTP_CODE" = "409"
          jq -e '.ok == false and .code == "HUMAN_APPROVAL_REQUIRED" and .direct_execution_rejected == true and .yellow_stone_required == true and .next == "/api/capabilities/resolve"' /tmp/wd-write-block.json >/dev/null
          echo 'OGE30_NO_YELLOW_STONE_BYPASS_PROOF_OK'

      - name: Publish sanitized proof artifact
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg branch "phase-vi-provider-incentive-metering" \
            --arg sha "$GITHUB_SHA" \
            '{ok:true,branch:$branch,workflow_sha:$sha,oge29:"verified",oge30:"verified",mcp_real_claim:false,mcp_simulated_read_proof:true,white_diamond_agents:15,white_diamond_team3:true,yellow_stone_bypass_rejected:true,canonical:{conversation_id:"owner-main",session_line:"1LSS_OWNER_MAIN"},side_effects:false}' \
            > wave-command-plane-proof.json

      - uses: actions/upload-artifact@v4
        with:
          name: wave-command-plane-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: wave-command-plane-proof.json
          retention-days: 14
          if-no-files-found: error
