name: GH2 OCIAN host bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gh2-ocian-host-bootstrap.yml"

permissions:
  contents: read
  id-token: write

env:
  INFISICAL_API_URL: https://app.infisical.com
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_ENV_SLUG: staging
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}

jobs:
  rebind-existing-host:
    name: Rebind existing OCIAN runner to GH2
    runs-on: ubuntu-latest
    environment: GH2-OCIAN-STAGING
    steps:
      - name: Resolve Infisical project through GH2 OIDC
        id: infisical_project
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?missing GitHub OIDC request URL}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?missing GitHub OIDC request token}"
          oidc_response="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          oidc_jwt="$(printf '%s' "$oidc_response" | jq -r '.value // empty')"
          test -n "$oidc_jwt"
          login_payload="$(jq -n --arg identityId "${INFISICAL_IDENTITY_ID}" --arg jwt "$oidc_jwt" --arg organizationSlug "${INFISICAL_ORG_SLUG}" '{identityId:$identityId,jwt:$jwt,organizationSlug:$organizationSlug}')"
          login_response="$(curl -fsS -X POST -H 'Content-Type: application/json' --data "$login_payload" "${INFISICAL_API_URL}/api/v1/auth/oidc-auth/login")"
          infisical_token="$(printf '%s' "$login_response" | jq -r '.accessToken // empty')"
          test -n "$infisical_token"
          echo "::add-mask::$infisical_token"
          projects="$(curl -fsS -H "Authorization: Bearer $infisical_token" "${INFISICAL_API_URL}/api/v1/projects" | jq -c --arg org "${INFISICAL_ORG_ID}" '[.projects[]? | select(.orgId == $org)]')"
          if [ -n "${INFISICAL_PROJECT_SLUG}" ]; then
            matches="$(printf '%s' "$projects" | jq -c --arg slug "${INFISICAL_PROJECT_SLUG}" '[.[] | select(.slug == $slug)]')"
          elif [ "$(printf '%s' "$projects" | jq 'length')" -eq 1 ]; then
            matches="$projects"
          else
            matches="$(printf '%s' "$projects" | jq -c '[.[] | select((.name | ascii_downcase | gsub("[ _-]"; "")) == "ogenicsio")]')"
          fi
          test "$(printf '%s' "$matches" | jq 'length')" -eq 1
          project_slug="$(printf '%s' "$matches" | jq -r '.[0].slug')"
          echo "Infisical OIDC PASS; staging project resolved: $project_slug"
          echo "project_slug=$project_slug" >> "$GITHUB_OUTPUT"

      - name: Load staging credentials through Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ steps.infisical_project.outputs.project_slug }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          secret-path: /
          recursive: true

      - name: Select GH2 Classic PAT with runner administration
        id: gh2
        shell: bash
        run: |
          set -euo pipefail
          selected=''
          selected_source=''
          for name in GH2_RUNNER_ADMIN_TOKEN GH-ID-TOMLOAD-RUNNER-2 GIT_HUB_RUNNER_2 GITHUB_TOKEN_OGE34 GITHUB_TOKEN_CLASSIC GH2_CLASSIC_PAT GH2_GITHUB_TOKEN; do
            value="$(printenv "$name" 2>/dev/null || true)"
            [ -n "$value" ] || continue
            login="$(curl -fsS -H "Authorization: Bearer $value" -H 'Accept: application/vnd.github+json' https://api.github.com/user | jq -r '.login // empty' || true)"
            [ "$login" = "Wave-Runner-2" ] || continue
            response="$(curl -sS -w '\\nHTTP_STATUS:%{http_code}' -X POST -H "Authorization: Bearer $value" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/Wave-Runner-2/Build-Platform/actions/runners/registration-token || true)"
            status="$(printf '%s\\n' "$response" | tail -n 1 | sed 's/^HTTP_STATUS://')"
            body="$(printf '%s\\n' "$response" | sed '$d')"
            registration_token="$(printf '%s' "$body" | jq -r '.token // empty' 2>/dev/null || true)"
            if [ "$status" = "201" ] && [ -n "$registration_token" ]; then
              echo "::add-mask::$value"
              echo "::add-mask::$registration_token"
              printf 'GH2_ADMIN_TOKEN=%s\\n' "$value" >> "$GITHUB_ENV"
              printf 'GH2_REGISTRATION_TOKEN=%s\\n' "$registration_token" >> "$GITHUB_ENV"
              echo "GH2 Classic PAT PASS: identity=Wave-Runner-2; source=$name; runner-registration=201"
              selected=1
              selected_source="$name"
              break
            fi
            message="$(printf '%s' "$body" | jq -r '.message // "no message"' 2>/dev/null || true)"
            echo "GH2 candidate $name is the correct identity but runner registration returned HTTP $status ($message)"
          done
          test -n "$selected" || {
            echo "::error::No Infisical-injected Wave-Runner-2 credential has runner administration permission for Wave-Runner-2/Build-Platform"
            exit 43
          }
          echo "selected GH2 administration source=$selected_source"

      - name: Find approved Infisical SSH key that actually reaches OCIAN
        id: ssh
        shell: bash
        env:
          OCIAN_HOST: ${{ vars.OCIAN_HOST || '165.232.174.32' }}
        run: |
          set -euo pipefail
          host="${OCIAN_HOST}"
          key_file=''
          ssh_user=''
          for key_name in SSH_KEY SSH_PRIVATE_KEY; do
            key_material="$(printenv "$key_name" 2>/dev/null || true)"
            [ -n "$key_material" ] || continue
            for encoding in raw escaped base64 path; do
              candidate="$RUNNER_TEMP/ocian-${key_name}-${encoding}"
              case "$encoding" in
                raw) printf '%s' "$key_material" | tr -d '\\r' > "$candidate" ;;
                escaped) printf '%s' "$key_material" | sed 's/\\\\n/\\n/g' | tr -d '\\r' > "$candidate" ;;
                base64) printf '%s' "$key_material" | base64 --decode 2>/dev/null | tr -d '\\r' > "$candidate" || true ;;
                path) [ -f "$key_material" ] && cp "$key_material" "$candidate" || : ;;
              esac
              chmod 600 "$candidate"
              ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || continue
              for candidate_user in wave; do
                if ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -i "$candidate" "$candidate_user@$host" 'test "$(id -un)" = wave && hostname' >/dev/null 2>&1; then
                  key_file="$candidate"
                  ssh_user="$candidate_user"
                  echo "SSH reachability PASS: OCIAN-S-Host; key=$key_name/$encoding; user=wave"
                  break 3
                fi
              done
            done
          done
          test -n "$key_file" || {
            echo "::error::No Infisical private key successfully authenticates as Linux user wave on OCIAN-S-Host"
            echo "The public fingerprint match alone is insufficient; the private key pair must be corrected in Infisical."
            exit 63
          }
          printf 'OCIAN_SSH_KEY_FILE=%s\\n' "$key_file" >> "$GITHUB_ENV"
          printf 'OCIAN_SSH_USER=%s\\n' "$ssh_user" >> "$GITHUB_ENV"
          printf 'OCIAN_SSH_HOST=%s\\n' "$host" >> "$GITHUB_ENV"

      - name: Rebind wave-runner-01 on OCIAN through SSH
        shell: bash
        run: |
          set -euo pipefail
          runner_dir='/opt/wave/actions-runner'
          test -f "$OCIAN_SSH_KEY_FILE"
          test -n "${GH2_REGISTRATION_TOKEN:-}"
          {
            printf '%s\\n' "$GH2_REGISTRATION_TOKEN"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          runner_dir='/opt/wave/actions-runner'
          registration_token=''
          IFS= read -r registration_token
          test -n "$registration_token"
          test "$(id -un)" = wave
          test -d "$runner_dir"
          cd "$runner_dir"
          if [ -x ./svc.sh ]; then ./svc.sh stop || true; fi
          pkill -TERM -u "$(id -u)" -f '/opt/wave/actions-runner/bin/Runner.Listener' || true
          sleep 2
          ./config.sh remove --unattended || true
          rm -f .runner .credentials .credentials_rsaparams
          ./config.sh --unattended --url https://github.com/Wave-Runner-2/Build-Platform --token "$registration_token" --name wave-runner-01 --labels self-hosted,linux,x64,wave --work _work
          if [ -x ./svc.sh ]; then
            ./svc.sh install wave || true
            ./svc.sh start
          fi
          test -f .runner
          grep -q 'Wave-Runner-2/Build-Platform' .runner
          echo 'REMOTE PASS: wave-runner-01 registered to Wave-Runner-2/Build-Platform'
          REMOTE_SCRIPT
          } | ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -i "$OCIAN_SSH_KEY_FILE" "$OCIAN_SSH_USER@$OCIAN_SSH_HOST" 'bash -s'
          echo 'GH2 direct rebind completed on existing OCIAN-S-Host; no new runner created.'

  verify-rebound-runner:
    name: Verify existing wave-runner-01 on GH2
    needs: rebind-existing-host
    runs-on: [self-hosted, linux, x64, wave]
    environment: GH2-OCIAN-STAGING
    timeout-minutes: 15
    steps:
      - name: Verify host and GH2 registration
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "wave-runner-01"
          test "$(id -un)" = "wave"
          test -f /opt/wave/actions-runner/.runner
          grep -q 'Wave-Runner-2/Build-Platform' /opt/wave/actions-runner/.runner
          test -d /home/wave/.codex
          echo 'E2E PASS: OCIAN-S-Host / wave-runner-01 is registered to GH2 and Codex profile exists at /home/wave/.codex'
