name: GH2 OCIAN host bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gh2-ocian-host-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  INFISICAL_API_URL: https://app.infisical.com
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_ENV_SLUG: staging
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}

jobs:
  verify-gh2-admin-credential:
    name: Verify GH2 admin credential
    runs-on: ubuntu-latest
    environment: GH2-OCIAN-STAGING
    steps:
      - name: Resolve Infisical project through GH2 OIDC
        id: infisical_project
        shell: bash
        run: |
          set -euo pipefail
          oidc_response="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          oidc_jwt="$(printf '%s' "$oidc_response" | jq -r '.value // empty')"
          test -n "$oidc_jwt"
          login_payload="$(jq -n --arg identityId "${INFISICAL_IDENTITY_ID}" --arg jwt "$oidc_jwt" --arg organizationSlug "${INFISICAL_ORG_SLUG}" '{identityId:$identityId,jwt:$jwt,organizationSlug:$organizationSlug}')"
          login_response="$(curl -fsS -X POST -H 'Content-Type: application/json' --data "$login_payload" "${INFISICAL_API_URL}/api/v1/auth/oidc-auth/login")"
          infisical_token="$(printf '%s' "$login_response" | jq -r '.accessToken // empty')"
          test -n "$infisical_token"
          projects="$(curl -fsS -H "Authorization: Bearer $infisical_token" "${INFISICAL_API_URL}/api/v1/projects" | jq -c --arg org "${INFISICAL_ORG_ID}" '[.projects[]? | select(.orgId == $org)]')"
          if [ -n "${INFISICAL_PROJECT_SLUG}" ]; then
            matches="$(printf '%s' "$projects" | jq -c --arg slug "${INFISICAL_PROJECT_SLUG}" '[.[] | select(.slug == $slug)]')"
          elif [ "$(printf '%s' "$projects" | jq 'length')" -eq 1 ]; then
            matches="$projects"
          else
            matches="$(printf '%s' "$projects" | jq -c '[.[] | select((.name | ascii_downcase | gsub("[ _-]"; "")) == "ogenicsio")]')"
          fi
          test "$(printf '%s' "$matches" | jq 'length')" -eq 1
          project_slug="$(printf '%s' "$matches" | jq -r '.[0].slug')"
          echo "project_slug=$project_slug" >> "$GITHUB_OUTPUT"

      - name: Load GH2 credential from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ steps.infisical_project.outputs.project_slug }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          secret-path: /
          recursive: true

      - name: Validate GH2 credential and runner administration scope
        shell: bash
        run: |
          set -euo pipefail
          token=''
          token_source=''
          for name in GH2_RUNNER_ADMIN_TOKEN GH-ID-TOMLOAD-RUNNER-2 GIT_HUB_RUNNER_2 GITHUB_TOKEN_OGE34 GITHUB_TOKEN_CLASSIC GH2_CLASSIC_PAT GH2_GITHUB_TOKEN; do
            value="$(printenv "$name" 2>/dev/null || true)"
            [ -n "$value" ] || continue
            login="$(curl -fsS -H "Authorization: Bearer $value" -H 'Accept: application/vnd.github+json' https://api.github.com/user | jq -r '.login // empty' || true)"
            if [ "$login" = "Wave-Runner-2" ]; then
              token="$value"
              token_source="$name"
              break
            fi
          done
          test -n "$token" || { echo "::error::No Infisical-injected GH2 Classic/PAT credential authenticated as Wave-Runner-2"; exit 41; }
          response="$(curl -sS -w '\nHTTP_STATUS:%{http_code}' -X POST -H "Authorization: Bearer $token" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/Wave-Runner-2/Build-Platform/actions/runners/registration-token)"
          status="$(printf '%s\n' "$response" | tail -n 1 | sed 's/^HTTP_STATUS://')"
          body="$(printf '%s\n' "$response" | sed '$d')"
          if [ "$status" != "201" ]; then
            message="$(printf '%s' "$body" | jq -r '.message // "no message"')"
            echo "::error::GH2 runner administration check returned HTTP $status ($message)"
            exit 43
          fi
          echo "::add-mask::$(printf '%s' "$body" | jq -r '.token')"
          echo "GH2 admin credential PASS: identity=Wave-Runner-2, source=$token_source, repository=Wave-Runner-2/Build-Platform, runner-registration=201"

      - name: Rebind OCIAN directly over SSH
        shell: bash
        run: |
          set -euo pipefail
          gh2_token="$(printenv GH-ID-TOMLOAD-RUNNER-2 2>/dev/null || true)"
          ssh_private_key="$(printenv SSH_PRIVATE_KEY 2>/dev/null || true)"
          test -n "$gh2_token" || { echo "::error::GH-ID-TOMLOAD-RUNNER-2 is missing"; exit 61; }
          test -n "$ssh_private_key" || { echo "::error::SSH_PRIVATE_KEY is missing"; exit 62; }
          login="$(curl -fsS -H "Authorization: Bearer $gh2_token" -H 'Accept: application/vnd.github+json' https://api.github.com/user | jq -r '.login // empty')"
          test "$login" = "Wave-Runner-2"
          response="$(curl -fsS -X POST -H "Authorization: Bearer $gh2_token" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/Wave-Runner-2/Build-Platform/actions/runners/registration-token)"
          registration_token="$(printf '%s' "$response" | jq -r '.token // empty')"
          test -n "$registration_token"
          echo "::add-mask::$registration_token"
          key_file=''
          ssh_user=''
          for key_name in SSH_KEY SSH_PRIVATE_KEY; do
            key_material="$(printenv "$key_name" 2>/dev/null || true)"
            [ -n "$key_material" ] || continue
            for encoding in raw escaped base64; do
              candidate="$RUNNER_TEMP/ocian-${key_name}-${encoding}"
              case "$encoding" in
                raw) printf '%s' "$key_material" | tr -d '\\r' > "$candidate" ;;
                escaped) printf '%s' "$key_material" | sed 's/\\\\n/\n/g' | tr -d '\\r' > "$candidate" ;;
                base64) printf '%s' "$key_material" | base64 --decode 2>/dev/null | tr -d '\\r' > "$candidate" || true ;;
              esac
              chmod 600 "$candidate"
              ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || continue
              for candidate_user in wave root ubuntu; do
                if ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -i "$candidate" "$candidate_user@165.232.174.32" true >/dev/null 2>&1; then
                  key_file="$candidate"
                  ssh_user="$candidate_user"
                  echo "SSH key accepted for OCIAN: $key_name ($encoding), user=$ssh_user"
                  break 3
                fi
              done
            done
          done
          test -n "$key_file" || { echo "::error::No approved Infisical SSH key authenticates to OCIAN-S-Host"; exit 63; }
          {
            printf '%s\n' "$registration_token"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          read -r registration_token
          if [ "$(id -u)" -eq 0 ]; then
            exec runuser -u wave -- bash -s
          fi
          runner_dir=/opt/wave/actions-runner
          test -d "$runner_dir"
          cd "$runner_dir"
          ./config.sh remove --unattended || true
          rm -f .runner .credentials .credentials_rsaparams
          ./config.sh --unattended --url https://github.com/Wave-Runner-2/Build-Platform --token "$registration_token" --name wave-runner-01 --labels self-hosted,linux,x64,wave --work _work
          echo "remote GH2 rebind complete"
          REMOTE_SCRIPT
          } | ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -i "$key_file" "$ssh_user@165.232.174.32" 'bash -s'
          echo "GH2 direct rebind completed on OCIAN-S-Host; no new runner was created."

  verify-rebound-runner:
    name: Verify existing wave-runner-01 on GH2
    needs: verify-gh2-admin-credential
    runs-on: [self-hosted, linux, x64, wave]
    environment: GH2-OCIAN-STAGING
    steps:
      - name: Verify host and GH2 registration
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "wave-runner-01" || { echo "::error::unexpected runner hostname"; hostname; exit 71; }
          test -f /opt/wave/actions-runner/.runner
          grep -q 'Wave-Runner-2/Build-Platform' /opt/wave/actions-runner/.runner
          test -d /home/wave/.codex
          echo "PASS: OCIAN-S-Host / wave-runner-01 is registered to Wave-Runner-2/Build-Platform and Codex profile exists at /home/wave/.codex"
