name: GH2 Linear Real Provider to WAVE D1 1LSS E2E
on:
  push:
    branches: [feat/ccs-multi-protocol-docker-20261023]
    paths:
      - 'scripts/gh2-linear-live-wave-d1-e2e.mjs'
      - '.github/workflows/gh2-linear-live-wave-d1-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  linear-to-d1:
    if: github.repository == 'Wave-Runner-2/Build-Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
      INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || 'ogenic-sio-ti-rv' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: staging
          secret-path: /
          recursive: false
      - name: Live Linear GraphQL source read and signed WAVE D1 write/readback
        run: node scripts/gh2-linear-live-wave-d1-e2e.mjs
      - name: Exact gate
        if: always()
        run: echo 'MANUS_BRIDGE_NOT_PROVEN; NO_FULL_7_E2E; NO_PROVIDER_PAID_INFERENCE'
