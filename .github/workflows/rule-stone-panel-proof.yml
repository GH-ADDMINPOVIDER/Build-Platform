name: Rule Stone Panel - Seven Stone Governance Proof
on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - "config/oge95-rules-center.json"
      - "worker/rule-stone-api.ts"
      - "worker/entry-yellow-stone.ts"
      - "worker/violet-distribution-planner.ts"
      - "src/StoneRulePanel.tsx"
      - "src/stone-rule-panel.css"
      - "src/WaveNext.tsx"
      - "src/VioletDistributionPanel.tsx"
      - "tests/violet-claim-contract.test.mjs"
      - "src/main.tsx"
      - "tests/rule-stone-panel.test.mjs"
      - "scripts/verify-rule-stone-governance.mjs"
      - ".github/workflows/rule-stone-panel-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build ephemeral lockfile and install
        run: npm install --package-lock-only --ignore-scripts && npm ci
      - name: Stone rule invariants and Violet distribution
        run: node --test tests/rule-stone-panel.test.mjs tests/violet-blue-distribution.test.mjs tests/violet-claim-contract.test.mjs
      - name: Audit all seven stones against Rule Stone policy
        run: node scripts/verify-rule-stone-governance.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Upload exact SHA rule audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-stone-governance-${{ github.run_id }}
          path: rule-stone-governance-evidence.json
          retention-days: 14
          if-no-files-found: warn
      - name: Report scope
        run: |
          echo "RULE_STONE_PANEL_CI_SUCCESS"
          echo "READ_ONLY_PANEL_NO_NEW_GATE"
          echo "NO_REMOTE_D1_OR_PRODUCTION_MUTATION"
