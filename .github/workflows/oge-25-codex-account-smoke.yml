name: OGE-25 existing Codex account smoke on Unifiend
on:
  push:
    branches: [Unified-on-Progress]
    paths: ['.github/workflows/oge-25-codex-account-smoke.yml']
permissions:
  contents: read
  id-token: write
jobs:
  smoke:
    if: github.repository == 'Wave-Runner-2/Build-Platform' && github.actor == 'Wave-Runner-2'
    runs-on: [self-hosted, Linux, X64, wave]
    timeout-minutes: 10
    steps:
      - name: Bind existing staging OpenAI key from Infisical
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG || 'ogenic-sio-ti-rv' }}
          env-slug: staging
          domain: https://app.infisical.com
          secret-path: /
          secret-name: OPENAI_API_KEY
          include-imports: false
          recursive: false
      - name: Confirm existing key belongs to requested OpenAI account
        shell: bash
        env:
          EXPECTED_OPENAI_EMAIL_SHA256: ${{ vars.CODEX_EXPECTED_OPENAI_EMAIL_SHA256 }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const { createHash } = await import('node:crypto');
          const expected = process.env.EXPECTED_OPENAI_EMAIL_SHA256?.trim().toLowerCase();
          const key = process.env.OPENAI_API_KEY;
          if (!/^[a-f0-9]{64}$/.test(expected || '') || !key) {
            console.error('OPENAI_ACCOUNT_VERIFICATION_NOT_CONFIGURED');
            process.exit(89);
          }
          try {
            const response = await fetch('https://api.openai.com/v1/me', {
              headers: { authorization: `Bearer ${key}` },
              signal: AbortSignal.timeout(10000),
            });
            if (!response.ok) throw new Error('ACCOUNT_API_UNAVAILABLE');
            const user = await response.json();
            const actual = typeof user.email === 'string'
              ? createHash('sha256').update(user.email.trim().toLowerCase()).digest('hex') : '';
            if (actual !== expected) {
              console.error('OPENAI_ACCOUNT_MISMATCH');
              process.exit(89);
            }
            console.log('OPENAI_ACCOUNT_MATCH');
          } catch {
            console.error('OPENAI_ACCOUNT_VERIFICATION_UNAVAILABLE');
            process.exit(89);
          }
          NODE
      - name: Probe sandbox and one read-only Codex call
        shell: bash
        run: |
          set -euo pipefail
          codex --version
          codex sandbox /bin/pwd > "$RUNNER_TEMP/oge-25-sandbox.log" 2>&1
          echo CODEX_BWRAP_APPARMOR_SANDBOX_OK
          printf '%s\n' 'Reply with exactly: OGE25_CODEX_SMOKE_OK. Do not read or change files.' |
            timeout 120s codex exec --sandbox read-only - > "$RUNNER_TEMP/oge-25-codex-smoke.log" 2>&1
          if ! grep -q 'OGE25_CODEX_SMOKE_OK' "$RUNNER_TEMP/oge-25-codex-smoke.log"; then
            echo CODEX_RESPONSE_MARKER_MISSING
            exit 90
          fi
          echo OGE25_CODEX_READ_ONLY_INFERENCE_OK
