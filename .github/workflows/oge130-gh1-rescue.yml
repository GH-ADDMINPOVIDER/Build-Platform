name: OGE130 GH1 Owner Rescue Probe

on:
  workflow_dispatch:
  push:
    branches:
      - owner/oge-130-gh1-rescue-20261025
    paths:
      - .github/workflows/oge130-gh1-rescue.yml

permissions:
  contents: write

concurrency:
  group: oge130-gh1-owner-rescue
  cancel-in-progress: false

jobs:
  selfhost-codex-readonly:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 18
    steps:
      - name: Checkout isolated rescue branch
        uses: actions/checkout@v4
        with:
          ref: owner/oge-130-gh1-rescue-20261025
          fetch-depth: 1

      - name: Verify existing runner and execute Codex read-only probe
        shell: bash
        env:
          PROBE_PROMPT: >-
            OGE-130 and Termius recovery read-only probe. Inspect only the current
            staging checkout and safe local runtime metadata. Report whether the
            existing runner context, Codex CLI, CODEX_HOME, Docker CLI, and repository
            checkout are available. Do not modify files, Git, services, runner
            registration, credentials, D1, main, production, or historical CERT
            evidence. Never print secrets. Return the single next repair gate.
        run: |
          set -euo pipefail
          umask 077
          test "${RUNNER_NAME:-}" = "wave-runner-01"
          command -v codex >/dev/null
          test -d /home/wave/.codex
          mkdir -p docs/checkpoints
          codex_version="$(codex --version | head -n 1)"
          docker_version="$(docker --version 2>/dev/null | head -n 1 || echo UNAVAILABLE)"
          git_sha="$(git rev-parse HEAD)"
          output_file="$(mktemp)"
          set +e
          env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            USER="${USER:-wave}" \
            LOGNAME="${LOGNAME:-wave}" \
            SHELL="${SHELL:-/bin/bash}" \
            LANG="${LANG:-C.UTF-8}" \
            CODEX_HOME=/home/wave/.codex \
            OGENIC_EXECUTION_SCOPE=staging-only \
            codex exec --sandbox read-only --skip-git-repo-check "$PROBE_PROMPT" \
              >"$output_file" 2>&1
          codex_exit=$?
          set -e
          result_sha256="$(sha256sum "$output_file" | cut -d' ' -f1)"
          rm -f "$output_file"
          export CODEX_VERSION="$codex_version"
          export DOCKER_VERSION="$docker_version"
          export GIT_SHA="$git_sha"
          export CODEX_EXIT="$codex_exit"
          export RESULT_SHA256="$result_sha256"
          node <<'NODE'
          import { writeFileSync } from "node:fs";
          const receipt = {
            schema: "ogenic.owner-rescue-receipt.v1",
            issue: "OGE-130",
            environment: "staging",
            source: "Linear",
            execution_repository: process.env.GITHUB_REPOSITORY,
            execution_run: process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID,
            runner_name: process.env.RUNNER_NAME,
            runner_os: process.env.RUNNER_OS,
            executor: "Codex",
            codex_home: "/home/wave/.codex",
            codex_version: process.env.CODEX_VERSION,
            docker_version: process.env.DOCKER_VERSION,
            git_sha: process.env.GIT_SHA,
            codex_exit_code: Number(process.env.CODEX_EXIT),
            result_sha256: process.env.RESULT_SHA256,
            final_status: process.env.CODEX_EXIT === "0" ? "DONE" : "FAILED",
            mode: "read-only",
            model_override: null,
            secrets_loaded: false,
            historical_evidence_mutated: false,
            completed_at: new Date().toISOString()
          };
          writeFileSync("docs/checkpoints/OGE130_GH1_RESCUE_RECEIPT.json", JSON.stringify(receipt, null, 2) + "\n", {mode:0o600});
          NODE

      - name: Commit append-only rescue receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/checkpoints/OGE130_GH1_RESCUE_RECEIPT.json
          git config user.name "Wave-Runner-2"
          git config user.email "tomload21@gmail.com"
          git add docs/checkpoints/OGE130_GH1_RESCUE_RECEIPT.json
          git commit -m "chore(staging): record OGE-130 GH1 self-host Codex receipt"
          git push origin HEAD:owner/oge-130-gh1-rescue-20261025

      - name: Require Codex completion
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const r=require("./docs/checkpoints/OGE130_GH1_RESCUE_RECEIPT.json"); if(r.final_status!=="DONE") process.exit(1)'
