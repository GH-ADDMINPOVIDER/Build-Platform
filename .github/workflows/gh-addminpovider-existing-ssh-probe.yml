name: GH-ADDMINPOVIDER Existing SSH Transport Probe

on:
  push:
    branches: [Unified-on-Progress]
    paths: [.github/workflows/gh-addminpovider-existing-ssh-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-ssh-transport:
    if: github.repository_id == '1429580446' && github.repository_owner_id == '342175560'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe already configured GitHub Actions SSH credential (no secret output or host changes)
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_OWNER_KEY: ${{ secrets.SSH_OWNER_KEY }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          key="$RUNNER_TEMP/gh-addminpovider-existing-ssh-key"
          known="$RUNNER_TEMP/gh-addminpovider-known-hosts"
          trap 'rm -f "$key" "$known"' EXIT
          if test -n "${SSH_PRIVATE_KEY:-}"; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
            echo "SSH_ACTIONS_CREDENTIAL_REFERENCE=SSH_PRIVATE_KEY"
          elif test -n "${SSH_OWNER_KEY:-}"; then
            printf '%s\n' "$SSH_OWNER_KEY" > "$key"
            echo "SSH_ACTIONS_CREDENTIAL_REFERENCE=SSH_OWNER_KEY"
          else
            echo "SSH_ACTIONS_CREDENTIAL_REFERENCE=NOT_BOUND"
            echo "GITHUB_ACTIONS_TO_HOST=NOT_VERIFIED_NO_GITHUB_ACTIONS_KEY"
            echo "NOTE=GitHub account SSH key and Infisical secret are not automatically Actions secrets"
            exit 0
          fi
          chmod 600 "$key"
          if ! ssh-keygen -y -P '' -f "$key" >/dev/null 2>&1; then
            echo "SSH_ACTIONS_CLIENT_KEY=ENCRYPTED_OR_INVALID"
            echo "GITHUB_ACTIONS_TO_HOST=NOT_VERIFIED"
            exit 0
          fi
          node -e 'const fs=require("fs");const o=JSON.parse(fs.readFileSync("config/unifiend-host-trust.json","utf8"));if(o.droplet_id!==604432491||o.address!=="165.232.174.32"||!o.known_hosts.startsWith("165.232.174.32 ssh-ed25519 "))process.exit(78);fs.writeFileSync(process.argv[1],o.known_hosts+"\n",{mode:0o600});' "$known"
          echo "SSH_ACTIONS_CLIENT_KEY=UNENCRYPTED"
          if timeout 25 ssh -F /dev/null -T -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
              -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=10 \
              -o ConnectionAttempts=1 -i "$key" -p 22 wave@165.232.174.32 \
              "printf 'SSH_HOST_EXEC=YES\\n'; printf 'REMOTE_USER='; id -un; printf 'REMOTE_HOST='; hostname; if test -x /opt/wave/actions-runner/config.sh; then echo EXISTING_RUNNER_INSTALL=YES; else echo EXISTING_RUNNER_INSTALL=NO; fi; if sudo -n true >/dev/null 2>&1; then echo NONINTERACTIVE_SUDO=YES; else echo NONINTERACTIVE_SUDO=NO; fi"; then
            echo "GITHUB_ACTIONS_TO_HOST=SSH_READONLY_PASS"
          else
            echo "GITHUB_ACTIONS_TO_HOST=SSH_AUTH_OR_TRANSPORT_FAILED"
          fi
