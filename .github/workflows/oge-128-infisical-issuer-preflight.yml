name: OGE-128 Infisical issuer inventory (staging / no secrets output)
on:
  push:
    branches: [task/oge-128-runtime-certificate-20261018]
    paths: [".github/workflows/oge-128-infisical-issuer-preflight.yml"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  issuer-preflight:
    if: github.repository == 'Ogenicchocolate21debug/Build-Platform' && contains(fromJSON('["Ogenicchocolate21debug","Wave-Runner-2"]'), github.actor)
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 8
    steps:
      - name: Staging-only runner identity guard
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "wave-runner-01"
          test "$GITHUB_REF_NAME" = "task/oge-128-runtime-certificate-20261018"
          echo "CERT_ISSUER_PREFLIGHT_SCOPE=STAGING_READ_ONLY"
      - name: Discover trusted certificate issuer using existing OIDC
        shell: bash
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
          INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const base = 'https://app.infisical.com';
          const result = {};
          const output = (name, value) => { result[name] = String(value); console.log('CERT_ISSUER_' + name + '=' + value); };
          const safeRead = async (url, bearer, method = 'GET', body) => {
            try {
              const response = await fetch(url, {
                method,
                headers: { Authorization: 'Bearer ' + bearer, 'Content-Type':'application/json' },
                ...(body ? {body: JSON.stringify(body)} : {}),
                signal: AbortSignal.timeout(15000)
              });
              let data = {};
              if (response.ok) { try { data=await response.json() } catch {} }
              return {status:response.status, data};
            } catch { return {status:'NETWORK_FAILURE',data:{}}; }
          };
          (async () => {
            if (!process.env.ACTIONS_ID_TOKEN_REQUEST_URL || !process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN) {
              output('OIDC','UNAVAILABLE'); return;
            }
            const jwt = await fetch(process.env.ACTIONS_ID_TOKEN_REQUEST_URL,{
              headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},
              signal:AbortSignal.timeout(15000)
            }).then(x=>x.json());
            const login = await fetch(base+'/api/v1/auth/oidc-auth/login',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({identityId:process.env.INFISICAL_IDENTITY_ID,jwt:jwt.value,organizationSlug:process.env.INFISICAL_ORG_SLUG}),
              signal:AbortSignal.timeout(15000)
            });
            if(!login.ok){output('OIDC','HTTP_'+login.status);return;}
            const {accessToken} = await login.json();
            if(!accessToken){output('OIDC','NO_TOKEN');return;}
            output('OIDC','PASS');
            const projects = await safeRead(base+'/api/v1/projects',accessToken);
            if(projects.status !== 200){output('PROJECT_DISCOVERY','HTTP_'+projects.status);return;}
            const list=Array.isArray(projects.data.projects)?projects.data.projects:[];
            const found=list.find(p=>p.slug==='cert-manager-89-qe');
            if(!found?.id){output('CERT_PROJECT','NOT_VISIBLE');return;}
            output('CERT_PROJECT','FOUND');
            const p=encodeURIComponent(found.id);
            const targets=[
              ['CA',base+'/api/v1/projects/'+p+'/cas'],
              ['PROFILES',base+'/api/v1/cert-manager/certificate-profiles?projectId='+p],
              ['APPLICATIONS',base+'/api/v1/cert-manager/pki-applications?projectId='+p],
              ['INVENTORY',base+'/api/v1/projects/'+p+'/certificates/search']
            ];
            for(const [label,url] of targets) {
              const result = await safeRead(url,accessToken,label==='INVENTORY'?'POST':'GET',label==='INVENTORY'?{offset:0,limit:1}:undefined);
              output(label+'_HTTP',String(result.status));
              if(result.status===200){
                const d=result.data;
                const foundArrays=Object.entries(d).filter(([,v])=>Array.isArray(v));
                const preferred=foundArrays.find(([key])=>key.toLowerCase().includes(label==='CA'?'ca':label==='PROFILES'?'profile':label==='APPLICATIONS'?'application':'certificate'));
                if(preferred)output(label+'_COUNT',String(preferred[1].length));
                else output(label+'_BODY','ACCESSIBLE_UNCOUNTED');
              }
            }
          })().catch(()=>output('PREFLIGHT','NETWORK_OR_AUTH_BLOCKED')).finally(async () => {
            const body = ['OGE-128 Infisical issuer preflight (read-only)',
              'Source: '+process.env.GITHUB_SHA+' / Run: '+process.env.GITHUB_RUN_ID,
              ...Object.entries(result).map(([name,value])=>'CERT_ISSUER_'+name+'='+String(value).slice(0,100))
            ].join('\n');
            const response=await fetch('https://api.github.com/repos/Ogenicchocolate21debug/Build-Platform/issues/39/comments',{
              method:'POST',headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,'Accept':'application/vnd.github+json','User-Agent':'oge128-issuer-preflight'},
              body:JSON.stringify({body}),signal:AbortSignal.timeout(15000)
            }).catch(()=>({status:'NETWORK_FAILURE'}));
            output('GITHUB_RECEIPT_HTTP',response.status);
          });
          NODE
