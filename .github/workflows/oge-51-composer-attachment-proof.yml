name: OGE-51 Composer Attachment Reliability Proof

on:
  workflow_dispatch:
  pull_request:
    branches:
      - phase-vi-provider-incentive-metering
    paths:
      - "src/ComposerAttachments.tsx"
      - "src/McpConfigCenter.tsx"
      - "src/UnifiedChat.tsx"
      - "src/composer-draft.ts"
      - "worker/chat-attachment-storage.ts"
      - "worker/chat-model-api.ts"
      - "worker/entry.ts"
      - "worker/openai-runtime.ts"
      - "tests/composer-draft.test.mjs"
      - "tests/composer-attachment-reliability.test.mjs"
      - "tests/chat-attachment-storage.test.mjs"
      - ".github/workflows/oge-51-composer-attachment-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'tawatchaisamornrum11/oge-113-wave-file-handoff-loop-mcp-status-gate-r2-multipart-agent-retrieval'
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --package-lock-only && npm ci

      - name: Existing draft persistence regression
        run: node --test tests/composer-draft.test.mjs

      - name: Attachment reliability contract
        run: node --test tests/composer-attachment-reliability.test.mjs

      - name: Large-file storage, multipart, and handoff safety contract
        run: node --test tests/chat-attachment-storage.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
