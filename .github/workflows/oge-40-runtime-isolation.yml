name: OGE-40 Runtime Isolation

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - ".github/workflows/oge-40-runtime-isolation.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  STAGING_URL: https://wave.ogenicchocolate.com
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}
  INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG || 'staging' }}

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Discover Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load staging runtime authorization via Infisical OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true

      - name: Require owner runtime authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OGENIC_OPS_KEY:-}" || { echo "::error::missing OGENIC_OPS_KEY"; exit 1; }

      - name: Probe resolver, execution, and ATHENA boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .oge40

          probe_post() {
            local name="$1"
            local route="$2"
            local data="$3"
            local body=".oge40/${name}.body"
            local headers=".oge40/${name}.headers"
            local code
            code="$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}'               -H "x-ogenic-ops-key: ${OGENIC_OPS_KEY}"               -H 'content-type: application/json'               --data-binary "$data"               "${STAGING_URL}${route}" || true)"
            test -n "$code" || code="000"
            printf '%s' "$code" > ".oge40/${name}.status"
          }

          curl --silent --show-error --output .oge40/health.body --write-out '%{http_code}'             "${STAGING_URL}/api/health" > .oge40/health.status || true

          probe_post resolve "/api/capabilities/resolve"             '{"intent":"OGE-40 runtime isolation read","capability":"read_file","provider":"github","environment":"staging"}'

          probe_post execute "/api/capabilities/execute"             '{"intent":"OGE-40 runtime isolation read","capability":"read_file","provider":"github","environment":"staging","input":{"path":"tests/athena-guarded-command-handoff.test.mjs"}}'

          probe_post wave "/api/wave/command"             '{"intent":"OGE-40 runtime isolation read","capability":"read_file","provider":"github","environment":"staging","input":{"path":"tests/athena-guarded-command-handoff.test.mjs"}}'

          probe_post planner "/api/wave/command"             '{"intent":"deploy this"}'

          probe_post invalid_path "/api/capabilities/execute"             '{"intent":"OGE-40 invalid path control","capability":"read_file","provider":"github","environment":"staging","input":{"path":"../secret"}}'

          python - <<'PY'
          import json, os, re
          from pathlib import Path

          root = Path(".oge40")

          def read_status(name):
              try:
                  return int((root / f"{name}.status").read_text().strip() or "0")
              except Exception:
                  return 0

          def read_body_text(name):
              p = root / f"{name}.body"
              return p.read_text(errors="replace") if p.exists() else ""

          def read_json(name):
              try:
                  return json.loads(read_body_text(name))
              except Exception:
                  return {}

          def content_type(name):
              p = root / f"{name}.headers"
              if not p.exists():
                  return None
              for line in p.read_text(errors="replace").splitlines():
                  if line.lower().startswith("content-type:"):
                      return line.split(":", 1)[1].strip()
              return None

          secret_patterns = [
              re.compile(r"sk-[A-Za-z0-9_-]{8,}"),
              re.compile(r"gh[pousr]_[A-Za-z0-9_]{8,}", re.I),
              re.compile(r"Bearer\s+[A-Za-z0-9._~+/=-]{8,}", re.I),
              re.compile(r"(?i)(api[_ -]?key|token|secret|password)\s*[:=]\s*[^\s,;]+"),
          ]

          def redact(text):
              text = text or ""
              for pattern in secret_patterns:
                  text = pattern.sub("[REDACTED]", text)
              return text[:1000]

          def safe_summary(name):
              obj = read_json(name)
              if not isinstance(obj, dict):
                  return {
                      "content_type": content_type(name),
                      "body_excerpt": redact(read_body_text(name)),
                  }
              out = {"content_type": content_type(name)}
              for key in ("ok", "code", "status", "runtime", "policy", "message"):
                  if key in obj:
                      value = obj[key]
                      out[key] = redact(str(value)) if isinstance(value, str) else value
              resolver = obj.get("resolver")
              if isinstance(resolver, dict):
                  descriptor = resolver.get("descriptor")
                  if isinstance(descriptor, dict):
                      out["descriptor"] = {
                          k: descriptor.get(k)
                          for k in ("capability_id", "provider_id", "permission_class", "environment")
                          if k in descriptor
                      }
              verification = obj.get("verification")
              if isinstance(verification, dict):
                  out["verification"] = {
                      k: verification.get(k)
                      for k in ("status", "reason", "provider_id", "capability_id")
                      if k in verification
                  }
              return out

          statuses = {name: read_status(name) for name in ("health","resolve","execute","wave","planner","invalid_path")}
          if statuses["resolve"] == 200 and statuses["execute"] == 500 and statuses["wave"] == 500:
              classification = "EXECUTION_AFTER_RESOLVER"
          elif statuses["resolve"] == 500:
              classification = "RESOLVER_OR_D1"
          elif statuses["execute"] == 200 and statuses["wave"] == 500:
              classification = "ATHENA_WRAPPER"
          elif statuses["execute"] == 200 and statuses["wave"] == 200:
              classification = "READ_PATH_HEALTHY"
          elif statuses["execute"] in (502, 503) and statuses["wave"] == statuses["execute"]:
              classification = "STRUCTURED_EXECUTION_DEPENDENCY_FAILURE"
          else:
              classification = "MIXED"

          evidence = {
              "schema": "OGE40_RUNTIME_ISOLATION_V2",
              "tested_commit": os.environ.get("GITHUB_SHA"),
              "classification": classification,
              "statuses": statuses,
              "responses": {
                  name: safe_summary(name)
                  for name in ("resolve","execute","wave","planner","invalid_path")
              },
              "interpretation": {
                  "resolve_200_rules_out_resolver_query_for_same_fixture": statuses["resolve"] == 200,
                  "execute_500_after_resolve_200_points_after_resolution": statuses["resolve"] == 200 and statuses["execute"] == 500,
                  "wave_matches_execute": statuses["wave"] == statuses["execute"],
                  "planner_structured": statuses["planner"] in (409, 422),
                  "invalid_path_structured": statuses["invalid_path"] == 400,
              },
              "secret_values_included": False,
          }

          out = Path("docs/evidence/oge-40-runtime-isolation-latest.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(evidence, indent=2, ensure_ascii=False) + "\n")
          print(json.dumps(evidence, indent=2, ensure_ascii=False))
          PY

      - name: Commit sanitized diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ogenic-runtime-proof"
          git config user.email "runtime-proof@users.noreply.github.com"
          git add docs/evidence/oge-40-runtime-isolation-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "test(oge-40): capture isolated runtime boundary"
          git fetch origin phase-vi-provider-incentive-metering
          git rebase origin/phase-vi-provider-incentive-metering
          git push origin HEAD:phase-vi-provider-incentive-metering
