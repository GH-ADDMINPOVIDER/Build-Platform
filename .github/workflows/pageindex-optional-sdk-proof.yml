name: PageIndex Optional Python SDK Proof (Zero LLM)

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - ".github/workflows/pageindex-optional-sdk-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pageindex-local:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 20
    env:
      # Never use model/API credentials in this workflow.
      PAGEINDEX_LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official pinned MIT SDK into isolated Python job
        run: python -m pip install --disable-pip-version-check --no-input -r integrations/pageindex/requirements.txt
      - name: Check actual PageIndex SDK import (no model or cloud call)
        run: python integrations/pageindex/bridge.py doctor
      - name: Prove local PDF outline reading without LLM
        run: |
          python - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path
          from PyPDF2 import PdfWriter

          with tempfile.TemporaryDirectory() as tmp:
              pdf = Path(tmp) / "sample.pdf"
              writer = PdfWriter()
              writer.add_blank_page(width=612, height=792)
              writer.add_outline_item("Overview", 0)
              with pdf.open("wb") as handle:
                  writer.write(handle)
              output = subprocess.check_output(
                  ["python", "integrations/pageindex/bridge.py", "outline", "--pdf", str(pdf)],
                  text=True,
              )
              result = json.loads(output)
              assert result["ok"] is True
              assert result["is_full_pageindex_index"] is False
              assert result["paid_api_requests"] == 0
              assert result["pages"] == 1
              assert result["outline_nodes"] == 1
              assert result["tree"][0]["title"] == "Overview"
              print("Official SDK installed; deterministic local PDF outline: PASS")
          PY
      - name: Prove LLM indexing is blocked (no paid call)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python integrations/pageindex/bridge.py index > /tmp/pi-disabled.json
          exit_code=$?
          set -e
          test "$exit_code" = 3
          python - <<'PY'
          import json
          with open("/tmp/pi-disabled.json") as file:
              body = json.load(file)
          assert body["code"] == "PAGEINDEX_LLM_NOT_ENABLED"
          assert body["paid_api_requests"] == 0
          print("No PageIndex LLM indexing enabled: PASS")
          PY
      - name: Publish evidence (no secrets, no repo mutation)
        shell: bash
        run: |
          {
            echo "### WAVE PageIndex SDK registration"
            echo "- Official SDK: pageindex==0.2.10 installed in ephemeral Python runner"
            echo "- PDF TOC extraction: verified; **not** full PageIndex AI index"
            echo "- LLM inference/Cloud index calls: **0**"
            echo "- Cloudflare/D1/Green/prod schema mutation: **0**"
            echo "- Full PageIndex reasoning retrieval remains disabled until explicitly authorized"
          } >> "$GITHUB_STEP_SUMMARY"
