name: OGENIC LINE-only Infisical secret retirement (owner requested)

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths: [".github/workflows/oge-line-secrets-retire.yml"]

permissions:
  contents: read
  id-token: write

jobs:
  retire_line_names:
    if: github.repository == 'Ogenicchocolate21debug/Build-Platform' && github.actor == 'Ogenicchocolate21debug' && github.run_attempt == 1
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 10
    env:
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
      INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
      INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
    steps:
      - name: Checkout exact staging SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retire only 9 explicitly inventoried LINE_* secret names from Infisical
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "wave-runner-01"
          test "$GITHUB_REF_NAME" = "phase-vi-provider-incentive-metering"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/phase-vi-provider-incentive-metering | awk '{print $1}')"
          test "$GITHUB_SHA" = "$REMOTE_HEAD" || { echo 'STALE_STAGING_SHA: no changes made'; exit 86; }
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const env = process.env;
          const base = 'https://app.infisical.com';
          const expected = {
            dev: ['LINE_CHANNEL_ACCESS_TOKEN','LINE_ID','LINE_ID_USE','LINE_SECRET_CHANNEL'],
            staging: ['LINE_ID'],
            prod: ['LINE_API_KEY','LINE_CHANNEL_ACCESS_TOKEN','LINE_CHANNEL_ID','LINE_CHANNEL_SECRET']
          };
          const projectSlug = 'ogenic-sio-ti-rv';
          const report = {schema:'ogenic.line-secret-retirement.v1',scope:'Infisical exact LINE_ names only', project:projectSlug,
            source_sha:env.GITHUB_SHA, run_id:env.GITHUB_RUN_ID, no_secret_values_read:true, expected:9, before:[], changes:[], after:[], status:'UNKNOWN'};
          const assert = (ok,msg) => { if(!ok) throw new Error(msg) };
          const request = async (url,init={},tag='REQUEST') => {
            const r=await fetch(url,{...init,signal:AbortSignal.timeout(20000)});
            let data={};try{data=await r.json()}catch{}
            if(!r.ok) throw new Error(tag+'_HTTP_'+r.status);
            return data;
          };
          const metadata = async (projectId,environment,token) => {
            const p=new URLSearchParams({projectId,environment,secretPath:'/',recursive:'true',
              viewSecretValue:'false',expandSecretReferences:'false'});
            const resp=await request(base+'/api/v4/secrets?'+p,{headers:{Authorization:'Bearer '+token}},'META_'+environment);
            assert(Array.isArray(resp.secrets),'BAD_META_'+environment);
            return resp.secrets.filter(x=>typeof x.secretKey==='string' && /^LINE_/.test(x.secretKey))
              .map(x=>({environment,key:x.secretKey,path:x.secretPath||'/',type:x.type||'shared'}))
              .sort((a,b)=>a.key.localeCompare(b.key));
          };
          try {
            assert(env.ACTIONS_ID_TOKEN_REQUEST_URL && env.ACTIONS_ID_TOKEN_REQUEST_TOKEN && env.INFISICAL_IDENTITY_ID,'OIDC_UNAVAILABLE');
            const authz=await request(env.ACTIONS_ID_TOKEN_REQUEST_URL,{
              headers:{Authorization:'Bearer '+env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}},'GH_OIDC');
            assert(typeof authz.value==='string' && authz.value.length>0,'NO_JWT');
            const login=await request(base+'/api/v1/auth/oidc-auth/login',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({identityId:env.INFISICAL_IDENTITY_ID,jwt:authz.value,organizationSlug:env.INFISICAL_ORG_SLUG})
            },'INFISICAL_LOGIN');
            assert(typeof login.accessToken==='string','NO_ACCESS_TOKEN');
            const token=login.accessToken;
            const projects=await request(base+'/api/v1/projects',{headers:{Authorization:'Bearer '+token}},'PROJECTS');
            const matches=(projects.projects||[]).filter(p=>p.orgId===env.INFISICAL_ORG_ID && p.slug===projectSlug);
            assert(matches.length===1,'PROJECT_SCOPE_MISMATCH');
            const projectId=matches[0].id;
            for(const [environment,names] of Object.entries(expected)){
              const current=await metadata(projectId,environment,token);
              report.before.push(...current);
              assert(current.every(x=>x.path==='/' && (x.type==='shared'||x.type==='personal')),'UNEXPECTED_SECRET_PATH_OR_TYPE_'+environment);
              const actual=current.map(x=>x.key).sort().join('|');
              assert(actual===names.slice().sort().join('|'),'LINE_INVENTORY_DRIFT_'+environment);
            }
            assert(report.before.length===9,'LINE_COUNT_DRIFT');
            // Delete each inventoried name in exact project/environment/path.
            // Never print, store, or expose returned secret object or secret value.
            for(const entry of report.before){
              let state='FAILED';
              try {
                const reply=await request(base+'/api/v4/secrets/'+encodeURIComponent(entry.key),{
                  method:'DELETE',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
                  body:JSON.stringify({projectId,environment:entry.environment,secretPath:entry.path,type:entry.type})
                },'DELETE_'+entry.environment);
                state=reply.approval?'PENDING_APPROVAL':'DELETE_ACCEPTED';
              }catch(error){state=String(error.message||'ERROR').slice(0,80);}
              report.changes.push({environment:entry.environment,key:entry.key,state});
            }
            for(const environment of Object.keys(expected)) report.after.push(...await metadata(projectId,environment,token));
            report.status=report.after.length===0 && report.changes.every(x=>x.state==='DELETE_ACCEPTED')
              ?'LINE_KEYS_ABSENT_VERIFIED':'PARTIAL_OR_PENDING_REVIEW';
          } catch(error) {
            report.status='BLOCKED_OR_PARTIAL';
            report.error=String(error.message||'ERROR').slice(0,100);
          }
          writeFileSync('ogenic-line-secret-retirement.json',JSON.stringify(report,null,2)+'\n',{mode:0o600});
          console.log('LINE_RETIRE_STATUS='+report.status);
          console.log('LINE_BEFORE='+report.before.length);
          console.log('LINE_AFTER='+report.after.length);
          for(const row of report.changes) console.log('LINE_NAME_RESULT='+row.environment+'/'+row.key+':'+row.state);
          if(report.error) console.log('LINE_BLOCKER='+report.error);
          if(report.status!=='LINE_KEYS_ABSENT_VERIFIED')process.exitCode=86;
          NODE
      - name: Upload names-only retirement receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogenic-line-retirement-${{ github.run_id }}
          path: ogenic-line-secret-retirement.json
          retention-days: 1
          if-no-files-found: warn
      - name: Summarize scope
        if: always()
        shell: bash
        run: |
          {
            echo "## LINE secret retirement"
            echo "- LINE_ keys only: dev, staging, prod in authorized Infisical project"
            echo "- Project: ogenic-sio-ti-rv"
            echo "- LINEAR_API_KEY and other providers explicitly excluded"
            echo "- No secret values read or emitted"
            echo "- No production deployment or runtime configuration changes"
            echo "- Names-only verification receipt, retention 1 day"
          } >> "$GITHUB_STEP_SUMMARY"
