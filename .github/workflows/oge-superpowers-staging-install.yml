name: OGENIC Superpowers - Pinned Skills Install on Existing Ocian-S-Host

on:
  push:
    branches: [Unified-on-Progress]
    paths:
      - ".github/workflows/oge-superpowers-staging-install.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oge-superpowers-existing-runner-1
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'Wave-Runner-2/Build-Platform' && github.ref_name == 'Unified-on-Progress'
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 12
    steps:
      - name: Checkout exact staging source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install immutable superpowers skills without running upstream hooks
        shell: bash
        env:
          OPENAI_API_KEY: ""
          CODEX_API_KEY: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_NAME" = wave-runner-01
          test "$GITHUB_REPOSITORY" = Wave-Runner-2/Build-Platform
          test "$GITHUB_REF_NAME" = Unified-on-Progress
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          pin=b739a8af570e10a95898f2bdf6cec97467fa6c12
          root="$HOME/.local/share/ogenic/third_party/superpowers"
          pinned="$root/$pin"
          mkdir -p "$root"
          if test ! -r "$pinned/skills/using-superpowers/SKILL.md"; then
            temp="$(mktemp -d "$root/.stage.XXXXXXXX")"
            trap 'rm -rf -- "$temp"' EXIT
            git -C "$temp" init -q
            GIT_TERMINAL_PROMPT=0 git -C "$temp" -c credential.helper= fetch --quiet --no-tags --depth=1 https://github.com/obra/superpowers.git "$pin"
            git -C "$temp" -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$temp" rev-parse HEAD)" = "$pin"
            test -r "$temp/LICENSE"
            test -r "$temp/skills/using-superpowers/SKILL.md"
            mkdir -p "$temp/package"
            cp -a "$temp/skills" "$temp/package/skills"
            cp "$temp/LICENSE" "$temp/package/LICENSE"
            test ! -e "$pinned"
            mv "$temp/package" "$pinned"
          fi
          count=0
          for skill_file in "$pinned"/skills/*/SKILL.md; do
            test -f "$skill_file"
            name="$(basename "$(dirname "$skill_file")")"
            [[ "$name" =~ ^[a-z][a-z0-9-]+$ ]]
            for directory in "$HOME/.agents/skills" "$HOME/.codex/skills"; do
              mkdir -p "$directory"
              name_path="$directory/superpowers-$name"
              target="$pinned/skills/$name"
              if test -L "$name_path"; then
                test "$(readlink "$name_path")" = "$target"
              elif test -e "$name_path"; then
                echo "SUPERPOWERS_EXISTING_SKILL_COLLISION"
                exit 78
              else
                ln -s "$target" "$name_path"
              fi
              test -r "$name_path/SKILL.md"
            done
            count=$((count+1))
          done
          test "$count" -ge 12
          test -r "$HOME/.agents/skills/superpowers-using-superpowers/SKILL.md"
          test -r "$HOME/.agents/skills/superpowers-systematic-debugging/SKILL.md"
          test -r "$HOME/.agents/skills/superpowers-verification-before-completion/SKILL.md"
          echo "SUPERPOWERS_UPSTREAM_SHA=$pin"
          echo "SUPERPOWERS_GS_RUNNER_SKILLS_INSTALLED=$count"
          echo "SUPERPOWERS_SKILL_READBACK=PASS"
          echo "SUPERPOWERS_AUTH_FILES_MODIFIED=FALSE"
          echo "SUPERPOWERS_UPSTREAM_HOOKS_EXECUTED=FALSE"
          echo "SUPERPOWERS_CODEX_TS_ROOT_INSTALL=NOT_VERIFIED"
      - name: Check Codex GS existing local login (never export tokens)
        shell: bash
        env:
          OPENAI_API_KEY: ""
          CODEX_API_KEY: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          if command -v codex >/dev/null 2>&1 && codex login status >/dev/null 2>&1; then
            echo "SUPERPOWERS_CODEX_GS_LOCAL_LOGIN=SIGNED_IN"
          else
            echo "SUPERPOWERS_CODEX_GS_LOCAL_LOGIN=NOT_VERIFIED"
          fi
          echo "SUPERPOWERS_GPT_CHAT_CLIENT_INSTALL=NOT_APPLICABLE"
      - name: Exercise existing Codex TS root OAuth context through bounded Docker read-only invocation
        shell: bash
        timeout-minutes: 5
        env:
          OPENAI_API_KEY: ""
          CODEX_API_KEY: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = wave-runner-01
          if ! command -v docker >/dev/null 2>&1; then
            echo "TS_CODEX_CURRENT=DOCKER_NOT_AVAILABLE"
            exit 78
          fi
          if test ! -f /usr/lib/node_modules/@openai/codex/bin/codex.js; then
            echo "TS_CODEX_CURRENT=HOST_CLI_PACKAGE_UNAVAILABLE"
            exit 78
          fi
          pin=b739a8af570e10a95898f2bdf6cec97467fa6c12
          skills="$HOME/.local/share/ogenic/third_party/superpowers/$pin/skills"
          test -f "$skills/using-superpowers/SKILL.md" || { echo "TS_CODEX_SUPERPOWERS_SKILLS_MISSING"; exit 78; }
          image=""
          while IFS= read -r candidate; do
            [[ "$candidate" != *"<none>"* ]] || continue
            if docker run --rm --network none --read-only --user 0:0 --entrypoint /bin/sh "$candidate" -c 'command -v node >/dev/null 2>&1' >/dev/null 2>&1; then
              image="$candidate"
              break
            fi
          done < <(docker image ls --format '{{.Repository}}:{{.Tag}}')
          if test -z "$image"; then echo "TS_CODEX_CURRENT=NO_PREEXISTING_NODE_IMAGE"; exit 78; fi
          # Check the specific TS identity using only hash of the claim; never print/copy root auth.json.
          # A failed identity check cannot fall back to GS or a different Codex account.
          if ! docker run --rm --network none --read-only --user 0:0 --entrypoint /bin/sh \
            --cap-drop ALL --security-opt no-new-privileges \
            -v /root/.codex:/root/.codex:ro \
            -e HOME=/root -e CODEX_HOME=/root/.codex "$image" -ec '
              node -e '\''const fs=require("fs"),c=require("crypto");const a=JSON.parse(fs.readFileSync("/root/.codex/auth.json","utf8"));const t=a.tokens&&a.tokens.id_token; if(typeof t!=="string")process.exit(78);const p=JSON.parse(Buffer.from(t.split(".")[1],"base64url").toString("utf8"));const h=c.createHash("sha256").update(String(p.email||"").trim().toLowerCase()).digest("hex");if(h!=="a9bc2ab898ff2400247c11565f37dd59ff90d50085185c2756db603e4a778aba")process.exit(78);'\''
            ' >/dev/null 2>&1; then
            echo "TS_CODEX_CURRENT=IDENTITY_UNVERIFIED"
            exit 78
          fi
          echo "TS_CODEX_IDENTITY=GPT_TS_CODEX"
          # Reuse historical Docker adapter, existing root CODEX_HOME and existing CLI package.
          # Root OAuth cache is writable only to permit normal token refresh; no raw token access/output.
          if ! timeout 150s docker run --rm --read-only --user 0:0 \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 96 --memory 704m \
            --tmpfs /tmp:rw,nosuid,noexec,size=24m --workdir /workspace \
            --entrypoint /bin/sh \
            -e HOME=/root -e CODEX_HOME=/root/.codex -e CI=1 \
            -e OPENAI_API_KEY= -e CODEX_API_KEY= -e GH_TOKEN= -e GITHUB_TOKEN= \
            -v /root/.codex:/root/.codex:rw \
            -v /usr/lib/node_modules:/usr/lib/node_modules:ro \
            -v "$GITHUB_WORKSPACE":/workspace:ro \
            "$image" -eu -c '
              node /usr/lib/node_modules/@openai/codex/bin/codex.js exec \
                --sandbox read-only --skip-git-repo-check \
                --output-last-message /tmp/ts-last.txt \
                "Return exactly OGENIC_TS_CODEX_READY. Do not inspect files or execute shell commands." \
                >/tmp/ts-cli.log 2>&1 || {
                  if grep -Eiq "invalid_grant|failed to refresh|refresh token" /tmp/ts-cli.log; then
                    echo TS_CODEX_CURRENT=TOKEN_REFRESH_REJECTED
                  elif grep -Eiq "401|reauthentication|not logged in|login required" /tmp/ts-cli.log; then
                    echo TS_CODEX_CURRENT=REAUTH_REQUIRED
                  elif grep -Eiq "403|permission denied" /tmp/ts-cli.log; then
                    echo TS_CODEX_CURRENT=FORBIDDEN_OR_SANDBOX
                  elif grep -Eiq "quota|rate limit|429" /tmp/ts-cli.log; then
                    echo TS_CODEX_CURRENT=QUOTA_OR_RATE_LIMIT
                  else
                    echo TS_CODEX_CURRENT=CLI_INFERENCE_FAILED
                  fi
                  exit 78
                }
              grep -Fxq OGENIC_TS_CODEX_READY /tmp/ts-last.txt || { echo TS_CODEX_CURRENT=OUTPUT_NOT_MATCHED; exit 78; }
              echo TS_CODEX_CURRENT=LIVE_INFERENCE_PASS
              echo TS_CODEX_SUPERPOWERS_SKILLS_MOUNTED=FALSE_SEPARATE_CONTEXT
            '; then
            echo "TS_CODEX_ROOT_RUNTIME=NOT_OPERATIONAL"
            exit 78
          fi
          echo "TS_CODEX_ROOT_CURRENT_LIVE_E2E=PASS"
      - name: Scope and honesty receipt
        if: always()
        shell: bash
        run: |
          echo "Pinned skills: obra/superpowers at b739a8af570e10a95898f2bdf6cec97467fa6c12" >> "$GITHUB_STEP_SUMMARY"
          echo "One existing host: wave-runner-01; only unifiend user's CLI skill directories." >> "$GITHUB_STEP_SUMMARY"
          echo "No production, credential edits, new agent host or upstream execution hooks." >> "$GITHUB_STEP_SUMMARY"
          echo "Skills on GS host != TS/root install or ChatGPT account plugin or new Protocol E2E." >> "$GITHUB_STEP_SUMMARY"
