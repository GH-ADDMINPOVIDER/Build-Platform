name: OGE-55 CapSig CapRank Proof

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - "worker/capsig-caprank.ts"
      - "tests/oge-55-capsig-caprank.test.mjs"
      - ".github/workflows/oge-55-capsig-caprank-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --package-lock-only && npm ci

      - name: CapSig / CapRank contract regression
        run: node --test tests/oge-55-capsig-caprank.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prove pure no-provider no-schema boundary
        run: |
          set -euo pipefail
          ! grep -E 'api\.(openai|anthropic|perplexity)\.com|fetch[[:space:]]*\(' worker/capsig-caprank.ts
          ! grep -E 'CREATE TABLE|ALTER TABLE|DROP TABLE' worker/capsig-caprank.ts
