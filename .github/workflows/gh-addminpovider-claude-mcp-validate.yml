name: Claude Yellow Stone bridge validation
on:
  push:
    branches: [main]
    paths: [.github/workflows/gh-addminpovider-claude-mcp-validate.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository_id == '1429580446' && github.repository_owner_id == '342175560'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d61e1d06a78adcc84e755bdacfbb9911dd169bf
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: OAuth and Yellow Stone execution boundary tests
        run: node --test tests/claude-yellow-stone-mcp.test.mjs
      - name: Install pinned repository dependencies
        run: npm ci
      - name: Compare full test and TypeScript results against unchanged baseline
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,pathlib,re,json,os
          root=pathlib.Path.cwd()
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/"yellow-stone-baseline"
          subprocess.run(["git","fetch","origin","36b5eb61dff2f3cd5a320854afbf5bb746f3b3d5"],check=True,stdout=subprocess.DEVNULL)
          subprocess.run(["git","worktree","add","--detach",str(base),"36b5eb61dff2f3cd5a320854afbf5bb746f3b3d5"],check=True,stdout=subprocess.DEVNULL)
          (base/"node_modules").symlink_to(root/"node_modules",target_is_directory=True)
          def run(where,kind):
              cmd=["node","--test","--test-reporter=tap"]+[str(p.relative_to(where)) for p in sorted((where/"tests").glob("*.test.mjs"))] if kind=="tests" else ["npm","run","typecheck"]
              result=subprocess.run(cmd,cwd=where,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (root/(("baseline" if where==base else "candidate")+"-"+kind+".log")).write_text(result.stdout)
              if kind=="tests":failures=sorted(set(re.findall(r"^\s*not ok \d+ - (.+)$",result.stdout,re.M)))
              else:failures=sorted(set(re.sub(r"\(\d+,\d+\)","",l) for l in result.stdout.splitlines() if "error TS" in l))
              return {"exit_code":result.returncode,"failures":failures}
          report={}
          for kind in ["tests","typecheck"]:
              before=run(base,kind);after=run(root,kind)
              added=sorted(set(after["failures"])-set(before["failures"]))
              if after["exit_code"] and not after["failures"]:added.append("UNPARSED_"+kind+"_FAILURE")
              report[kind]={"baseline_exit":before["exit_code"],"candidate_exit":after["exit_code"],"baseline_failures":before["failures"],"candidate_failures":after["failures"],"new_failures":added}
          print(json.dumps(report,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write("## Candidate versus existing baseline\n\n~~~json\n"+json.dumps(report,indent=2)+"\n~~~\n")
          raise SystemExit(1 if any(v["new_failures"] for v in report.values()) else 0)
          
          PY
      - name: Build Worker and app
        run: npm run build
      - name: Verify Worker bundle without deployment
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/claude-yellow-stone-worker"
