name: GH2 Infisical OIDC Docker Text and Secret Transfer Proof
on:
  push:
    branches: [test/owner-report-40-images-docker-roundtrip-20261023]
    paths: [.github/workflows/tmn-oidc-text-secret-docker-proof.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  text-secret-in-container:
    if: github.repository == 'Wave-Runner-2/Build-Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
      INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || 'ogenic-sio-ti-rv' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load existing staging identity from Infisical with GH2 OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: staging
          secret-path: /
          recursive: false
      - name: Confirm restricted source secret is available without printing value
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Wave-Runner-2/Build-Platform
          test -n "${OCIAN_DROPLET_ID:-}" || { echo 'INFISICAL_TEST_SECRET_MISSING'; exit 21; }
          echo 'INFISICAL_OIDC_GH2_STAGING=PASS'
          echo 'INFISICAL_TEST_SECRET_FIELD=EXISTS_MASKED'
      - name: Transfer text and an existing low-sensitivity Infisical variable inside Docker via stdin
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          container="tmn-oidc-proof-${GITHUB_RUN_ID}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker create --name "$container" --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=2m \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 64m --pids-limit 24 alpine:3.20 sh -c 'sleep 90' >/dev/null
          docker start "$container" >/dev/null
          mkdir -p proof-return
          printf '%s\n' 'WAVE TMN A2A | GH2 + Infisical OIDC + Docker | ข้อความทดสอบจากคอนเทนเนอร์' > proof-text-in.txt
          docker cp proof-text-in.txt "$container":/tmp/proof-text.txt
          docker cp "$container":/tmp/proof-text.txt proof-return/proof-text-out.txt
          cmp proof-text-in.txt proof-return/proof-text-out.txt
          test "$(wc -c < proof-text-in.txt)" -gt 30
          echo 'TEXT_DOCKER_ROUNDTRIP=PASS_EXACT_UTF8'
          printf 'TEXT_RETURNED='
          cat proof-return/proof-text-out.txt
          # The Infisical-supplied field is a non-credential system identifier.
          # It goes to Docker only on stdin, NEVER a Docker argument or env.
          # Secret bytes never enter Git/artifacts/logs; only digest comparison.
          printf '%s' "$OCIAN_DROPLET_ID" | docker exec -i "$container" sh -c 'umask 077; cat > /tmp/secret-proof' 
          expected="$(printf '%s' "$OCIAN_DROPLET_ID" | sha256sum | cut -d' ' -f1)"
          observed="$(docker exec "$container" sha256sum /tmp/secret-proof | cut -d' ' -f1)"
          test -n "$expected" && test "$observed" = "$expected"
          docker exec "$container" sh -c 'rm -f /tmp/secret-proof'
          echo 'INFISICAL_SECRET_TO_DOCKER_STDIN=PASS_SHA256_COMPARE_NO_VALUE_EXPOSED'
          docker inspect "$container" --format '{{.HostConfig.ReadonlyRootfs}} {{.HostConfig.Privileged}} {{json .HostConfig.PortBindings}}' | grep -F 'true false' >/dev/null
          printf '%s\n' '{"result":"PASS","route":"GH2->Infisical OIDC->Docker->GH2","text":"EXACT_UTF8_RETURNED","secret":"SHA256_MATCH_NO_VALUE_EXPOSED","source_kind":"INFISICAL_STAGING_NON_CREDENTIAL_IDENTIFIER","host":"GITHUB_HOSTED_CI_NOT_OCIAN_S_HOST","full_a2a_e2e":false}' > proof-return/receipt.json
      - name: Upload safe text and receipt only, no secret
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tmn-oidc-text-secret-safe-receipt
          path: proof-return/
          retention-days: 1
          if-no-files-found: error
