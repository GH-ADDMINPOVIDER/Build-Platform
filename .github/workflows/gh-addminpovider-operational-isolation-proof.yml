name: GH-ADDMINPOVIDER Operational Isolation Proof
on:
  push:
    branches: [Unified-on-Progress]
    paths:
      - "worker/**"
      - "config/**"
      - "scripts/oge34-github-worker-binding.mjs"
      - "scripts/replica-executor/athena-context.mjs"
      - ".github/workflows/**"
      - "tests/**"
      - "src/**"
      - "skills/**"
      - "public/**"
      - ".agents/**"
      - ".opencode/**"
      - ".vscode/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operational-isolation:
    if: github.repository_id == '1429580446' && github.repository_owner_id == '342175560'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Unified-on-Progress
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit active source tree for retired GitHub identities
        shell: bash
        run: |
          set -euo pipefail
          # Preserve immutable historical CERT/docs/tests; forbid active wiring to retired accounts.
          if git grep -n -E 'Ogenicchocolate21debug|Wave-Runner-2|1350684572|306097555' -- \
            worker config scripts src skills public .agents .opencode .vscode .github/workflows deploy integrations ops infra packages workflows \
            ':(exclude).github/workflows/gh-addminpovider-operational-isolation-proof.yml' \
            ':(exclude)config/oge-error-memory.json' \
            ':(exclude)config/provider-readiness-attestations.json'; then
            echo "::error::RETIRED_GITHUB_IDENTITY_PRESENT_IN_ACTIVE_SOURCE"
            exit 1
          fi
          echo "GH2_ACTIVE_SOURCE_LEGACY_REFERENCE_SCAN=PASS"
      - name: Assert retired identities cannot enter active workflows
        run: |
          set -euo pipefail
          node --check scripts/oge34-github-worker-binding.mjs
          node --check scripts/replica-executor/athena-context.mjs
          node --test tests/gh-addminpovider-operational-isolation.test.mjs tests/codex-left-arm-contract.test.mjs tests/oge95-athena-runner-context.test.mjs tests/oge-34-github-worker-binding.test.mjs
