name: OGE-57 Task Inbox Core Proof

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - "worker/task-inbox-api.ts"
      - "worker/entry-yellow-stone.ts"
      - "tests/oge-57-task-inbox-core.test.mjs"
      - "tests/fixtures/oge-57-task-inbox-roundtrip.json"
      - ".github/workflows/oge-57-task-inbox-core-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deterministic task inbox contract
        run: node --test tests/oge-57-task-inbox-core.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Guard existing-schema-only contract
        run: |
          set -euo pipefail
          ! grep -E 'CREATE TABLE|ALTER TABLE|DROP TABLE' worker/task-inbox-api.ts
          grep -q 'chat_session_refs' worker/task-inbox-api.ts
          grep -q 'agent_tasks' worker/task-inbox-api.ts
          grep -q 'agent_events' worker/task-inbox-api.ts
