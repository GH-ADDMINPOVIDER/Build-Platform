name: Meta Inline UI Patch

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - ".github/workflows/meta-inline-ui-patch.yml"
      - "scripts/patch-meta-inline-ui.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: phase-vi-provider-incentive-metering

      - name: Apply deterministic Meta UI + deploy patch
        run: python scripts/patch-meta-inline-ui.py

      - name: Validate TypeScript and build
        run: |
          npm install --package-lock-only
          npm ci
          npm run typecheck
          npm run build

      - name: Commit patched staging files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/UnifiedChat.tsx .github/workflows/provider-incentive-staging-deploy.yml; then
            echo "No Meta patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/UnifiedChat.tsx .github/workflows/provider-incentive-staging-deploy.yml
          git commit -m "feat: expose Meta suite in unified chat"
          git push origin HEAD:phase-vi-provider-incentive-metering
