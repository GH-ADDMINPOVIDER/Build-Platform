name: GH-ADDMINPOVIDER platform probe (status codes only)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    if: github.repository_id == '1429580446' && github.repository_owner_id == '342175560'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe providers with Infisical secrets (values masked, never printed)
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error
          BASE="https://app.infisical.com"
          PROJECT="e8cfba67-ea99-4d79-bc9f-87b862f9129c"
          IDENTITY="b0962d69-bd33-4ac3-b4f4-48589535ca38"
          AUD="https://github.com/GH-ADDMINPOVIDER"
          def call(url,headers=None,data=None,method=None):
              h={"User-Agent":"GH-ADDMINPOVIDER-probe","Accept":"application/json"}
              h.update(headers or {})
              b=None
              if data is not None:h["Content-Type"]="application/json";b=json.dumps(data).encode()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=h,data=b,method=method),timeout=20) as r:
                      return r.status,r.read()
              except urllib.error.HTTPError as e:return e.code,e.read()
              except Exception as e:return 0,str(type(e).__name__).encode()
          def js(b):
              try:return json.loads(b)
              except Exception:return {}
          u=urllib.parse.urlsplit(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"])
          s,b=call(urllib.parse.urlunsplit(u._replace(query=urllib.parse.urlencode(urllib.parse.parse_qsl(u.query)+[("audience",AUD)]))),{"Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          jwt=js(b)["value"]
          s,b=call(BASE+"/api/v1/auth/oidc-auth/login",data={"identityId":IDENTITY,"jwt":jwt})
          tok=js(b)["accessToken"]
          q=urllib.parse.urlencode({"workspaceId":PROJECT,"environment":"staging","secretPath":"/","recursive":"true","viewSecretValue":"true"})
          s,b=call(BASE+"/api/v3/secrets/raw?"+q,{"Authorization":"Bearer "+tok})
          ALLOW=("CLOUDFLARE_","VERCEL_ACCESS_TOKEN","LINEAR_API_KEY","OPENAI_API_KEY","OPENAI_EXECUTOR_API_KEY","GEMINI_API_KEY","Api_deepseek_key_operate_1","ANTHROPIC_API_KEY","XAI_API_KEY","NOTION_TOKEN","DISCORD_TOKEN","GH_ADDMINPROVIDER-FINE_GRAINED","N8N_URL","N8N_API_KEY")
          S={x["secretKey"]:x["secretValue"] for x in js(b).get("secrets",[]) if x["secretKey"].startswith(ALLOW) and "\n" not in (x["secretValue"] or "")}
          for v in S.values():
              for line in (v or "").splitlines():
                  if line.strip(): print("::add-mask::"+line.strip())
          def G(*names):
              for n in names:
                  if S.get(n):return S[n]
          def rep(label,code,extra=""):print(f"{label}: HTTP {code} {extra}".strip())
          print("CF names:",",".join(sorted(k for k in S if k.upper().startswith("CLOUDFLARE"))))
          # Cloudflare: try every CLOUDFLARE*TOKEN*
          acct=None
          for k in sorted(S):
              if k.upper().startswith("CLOUDFLARE") and "TOKEN" in k.upper():
                  c,b=call("https://api.cloudflare.com/client/v4/user/tokens/verify",{"Authorization":"Bearer "+S[k]})
                  rep("cloudflare verify "+k,c,(js(b).get("result") or {}).get("status",""))
                  if c==200 and not acct:
                      c2,b2=call("https://api.cloudflare.com/client/v4/accounts",{"Authorization":"Bearer "+S[k]})
                      accs=js(b2).get("result",[]) or []
                      rep("  accounts",c2,f"count={len(accs)} names="+",".join(a.get('name','') for a in accs))
                      if accs:
                          acct=accs[0]["id"]
                          c3,b3=call(f"https://api.cloudflare.com/client/v4/accounts/{acct}/workers/scripts",{"Authorization":"Bearer "+S[k]})
                          rep("  workers",c3,"scripts="+",".join(x.get("id","") for x in (js(b3).get("result") or [])))
                          c4,b4=call(f"https://api.cloudflare.com/client/v4/accounts/{acct}/d1/database",{"Authorization":"Bearer "+S[k]})
                          rep("  d1",c4,"dbs="+",".join(x.get("name","") for x in (js(b4).get("result") or [])))
          t=G("VERCEL_ACCESS_TOKEN");  t and rep("vercel",call("https://api.vercel.com/v2/user",{"Authorization":"Bearer "+t})[0])
          t=G("LINEAR_API_KEY");       t and rep("linear",call("https://api.linear.app/graphql",{"Authorization":t},{"query":"{viewer{id}}"})[0])
          t=G("OPENAI_API_KEY");       t and rep("openai",call("https://api.openai.com/v1/models",{"Authorization":"Bearer "+t})[0])
          t=G("OPENAI_EXECUTOR_API_KEY"); t and rep("openai_executor",call("https://api.openai.com/v1/models",{"Authorization":"Bearer "+t})[0])
          t=G("GEMINI_API_KEY");       t and rep("gemini",call("https://generativelanguage.googleapis.com/v1beta/models?key="+t)[0])
          t=G("Api_deepseek_key_operate_1"); t and rep("deepseek",call("https://api.deepseek.com/models",{"Authorization":"Bearer "+t})[0])
          t=G("ANTHROPIC_API_KEY");    t and rep("anthropic",call("https://api.anthropic.com/v1/models",{"x-api-key":t,"anthropic-version":"2023-06-01"})[0])
          t=G("XAI_API_KEY");          t and rep("xai",call("https://api.x.ai/v1/models",{"Authorization":"Bearer "+t})[0])
          t=G("NOTION_TOKEN");         t and rep("notion",call("https://api.notion.com/v1/users/me",{"Authorization":"Bearer "+t,"Notion-Version":"2022-06-28"})[0])
          t=G("DISCORD_TOKEN");        t and rep("discord",call("https://discord.com/api/v10/users/@me",{"Authorization":"Bot "+t})[0])
          t=G("GH_ADDMINPROVIDER-FINE_GRAINED"); t and rep("github_fine_grained",call("https://api.github.com/user",{"Authorization":"Bearer "+t})[0])
          n8u,n8k=G("N8N_URL"),G("N8N_API_KEY")
          if n8u and n8k: rep("n8n",call(n8u.rstrip("/")+"/api/v1/workflows?limit=1",{"X-N8N-API-KEY":n8k})[0])
          
          PY
