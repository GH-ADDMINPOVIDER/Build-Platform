name: OGE-53 Capability Dock Proof

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - "src/UnifiedChat.tsx"
      - "src/WaveNext.tsx"
      - "src/unified-chat.css"
      - "tests/oge-53-capability-dock.test.mjs"
      - ".github/workflows/oge-53-capability-dock-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --package-lock-only && npm ci

      - name: Capability dock regression
        run: node --test tests/oge-53-capability-dock.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
