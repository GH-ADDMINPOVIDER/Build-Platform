name: GH-ADDMINPOVIDER WAVE owner session probe
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    if: github.repository_id == '1429580446' && github.repository_owner_id == '342175560'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe WAVE /api/session (status and error code only, no secret values)
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error
          BASE="https://app.infisical.com"
          PROJECT="e8cfba67-ea99-4d79-bc9f-87b862f9129c"
          IDENTITY="b0962d69-bd33-4ac3-b4f4-48589535ca38"
          AUD="https://github.com/GH-ADDMINPOVIDER"
          def mask(v):
              for l in str(v).splitlines():
                  if l:print("::add-mask::"+l,flush=True)
          def req(url,token=None,data=None):
              h={"User-Agent":"GH-ADDMINPOVIDER-probe","Accept":"application/json"}
              if token:h["Authorization"]="Bearer "+token
              b=None
              if data is not None:h["Content-Type"]="application/json";b=json.dumps(data).encode()
              with urllib.request.urlopen(urllib.request.Request(url,headers=h,data=b),timeout=25) as r:return json.load(r)
          u=urllib.parse.urlsplit(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"])
          jwt=req(urllib.parse.urlunsplit(u._replace(query=urllib.parse.urlencode(urllib.parse.parse_qsl(u.query)+[("audience",AUD)]))),os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"])["value"];mask(jwt)
          tok=req(BASE+"/api/v1/auth/oidc-auth/login",data={"identityId":IDENTITY,"jwt":jwt})["accessToken"];mask(tok)
          q=urllib.parse.urlencode({"projectId":PROJECT,"environment":"staging","secretPath":"/","type":"shared","viewSecretValue":"true","expandSecretReferences":"false"})
          for name in ["OWNER_KEY_OPS","OWNER_KEY"]:
              try:
                  val=req(BASE+"/api/v4/secrets/"+name+"?"+q,tok)["secret"]["secretValue"];mask(val)
              except urllib.error.HTTPError as e:
                  print(name,"infisical_read_HTTP",e.code);continue
              print(name,"present_len",len(val),"has_ws",val!=val.strip())
              r=urllib.request.Request("https://wave.ogenicchocolate.com/api/session",data=json.dumps({"owner_key":val.strip()}).encode(),headers={"Content-Type":"application/json","User-Agent":"GH-ADDMINPOVIDER-probe"})
              try:
                  with urllib.request.urlopen(r,timeout=25) as resp:
                      body=json.load(resp);print(name,"WAVE_HTTP",resp.status,"authenticated",body.get("authenticated"),"role",body.get("user",{}).get("role"))
              except urllib.error.HTTPError as e:
                  try:body=json.loads(e.read().decode()[:400])
                  except Exception:body={}
                  print(name,"WAVE_HTTP",e.code,"error",str(body.get("error") or body.get("code") or body.get("message"))[:120])
          PY
