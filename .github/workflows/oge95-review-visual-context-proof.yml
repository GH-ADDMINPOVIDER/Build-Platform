name: OGE-95 Review Diagram and Context Economy Proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oge95-review-context-proof
  cancel-in-progress: true
jobs:
  proof:
    if: github.ref_name == 'phase-vi-provider-incentive-metering'
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-vi-provider-incentive-metering
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test review and context contracts
        run: node --test tests/oge95-review-visual.test.mjs tests/oge95-context-economy.test.mjs
      - name: Source diagram
        run: node scripts/oge95-review-visual.mjs HEAD~1
      - name: Synthetic reversible context economy
        run: node scripts/oge95-context-economy.mjs
      - name: Publish review-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: oge95-review-context-proof
          path: |
            oge95-review-impact.json
            oge95-review-impact.md
            oge95-review-impact.svg
            oge95-context-benchmark.json
          retention-days: 14
          if-no-files-found: error
