name: Unifiend Command Consumer

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Owner-approved Unifiend command task ID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  # Per-task dispatch deduplication; a *stable host flock* enforces SOLO without coalescing other tasks.
  group: unifiend-command-${{ inputs.task_id }}
  cancel-in-progress: false

env:
  UNIFIEND_URL: https://wave.ogenicchocolate.com
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_ENV_SLUG: staging

jobs:
  consume:
    if: github.ref_name == 'Unified-on-Progress' && github.repository_id == '1429580446' && github.repository_owner_id == '342175560'
    runs-on: [GH-ADDMINPOVIDER]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Unified-on-Progress
          persist-credentials: false
          fetch-depth: 0

      - name: Validate task scope
        shell: bash
        env:
          UNIFIEND_TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          [[ "$UNIFIEND_TASK_ID" =~ ^wavecmd_[a-f0-9]{64}$ ]]
          test "$(git branch --show-current)" = "Unified-on-Progress"
          test "$RUNNER_NAME" = "GH-ADDMINPOVIDER"

      - name: Discover Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load runtime authorization through Infisical OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true

      - name: Execute owner-approved command
        env:
          UNIFIEND_TASK_ID: ${{ inputs.task_id }}
          UNIFIEND_EVIDENCE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/unifiend-terminal-solo.sh
