name: OGE-34 GitHub Token Refresh

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - ".github/workflows/oge-34-github-token-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  WORKER_NAME: ogenic-phase-vi-staging
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}

jobs:
  refresh:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load Cloudflare credentials
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: ${{ steps.infisical_project.outputs.secret_env_slug }}
          secret-path: ${{ steps.infisical_project.outputs.secret_path }}

      - name: Load staging OGE-34 credential
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true

      - name: Validate and refresh canonical Worker GitHub binding
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${GITHUB_TOKEN_OGE34:-${GIBHUB_TOKEN_OGE34:-}}"
          test -n "$TOKEN" || { echo "::error::missing GITHUB_TOKEN_OGE34/GIBHUB_TOKEN_OGE34"; exit 1; }
          BRANCH_HTTP="$(curl --silent --show-error --output /tmp/oge34-branch.json --write-out '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/Ogenicchocolate21debug/Build-Platform/branches/phase-vi-provider-incentive-metering')"
          ACTIONS_HTTP="$(curl --silent --show-error --output /tmp/oge34-actions.json --write-out '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/Ogenicchocolate21debug/Build-Platform/actions/runs?branch=phase-vi-provider-incentive-metering&per_page=1')"
          test "$BRANCH_HTTP" = "200" || { echo "::error::OGE-34 GitHub branch read HTTP ${BRANCH_HTTP}"; exit 1; }
          test "$ACTIONS_HTTP" = "200" || { echo "::error::OGE-34 GitHub Actions read HTTP ${ACTIONS_HTTP}"; exit 1; }
          printf '%s' "$TOKEN" | npx wrangler secret put GITHUB_TOKEN --name "$WORKER_NAME" >/dev/null
          echo "OGE34_GITHUB_TOKEN_REFRESH_OK"
