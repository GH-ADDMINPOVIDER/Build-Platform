name: GH-ADDMINPOVIDER secret names probe
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  names:
    if: github.repository_id == '1429580446' && github.repository_owner_id == '342175560'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: List secret NAMES only (no values)
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse
          BASE="https://app.infisical.com"
          PROJECT="e8cfba67-ea99-4d79-bc9f-87b862f9129c"
          IDENTITY="b0962d69-bd33-4ac3-b4f4-48589535ca38"
          AUD="https://github.com/GH-ADDMINPOVIDER"
          def req(url,token=None,data=None):
              h={"User-Agent":"GH-ADDMINPOVIDER-probe","Accept":"application/json"}
              if token:h["Authorization"]="Bearer "+token
              b=None
              if data is not None:h["Content-Type"]="application/json";b=json.dumps(data).encode()
              with urllib.request.urlopen(urllib.request.Request(url,headers=h,data=b),timeout=25) as r:return json.load(r)
          u=urllib.parse.urlsplit(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"])
          jwt=req(urllib.parse.urlunsplit(u._replace(query=urllib.parse.urlencode(urllib.parse.parse_qsl(u.query)+[("audience",AUD)]))),os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"])["value"]
          tok=req(BASE+"/api/v1/auth/oidc-auth/login",data={"identityId":IDENTITY,"jwt":jwt})["accessToken"]
          q=urllib.parse.urlencode({"workspaceId":PROJECT,"environment":"staging","secretPath":"/","recursive":"true","viewSecretValue":"false"})
          d=req(BASE+"/api/v3/secrets/raw?"+q,tok)
          names=sorted(s["secretKey"] for s in d.get("secrets",[]))
          print("NAMES",len(names));print("LIST "+",".join(names))
          PY
