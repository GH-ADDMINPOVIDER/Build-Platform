name: OGE-129 Agent Sign Run - Unifiend Command Admission
on:
  push:
    branches: [feature/unifiend-liquid-glass-command-ux-20261018]
    paths:
      - ".github/workflows/oge-129-agent-sign-run-proof.yml"
      - "scripts/oge129_agent_sign_run_command_proof.mjs"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: oge129-agent-sign-run-admission
  cancel-in-progress: false
jobs:
  signed-command:
    if: github.repository == 'Wave-Runner-2/Build-Platform'
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 7
    env:
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
      INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
      INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
      INFISICAL_ENV_SLUG: staging
    steps:
      - name: Check out staging-only feature
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scope and syntax validation
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "wave-runner-01"
          test "$GITHUB_REF_NAME" = "feature/unifiend-liquid-glass-command-ux-20261018"
          test "$GITHUB_REPOSITORY" = "Wave-Runner-2/Build-Platform"
          node --check scripts/oge129_agent_sign_run_command_proof.mjs
      - name: Discover existing Infisical OIDC identity scope
        id: discovery
        shell: bash
        run: bash scripts/infisical-discover-project.sh
      - name: Obtain staging owner authorization from existing Infisical OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ steps.discovery.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true
      - name: Prove signed owner Unifiend Command and fail-closed agent approval
        shell: bash
        run: |
          set -euo pipefail
          node scripts/oge129_agent_sign_run_command_proof.mjs
      - name: Checkpoint proof boundary
        if: always()
        shell: bash
        run: |
          echo "OGE-129 tests signed owner session and Yellow Stone command approval challenge." >> "$GITHUB_STEP_SUMMARY"
          echo "No second owner confirmation, agent dispatch, changes or Certificate write." >> "$GITHUB_STEP_SUMMARY"
