name: Candy Production Deploy via OGENIC OIDC

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - ".github/workflows/candy-production-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}
  CANDY_REPO: Ogenicchocolate21debug/ogenic-chocolate
  CANDY_REF: main
  CF_PROJECT: ogenic-chocolate
  CF_URL: https://ogenic-chocolate.pages.dev/control-center.html

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout OGENIC control repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Auto-discover Infisical project and Cloudflare credential source
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load Cloudflare credentials from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: ${{ steps.infisical_project.outputs.secret_env_slug }}
          secret-path: ${{ steps.infisical_project.outputs.secret_path }}

      - name: Require Cloudflare authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "Cloudflare credentials resolved via OIDC without printing secret values."

      - name: Checkout Candy main
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CANDY_REPO }}
          ref: ${{ env.CANDY_REF }}
          path: candy

      - name: Build Candy static bundle
        shell: bash
        run: |
          set -euo pipefail
          cd candy
          mkdir -p dist/assets
          cp index.html control-center.html chocolate-formulas.json dist/
          cp -R assets/. dist/assets/
          node scripts/build-cloudflare-backup.mjs
          touch dist/.nojekyll
          test -s dist/control-center.html
          echo "Candy bundle ready."

      - name: Deploy Candy to Cloudflare Pages production
        shell: bash
        run: |
          set -euo pipefail
          npx -y wrangler@4.127.1 pages deploy candy/dist \
            --project-name="$CF_PROJECT" \
            --branch=main \
            --commit-dirty=true

      - name: Verify Candy Control Center
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT
          CODE=""
          for attempt in $(seq 1 15); do
            CODE="$(curl -L --silent --show-error --output "$BODY" --write-out '%{http_code}' "$CF_URL")"
            if test "$CODE" = "200" && grep -q 'CANDY CONTROL' "$BODY"; then
              echo "Candy Control Center verified on attempt $attempt."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Candy Control Center verification failed; last HTTP $CODE"
          exit 1
