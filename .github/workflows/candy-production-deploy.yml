name: Candy Production Deploy via OGENIC OIDC

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - ".github/workflows/candy-production-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}
  CANDY_REPO: ${{ vars.CANDY_CANONICAL_REPO || '' }}
  CANDY_REF: main
  CF_PROJECT: ogenic-chocolate
  CF_CONTROL_URL: https://ogenic-chocolate.pages.dev/control-center.html
  CF_STOREFRONT_URL: https://ogenic-chocolate.pages.dev/

jobs:
  deploy:
    # Fail closed until a GH2-owned Candy repository and explicit Owner production permission exist.
    if: github.repository_id == '1429580446' && startsWith(vars.CANDY_CANONICAL_REPO, 'GH-ADDMINPOVIDER/') && vars.CANDY_PRODUCTION_OWNER_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout OGENIC control repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Auto-discover Infisical project and Cloudflare credential source
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load Cloudflare credentials from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: ${{ steps.infisical_project.outputs.secret_env_slug }}
          secret-path: ${{ steps.infisical_project.outputs.secret_path }}

      - name: Require Cloudflare authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "Cloudflare credentials resolved via OIDC without printing secret values."

      - name: Checkout Candy main
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CANDY_REPO }}
          ref: ${{ env.CANDY_REF }}
          path: candy

      - name: Build Candy static bundle
        shell: bash
        run: |
          set -euo pipefail
          cd candy
          mkdir -p dist/assets
          cp index.html control-center.html chocolate-formulas.json storefront-enhance.js control-center-enhance.js dist/
          cp -R assets/. dist/assets/
          node scripts/build-cloudflare-backup.mjs
          python - <<'PY'
          from pathlib import Path
          def inject(path, marker, tag):
              p = Path(path)
              text = p.read_text()
              if marker not in text:
                  text = text.replace('</body>', f'{tag}</body>')
              p.write_text(text)
          inject('dist/index.html', 'storefront-enhance.js', '<script src="/storefront-enhance.js?v=20260907"></script>')
          inject('dist/control-center.html', 'control-center-enhance.js', '<script src="/control-center-enhance.js?v=20260907"></script>')
          PY
          touch dist/.nojekyll
          test -s dist/control-center.html
          test -s dist/storefront-enhance.js
          test -s dist/control-center-enhance.js
          grep -q 'storefront-enhance.js' dist/index.html
          grep -q 'control-center-enhance.js' dist/control-center.html
          echo "Candy storefront + owner dashboards bundle ready."

      - name: Deploy Candy to Cloudflare Pages production
        shell: bash
        run: |
          set -euo pipefail
          npx -y wrangler@4.127.1 pages deploy candy/dist \
            --project-name="$CF_PROJECT" \
            --branch=main \
            --commit-dirty=true

      - name: Verify Candy storefront and Control Center
        shell: bash
        run: |
          set -euo pipefail
          CONTROL="$(mktemp)"
          STORE="$(mktemp)"
          trap 'rm -f "$CONTROL" "$STORE"' EXIT
          for attempt in $(seq 1 15); do
            CONTROL_CODE="$(curl -L --silent --show-error --output "$CONTROL" --write-out '%{http_code}' "$CF_CONTROL_URL")"
            STORE_CODE="$(curl -L --silent --show-error --output "$STORE" --write-out '%{http_code}' "$CF_STOREFRONT_URL")"
            if test "$CONTROL_CODE" = "200" && test "$STORE_CODE" = "200" \
              && grep -q 'control-center-enhance.js' "$CONTROL" \
              && grep -q 'storefront-enhance.js' "$STORE"; then
              curl -L --fail --silent --show-error "${CF_STOREFRONT_URL}bakery-products.json" | jq -e 'type == "array" and length > 0' >/dev/null
              echo "Candy storefront + dual dashboards + live product catalog verified on attempt $attempt."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Candy verification failed; control=$CONTROL_CODE storefront=$STORE_CODE"
          exit 1