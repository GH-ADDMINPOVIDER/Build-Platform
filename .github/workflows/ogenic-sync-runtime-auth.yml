name: OGENIC Sync Runtime Auth from Infisical

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ogenic-sync-runtime-auth.yml"

permissions:
  contents: read
  id-token: write

jobs:
  sync-runtime-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
      INFISICAL_API_URL: ${{ secrets.INFISICAL_API }}
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID || vars.INFISICAL_IDENTITY_ID }}
      INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
      INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENVIRONMENT || 'prod' }}
      VERCEL_PROJECT_ID: prj_lOOm1o5AKF2bi0WfPFdCQ4jtGSqW
      VERCEL_TEAM_ID_FALLBACK: team_bSBITacYbWsQJPDk7VMZ51w6
      OGENIC_REPO: Ogenicchocolate21debug/Build-Platform
      OGENIC_MCP_URL: https://ogenic-control-tower.vercel.app/mcp
      OGENIC_PRODUCTION_URL: https://ogenic-control-tower.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pull Infisical secrets with existing OIDC machine identity when configured
        if: ${{ env.INFISICAL_IDENTITY_ID != '' && env.INFISICAL_PROJECT_SLUG != '' }}
        uses: Infisical/secrets-action@v1
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}

      - name: Resolve provider tokens from existing Infisical auth without printing values
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const preferred = String(process.env.INFISICAL_API_URL || '').trim().replace(/\/$/, '');
          const bases = [...new Set([preferred, 'https://app.infisical.com', 'https://us.infisical.com'].filter(Boolean))];
          const wanted = new Set(['GITHUB_TOKEN', 'VERCEL_ACCESS_TOKEN', 'VERCEL_TEAM_ID']);

          async function loginUniversal(base, clientId, clientSecret) {
            const r = await fetch(base + '/api/v1/auth/universal-auth/login', {
              method: 'POST',
              headers: { 'content-type': 'application/json', Accept: 'application/json' },
              body: JSON.stringify({ clientId, clientSecret }),
            });
            if (!r.ok) throw new Error(`${base} universal-auth -> HTTP ${r.status}`);
            const data = await r.json();
            return data.accessToken || data.token || null;
          }

          async function infFetch(base, token, endpoint) {
            const r = await fetch(base + endpoint, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
            });
            if (!r.ok) throw new Error(`${base} ${endpoint} -> HTTP ${r.status}`);
            return r.json();
          }

          // If the OIDC action already injected the provider secrets, use them directly.
          let gh = process.env.GITHUB_TOKEN || null;
          let vc = process.env.VERCEL_ACCESS_TOKEN || null;
          let team = process.env.VERCEL_TEAM_ID || process.env.VERCEL_TEAM_ID_FALLBACK || null;

          if (!gh || !vc) {
            let accessToken = process.env.INFISICAL_TOKEN || null;
            let base = null;
            const errors = [];

            // Reuse the existing Universal Auth client when no static Infisical token is bridged.
            if (!accessToken && process.env.INFISICAL_CLIENT_ID && process.env.INFISICAL_CLIENT_SECRET) {
              for (const candidate of bases) {
                try {
                  accessToken = await loginUniversal(candidate, process.env.INFISICAL_CLIENT_ID, process.env.INFISICAL_CLIENT_SECRET);
                  if (accessToken) {
                    base = candidate;
                    break;
                  }
                } catch (e) {
                  errors.push(String(e.message || e));
                }
              }
            }

            if (!accessToken) {
              console.error('No usable Infisical bootstrap reached GitHub Actions: OIDC metadata, INFISICAL_TOKEN, and Universal Auth credentials were all unavailable or unusable.');
              process.exit(20);
            }

            let projects = null;
            if (base) {
              try {
                const data = await infFetch(base, accessToken, '/api/v1/projects');
                projects = data.projects;
              } catch (e) {
                errors.push(String(e.message || e));
              }
            }
            if (!projects) {
              for (const candidate of bases) {
                try {
                  const data = await infFetch(candidate, accessToken, '/api/v1/projects');
                  if (Array.isArray(data.projects)) {
                    base = candidate;
                    projects = data.projects;
                    break;
                  }
                } catch (e) {
                  errors.push(String(e.message || e));
                }
              }
            }

            if (!base || !Array.isArray(projects)) {
              console.error('Infisical authentication existed but project discovery failed.');
              console.error(errors.join(' | '));
              process.exit(21);
            }

            const found = new Map();
            outer:
            for (const project of projects) {
              for (const env of project.environments || []) {
                if (!project.id || !env.slug) continue;
                const q = new URLSearchParams({
                  projectId: project.id,
                  environment: env.slug,
                  secretPath: '/',
                  recursive: 'true',
                  viewSecretValue: 'true',
                  expandSecretReferences: 'true',
                });
                try {
                  const data = await infFetch(base, accessToken, `/api/v4/secrets?${q}`);
                  const all = [...(data.secrets || [])];
                  for (const imported of data.imports || []) all.push(...(imported.secrets || []));
                  for (const secret of all) {
                    if (wanted.has(secret.secretKey) && secret.secretValue && !found.has(secret.secretKey)) {
                      found.set(secret.secretKey, secret.secretValue);
                    }
                  }
                  if (found.has('GITHUB_TOKEN') && found.has('VERCEL_ACCESS_TOKEN') && found.has('VERCEL_TEAM_ID')) break outer;
                } catch {
                  // Continue scanning only environments this machine identity can read.
                }
              }
            }

            gh ||= found.get('GITHUB_TOKEN') || null;
            vc ||= found.get('VERCEL_ACCESS_TOKEN') || null;
            team = found.get('VERCEL_TEAM_ID') || team;
          }

          for (const [name, value] of [['GITHUB_TOKEN', gh], ['VERCEL_ACCESS_TOKEN', vc]]) {
            if (!value) {
              console.error(`Required Infisical secret ${name} was not available through the existing machine auth.`);
              process.exit(22);
            }
          }

          console.log(`::add-mask::${gh}`);
          console.log(`::add-mask::${vc}`);
          if (team) console.log(`::add-mask::${team}`);

          fs.appendFileSync(process.env.GITHUB_ENV, `OGENIC_SOURCE_GITHUB_TOKEN=${gh}\n`, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, `OGENIC_SOURCE_VERCEL_TOKEN=${vc}\n`, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, `OGENIC_VERCEL_TEAM_ID=${team}\n`, { mode: 0o600 });
          console.log('Infisical provider credentials resolved. Values were not printed.');
          NODE

      - name: Verify source credentials before syncing
        shell: bash
        run: |
          set -euo pipefail

          gh_code=$(curl -sS -o /tmp/gh.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OGENIC_SOURCE_GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${OGENIC_REPO}")
          if [ "$gh_code" != "200" ]; then
            echo "Infisical GITHUB_TOKEN failed repository verification: HTTP $gh_code"
            exit 30
          fi

          vc_code=$(curl -sS -o /tmp/vc.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OGENIC_SOURCE_VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${OGENIC_VERCEL_TEAM_ID}")
          if [ "$vc_code" != "200" ]; then
            echo "Infisical VERCEL_ACCESS_TOKEN failed project verification: HTTP $vc_code"
            exit 31
          fi

          echo "Provider credential verification passed."

      - name: Link local directory to existing Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/ogenic-control-tower/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$OGENIC_VERCEL_TEAM_ID" "$VERCEL_PROJECT_ID" \
            > apps/ogenic-control-tower/.vercel/project.json

      - name: Sync OGENIC runtime auth into Vercel Production
        shell: bash
        run: |
          set -euo pipefail

          update_or_add() {
            key="$1"
            value="$2"
            if printf '%s' "$value" | npx --yes vercel@59.11.7 env update "$key" production \
                --cwd apps/ogenic-control-tower \
                --token "$OGENIC_SOURCE_VERCEL_TOKEN" \
                --scope "$OGENIC_VERCEL_TEAM_ID" >/dev/null 2>&1; then
              echo "$key updated for Production."
            else
              printf '%s' "$value" | npx --yes vercel@59.11.7 env add "$key" production --sensitive \
                --cwd apps/ogenic-control-tower \
                --token "$OGENIC_SOURCE_VERCEL_TOKEN" \
                --scope "$OGENIC_VERCEL_TEAM_ID" >/dev/null
              echo "$key added for Production."
            fi
          }

          update_or_add OGENIC_GITHUB_TOKEN "$OGENIC_SOURCE_GITHUB_TOKEN"
          update_or_add OGENIC_VERCEL_TOKEN "$OGENIC_SOURCE_VERCEL_TOKEN"

      - name: Redeploy current Production with refreshed runtime auth
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 redeploy "$OGENIC_PRODUCTION_URL" \
            --target=production \
            --token "$OGENIC_SOURCE_VERCEL_TOKEN" \
            --scope "$OGENIC_VERCEL_TEAM_ID" \
            > "$RUNNER_TEMP/ogenic-redeploy-url.txt"
          echo "Production redeploy completed."

      - name: Install MCP client dependencies
        working-directory: apps/ogenic-control-tower
        run: npm ci

      - name: Verify live MCP runtime status
        working-directory: apps/ogenic-control-tower
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Client } from '@modelcontextprotocol/sdk/client/index.js';
          import { StreamableHTTPClientTransport } from '@modelcontextprotocol/sdk/client/streamableHttp.js';

          const client = new Client({ name: 'ogenic-runtime-auth-verifier', version: '1.0.0' });
          try {
            const transport = new StreamableHTTPClientTransport(new URL(process.env.OGENIC_MCP_URL));
            await client.connect(transport);
            const result = await client.callTool({ name: 'get_runtime_status', arguments: {} });
            const data = result.structuredContent;
            const github = data.surfaces.find((s) => s.name === 'GitHub');
            const vercel = data.surfaces.find((s) => s.name === 'Vercel');
            console.log(JSON.stringify({
              verifiedReadyCount: data.verifiedReadyCount,
              GitHub: github?.status || 'missing',
              Vercel: vercel?.status || 'missing',
            }));
            if (github?.status !== 'ready' || vercel?.status !== 'ready' || data.verifiedReadyCount < 2) {
              process.exitCode = 40;
            }
          } finally {
            await client.close().catch(() => {});
          }
          NODE
