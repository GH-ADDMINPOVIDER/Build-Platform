name: OGENIC Sync Runtime Auth v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ogenic-sync-runtime-auth-v2.yml"

permissions:
  contents: read
  id-token: write

jobs:
  sync-runtime-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INFISICAL_IDENTITY_ID: b0962d69-bd33-4ac3-b4f4-48589535ca38
      VERCEL_PROJECT_ID: prj_lOOm1o5AKF2bi0WfPFdCQ4jtGSqW
      VERCEL_TEAM_ID_FALLBACK: team_bSBITacYbWsQJPDk7VMZ51w6
      OGENIC_REPO: Ogenicchocolate21debug/Build-Platform
      OGENIC_MCP_URL: https://ogenic-control-tower.vercel.app/mcp
      OGENIC_PRODUCTION_URL: https://ogenic-control-tower.vercel.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve and verify provider credentials from Infisical
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const base = 'https://app.infisical.com';
          const identityId = process.env.INFISICAL_IDENTITY_ID;
          const repo = process.env.OGENIC_REPO;
          const vercelProjectId = process.env.VERCEL_PROJECT_ID;
          const fallbackTeam = process.env.VERCEL_TEAM_ID_FALLBACK;

          async function getGithubOidcJwt() {
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const token = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!url || !token) throw new Error('GitHub OIDC request variables are unavailable.');
            const r = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
            if (!r.ok) throw new Error(`GitHub OIDC token request failed: HTTP ${r.status}`);
            const data = await r.json();
            if (!data.value) throw new Error('GitHub OIDC response did not include a token.');
            return data.value;
          }

          async function loginInfisical(jwt) {
            const body = new URLSearchParams({ identityId, jwt });
            const r = await fetch(base + '/api/v1/auth/oidc-auth/login', {
              method: 'POST',
              headers: { 'content-type': 'application/x-www-form-urlencoded', Accept: 'application/json' },
              body,
            });
            if (!r.ok) {
              let detail = '';
              try { detail = JSON.stringify(await r.json()); } catch { detail = await r.text(); }
              throw new Error(`Infisical OIDC login failed: HTTP ${r.status} ${detail.slice(0, 300)}`);
            }
            const data = await r.json();
            if (!data.accessToken) throw new Error('Infisical OIDC login returned no access token.');
            return data.accessToken;
          }

          async function infFetch(token, endpoint) {
            const r = await fetch(base + endpoint, { headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' } });
            if (!r.ok) throw new Error(`${endpoint} -> HTTP ${r.status}`);
            return r.json();
          }

          const jwt = await getGithubOidcJwt();
          const accessToken = await loginInfisical(jwt);
          console.log(`::add-mask::${accessToken}`);

          const projectData = await infFetch(accessToken, '/api/v1/projects');
          const projects = Array.isArray(projectData.projects) ? projectData.projects : [];
          if (!projects.length) throw new Error('Machine identity authenticated but no Infisical projects are accessible.');

          const secretMap = new Map();
          let checked = 0;
          for (const project of projects) {
            for (const env of project.environments || []) {
              if (!project.id || !env.slug) continue;
              checked += 1;
              const q = new URLSearchParams({
                projectId: project.id,
                environment: env.slug,
                secretPath: '/',
                recursive: 'true',
                viewSecretValue: 'true',
                expandSecretReferences: 'true',
              });
              try {
                const data = await infFetch(accessToken, `/api/v4/secrets?${q}`);
                const all = [...(data.secrets || [])];
                for (const imported of data.imports || []) all.push(...(imported.secrets || []));
                for (const secret of all) {
                  if (!secret.secretKey || !secret.secretValue) continue;
                  if (!secretMap.has(secret.secretKey)) secretMap.set(secret.secretKey, secret.secretValue);
                }
              } catch {}
            }
          }

          console.log(`Infisical OIDC authenticated; scanned ${checked} accessible project/environment combinations.`);

          const githubCandidateNames = [
            'GITHUB_TOKEN',
            'Github_Secret',
            ...[...secretMap.keys()].filter((k) => /github/i.test(k)),
          ].filter((v, i, a) => a.indexOf(v) === i);

          let githubToken = null;
          let githubSource = null;
          for (const key of githubCandidateNames) {
            const value = secretMap.get(key);
            if (!value) continue;
            console.log(`::add-mask::${value}`);
            const r = await fetch(`https://api.github.com/repos/${repo}`, {
              headers: {
                Authorization: `Bearer ${value}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            if (r.status === 200) {
              githubToken = value;
              githubSource = key;
              break;
            }
          }

          if (!githubToken) {
            console.error(`No Infisical GitHub credential could access ${repo}. Tested ${githubCandidateNames.filter((k) => secretMap.has(k)).length} candidate key(s) without printing values.`);
            process.exit(30);
          }
          console.log(`GitHub credential verified from Infisical key: ${githubSource}`);

          const vercelToken = secretMap.get('VERCEL_ACCESS_TOKEN');
          const team = secretMap.get('VERCEL_TEAM_ID') || fallbackTeam;
          if (!vercelToken) {
            console.error('VERCEL_ACCESS_TOKEN is missing from accessible Infisical secrets.');
            process.exit(31);
          }
          console.log(`::add-mask::${vercelToken}`);
          if (team) console.log(`::add-mask::${team}`);

          const vr = await fetch(`https://api.vercel.com/v9/projects/${vercelProjectId}?teamId=${encodeURIComponent(team)}`, {
            headers: { Authorization: `Bearer ${vercelToken}` },
          });
          if (vr.status !== 200) {
            console.error(`VERCEL_ACCESS_TOKEN verification failed: HTTP ${vr.status}`);
            process.exit(32);
          }
          console.log('Vercel credential verified.');

          fs.appendFileSync(process.env.GITHUB_ENV, `OGENIC_SOURCE_GITHUB_TOKEN=${githubToken}\n`, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, `OGENIC_SOURCE_VERCEL_TOKEN=${vercelToken}\n`, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, `OGENIC_VERCEL_TEAM_ID=${team}\n`, { mode: 0o600 });
          NODE

      - name: Link existing Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/ogenic-control-tower/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$OGENIC_VERCEL_TEAM_ID" "$VERCEL_PROJECT_ID" > apps/ogenic-control-tower/.vercel/project.json

      - name: Sync Production runtime auth
        shell: bash
        run: |
          set -euo pipefail
          update_or_add() {
            key="$1"; value="$2"
            if printf '%s' "$value" | npx --yes vercel@59.11.7 env update "$key" production --cwd apps/ogenic-control-tower --token "$OGENIC_SOURCE_VERCEL_TOKEN" --scope "$OGENIC_VERCEL_TEAM_ID" >/dev/null 2>&1; then
              echo "$key updated."
            else
              printf '%s' "$value" | npx --yes vercel@59.11.7 env add "$key" production --sensitive --cwd apps/ogenic-control-tower --token "$OGENIC_SOURCE_VERCEL_TOKEN" --scope "$OGENIC_VERCEL_TEAM_ID" >/dev/null
              echo "$key added."
            fi
          }
          update_or_add OGENIC_GITHUB_TOKEN "$OGENIC_SOURCE_GITHUB_TOKEN"
          update_or_add OGENIC_VERCEL_TOKEN "$OGENIC_SOURCE_VERCEL_TOKEN"

      - name: Redeploy Production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 redeploy "$OGENIC_PRODUCTION_URL" --target=production --token "$OGENIC_SOURCE_VERCEL_TOKEN" --scope "$OGENIC_VERCEL_TEAM_ID" > "$RUNNER_TEMP/redeploy-url.txt"
          echo "Production redeploy completed."

      - name: Install MCP client dependencies
        working-directory: apps/ogenic-control-tower
        run: npm ci

      - name: Verify live MCP runtime status
        working-directory: apps/ogenic-control-tower
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Client } from '@modelcontextprotocol/sdk/client/index.js';
          import { StreamableHTTPClientTransport } from '@modelcontextprotocol/sdk/client/streamableHttp.js';
          const client = new Client({ name: 'ogenic-runtime-auth-verifier', version: '1.0.0' });
          try {
            const transport = new StreamableHTTPClientTransport(new URL(process.env.OGENIC_MCP_URL));
            await client.connect(transport);
            const result = await client.callTool({ name: 'get_runtime_status', arguments: {} });
            const data = result.structuredContent;
            const github = data.surfaces.find((s) => s.name === 'GitHub');
            const vercel = data.surfaces.find((s) => s.name === 'Vercel');
            console.log(JSON.stringify({ verifiedReadyCount: data.verifiedReadyCount, GitHub: github?.status, Vercel: vercel?.status }));
            if (github?.status !== 'ready' || vercel?.status !== 'ready' || data.verifiedReadyCount < 2) process.exitCode = 40;
          } finally {
            await client.close().catch(() => {});
          }
          NODE
