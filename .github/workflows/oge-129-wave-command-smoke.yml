name: OGE-129 WAVE Command Connector Smoke
on:
  push:
    branches: [feature/wave-liquid-glass-command-ux-20261018]
    paths:
      - ".github/workflows/oge-129-wave-command-smoke.yml"
      - "scripts/oge129_wave_command_connections_smoke.mjs"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
  issues: write
jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
      INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
      INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
      INFISICAL_ENV_SLUG: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Host scope and command policy tests
        run: |
          test "$RUNNER_NAME" = wave-runner-01
          test "$GITHUB_REF_NAME" = feature/wave-liquid-glass-command-ux-20261018
          node --check scripts/oge129_wave_command_connections_smoke.mjs
          node --test tests/wave-command-contract.test.mjs tests/wave-terminal-solo-contract.test.mjs
      - name: Resolve existing Infisical project
        id: discovery
        run: bash scripts/infisical-discover-project.sh
      - name: Authorize staging proof through existing OIDC identity
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ steps.discovery.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true
      - name: Bind canonical staging D1 read credentials using proven Infisical source
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ steps.discovery.outputs.project_slug }}
          env-slug: ${{ steps.discovery.outputs.secret_env_slug }}
          secret-path: ${{ steps.discovery.outputs.secret_path }}
      - name: Check live WAVE and Connector gateway with no workflow dispatch
        run: node scripts/oge129_wave_command_connections_smoke.mjs
      - name: Explain smoke scope
        if: always()
        run: |
          echo "OGE-129 read-only Command gateway probe. No deploy, no owner-approved writes, no new services." >> "$GITHUB_STEP_SUMMARY"
