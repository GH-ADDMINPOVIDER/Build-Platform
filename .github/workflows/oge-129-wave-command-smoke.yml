name: OGE-129 WAVE Command Connector Smoke
on:
  push:
    branches: [feature/wave-liquid-glass-command-ux-20261018, phase-vi-provider-incentive-metering]
    paths:
      - ".github/workflows/oge-129-wave-command-smoke.yml"
      - "scripts/oge129_wave_command_connections_smoke.mjs"
      - "scripts/oge129_owner_live_e2e.mjs"
      - "scripts/verify-openbot-launchroom-staging.mjs"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
  issues: write
jobs:
  smoke:
    if: github.ref_name == 'feature/wave-liquid-glass-command-ux-20261018'
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
      INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
      INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
      INFISICAL_ENV_SLUG: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Host scope and command policy tests
        run: |
          test "$RUNNER_NAME" = wave-runner-01
          test "$GITHUB_REF_NAME" = feature/wave-liquid-glass-command-ux-20261018
          node --check scripts/oge129_wave_command_connections_smoke.mjs
          node --test tests/wave-command-contract.test.mjs tests/wave-terminal-solo-contract.test.mjs
      - name: Resolve existing Infisical project
        id: discovery
        run: bash scripts/infisical-discover-project.sh
      - name: Authorize staging proof through existing OIDC identity
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ steps.discovery.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true
      - name: Bind canonical staging D1 read credentials using proven Infisical source
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ steps.discovery.outputs.project_slug }}
          env-slug: ${{ steps.discovery.outputs.secret_env_slug }}
          secret-path: ${{ steps.discovery.outputs.secret_path }}
      - name: Check live WAVE and Connector gateway with no workflow dispatch
        run: node scripts/oge129_wave_command_connections_smoke.mjs
      - name: Explain smoke scope
        if: always()
        run: |
          echo "OGE-129 read-only Command gateway probe. No deploy, no owner-approved writes, no new services." >> "$GITHUB_STEP_SUMMARY"

  owner-staging-e2e:
    if: github.repository == 'Ogenicchocolate21debug/Build-Platform' && github.ref_name == 'phase-vi-provider-incentive-metering'
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 8
    concurrency:
      group: oge129-readonly-one-owner-command
      cancel-in-progress: true
    env:
      STAGING_URL: https://wave.ogenicchocolate.com
      GH_TOKEN: ${{ github.token }}
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
      INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
      INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
      INFISICAL_PROJECT_SLUG: ogenic-sio-ti-rv
      INFISICAL_ENV_SLUG: staging
      INFISICAL_CLOUDFLARE_SOURCE_ENV: staging
      INFISICAL_CLOUDFLARE_SOURCE_PATH: /
      INFISICAL_CLOUDFLARE_PROJECT_ID: e8cfba67-ea99-4d79-bc9f-87b862f9129c
      INFISICAL_CLOUDFLARE_PROJECT_SLUG: ogenic-sio-ti-rv
    steps:
      - name: Checkout exact staging SHA without storing credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Enforce one existing Runner-1 and lint real command proof
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = wave-runner-01
          test "$GITHUB_REF_NAME" = phase-vi-provider-incentive-metering
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/oge129_owner_live_e2e.mjs
          node --check scripts/wave-command-consumer.mjs
          node --test tests/wave-terminal-solo-contract.test.mjs
      - name: Resolve existing staging Infisical project
        id: discovery
        shell: bash
        run: bash scripts/infisical-discover-project.sh
      - name: Use existing Owner authorization via Infisical OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ steps.discovery.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true
      - name: Prove real OpenBot Launch Room through existing Codex and D1
        if: contains(github.event.head_commit.message, 'openbot')
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-openbot-launchroom-staging.mjs
          node scripts/verify-openbot-launchroom-staging.mjs
      - name: Submit or reuse the original read-only Owner command
        if: ${{ !contains(github.event.head_commit.message, 'openbot') }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/oge129_owner_live_e2e.mjs
      - name: Preserve truthful result boundary
        if: always()
        run: |
          echo 'OGE-129 sends one existing owner-authorized Codex CLI command in read-only sandbox. No extra provider API spending, new service, second runner or production change.' >> "$GITHUB_STEP_SUMMARY"
