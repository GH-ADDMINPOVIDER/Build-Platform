name: Unifiend Liquid Glass Command UX - feature proof
on:
  push:
    branches:
      - feature/unifiend-liquid-glass-command-ux-20261018
    paths:
      - ".github/workflows/unifiend-liquid-glass-command-ux-proof.yml"
      - "src/UnifiendNext.tsx"
      - "src/Landing.tsx"
      - "src/StoneCircuitDiagram.tsx"
      - "src/stone-circuit-diagram.css"
      - "src/landing.css"
      - "src/unifiend-theme.css"
      - "src/main.tsx"
      - "worker/app-auth.ts"
      - "tests/unifiend-liquid-glass-command-ux.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unifiend-glass-ux-feature-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ux-proof:
    if: github.repository_id == '1429580446'
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 25
    steps:
      - name: Checkout exact feature SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verified repository dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Feature contract checks
        run: node --test tests/unifiend-liquid-glass-command-ux.test.mjs tests/unifiend-next-ui.test.mjs tests/landing-phase2-ui.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Summarize verification
        if: success()
        run: |
          echo "### Unifiend Liquid Glass UX feature proof" >> "$GITHUB_STEP_SUMMARY"
          echo "- Feature branch only · no staging deploy or production mutation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contract tests, Typecheck and Build: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Owner Session renewal is signed/cookie-based; no stored Owner Key" >> "$GITHUB_STEP_SUMMARY"
          echo "- Guarded commands retain Yellow Stone owner approval" >> "$GITHUB_STEP_SUMMARY"
