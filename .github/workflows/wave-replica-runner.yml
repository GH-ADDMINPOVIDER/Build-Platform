name: Stone Runner - Runtime + GitHub Context Proof

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - ".github/workflows/wave-replica-runner.yml"
      - "scripts/replica-runner/**"
      - "tests/oge95-factory-core.test.mjs"
      - "tests/oge95-athena-runner-context.test.mjs"
      - "tests/oge99-declared-parity-matrix.test.mjs"
      - "config/oge95-rules-center.json"
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "After Replica local proof passes, explicitly dispatch EXISTING staging deploy?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: wave-replica-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  ephemeral-replica:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 30
    steps:
      - name: Checkout exact staging SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 25
      - name: Match production build Node major
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact dependencies with disposable lock
        run: npm install --package-lock-only --ignore-scripts && npm ci
      - name: Run canonical test, typecheck and build
        run: npm run check
      - name: Sanitize build into isolated Replica
        run: node scripts/replica-runner/prepare.mjs
      - name: Create local D1 only; apply SAME source migrations
        env:
          PERSIST_DIR: ${{ runner.temp }}/wave-replica-d1
        shell: bash
        run: |
          set -euo pipefail
          printf "y\\n" | npx wrangler d1 migrations apply wave-replica-local \
            --config dist/ogenic_phase_vi_staging/replica.wrangler.json \
            --local --persist-to "$PERSIST_DIR"
          echo 'D1_MIGRATIONS_LOCAL_PASS'
      - name: Boot same built Worker bundle in local workerd, probe WAVE routes
        shell: bash
        env:
          REPLICA_DB_MIGRATED: "true"
          PERSIST_DIR: ${{ runner.temp }}/wave-replica-d1
        run: |
          set -euo pipefail
          # Disposable, synthetic local test credential; never a staging/production secret.
          TEST_OPS_KEY="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("hex"))')"
          export REPLICA_TEST_OPS_KEY="$TEST_OPS_KEY"
          # Run in an isolated process group so restart cannot accidentally reuse an orphan workerd.
          setsid npx wrangler dev \
            --config dist/ogenic_phase_vi_staging/replica.wrangler.json \
            --local --ip 127.0.0.1 --port 8787 \
            --var "OGENIC_OPS_KEY:$TEST_OPS_KEY" \
            --persist-to "$PERSIST_DIR" \
            > "$RUNNER_TEMP/replica-workerd.log" 2>&1 &
          PID=$!
          trap 'kill -TERM -- "-$PID" 2>/dev/null || true' EXIT
          if ! node scripts/replica-runner/verify.mjs; then
            echo '::error::Local Replica parity proof failed; sanitized tail follows'
            tail -n 40 "$RUNNER_TEMP/replica-workerd.log" | sed -E 's/(sk-[[:alnum:]_-]{12,}|gh[pousr]_[[:alnum:]]{12,})/[REDACTED]/g'
            exit 1
          fi
          node scripts/replica-runner/verify-1lss.mjs
          node scripts/replica-runner/compare.mjs
          node scripts/replica-runner/verify-ccs.mjs
          # OGE-96: force a genuine process teardown and boot from the SAME persistent local D1.
          kill -TERM -- "-$PID"
          wait "$PID" 2>/dev/null || true
          PORT_CLOSED=false
          for i in $(seq 1 20); do
            if curl --silent --max-time 1 --output /dev/null http://127.0.0.1:8787/; then sleep 0.25; else PORT_CLOSED=true; break; fi
          done
          test "$PORT_CLOSED" = true || { echo "::error::Old workerd still listening; restart proof invalid"; exit 1; }
          setsid npx wrangler dev \
            --config dist/ogenic_phase_vi_staging/replica.wrangler.json \
            --local --ip 127.0.0.1 --port 8787 \
            --var "OGENIC_OPS_KEY:$TEST_OPS_KEY" \
            --persist-to "$PERSIST_DIR" \
            > "$RUNNER_TEMP/replica-workerd-restart.log" 2>&1 &
          PID=$!
          node scripts/replica-runner/verify-1lss-restart.mjs
          node --test tests/oge99-declared-parity-matrix.test.mjs
          node scripts/replica-runner/parity-matrix.mjs
      - name: Restore Stone Runner context from prior GitHub artifact
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("wave-athena-context-")) | .workflow_run.id' \
            2>/dev/null | head -n 1 || true)"
          if test -n "$RUN_ID" && test "$RUN_ID" != "$GITHUB_RUN_ID"; then
            mkdir -p "$RUNNER_TEMP/athena-previous"
            if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "wave-athena-context-$RUN_ID" --dir "$RUNNER_TEMP/athena-previous" >/dev/null 2>&1; then
              if test -f "$RUNNER_TEMP/athena-previous/athena-runner-context.json"; then
                cp "$RUNNER_TEMP/athena-previous/athena-runner-context.json" athena-previous-context.json
                echo "ATHENA_PREVIOUS_CONTEXT_LOADED from run $RUN_ID"
              fi
            fi
          fi
      - name: Build Stone Runner commit-deploy context and next-action evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --test tests/oge95-athena-runner-context.test.mjs
          node scripts/replica-runner/athena-context.mjs
      - name: Save Stone Runner context for future coding Agent resumes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-athena-context-${{ github.run_id }}
          path: athena-runner-context.json
          retention-days: 30
          if-no-files-found: warn
      - name: Upload parity evidence (no secrets, no D1 content)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-replica-local-proof-${{ github.run_id }}
          path: |
            replica-evidence.json
            replica-1lss-evidence.json
            replica-1lss-restart-evidence.json
            oge99-declared-parity-matrix.json
            oge97-local-ccs-evidence.json
          retention-days: 14
          if-no-files-found: warn
      - name: Publish honest parity measurement
        if: always()
        shell: bash
        run: |
          {
            echo '### Stone Runner'
            if test -f replica-evidence.json; then
              jq '{status,local_checks_passed,local_checks_total,target_parity,certified_parity_ratio,real_cloudflare_deploy,provider_inference_calls,source_sha}' replica-evidence.json
              echo '- This validates local surfaces, NOT yet a 90% measured staging equivalence.'
              jq '.staging_comparison | {status,tests_matched,tests_total,surface_match_ratio,certified_full_runtime_parity}' replica-evidence.json
            else
              echo '- BLOCKED: local proof did not produce evidence.'
            fi
            echo '- No paid inference, no remote D1 or staging mutation during Replica proof.'
            if test -f replica-1lss-evidence.json; then
              echo '### Local stateful 1LSS proof (synthetic data)'
              jq '{status,checks_passed,checks_total,unique_inserted,duplicate_retry_prevented,source_surfaces,remote_d1_access}' replica-1lss-evidence.json
            fi
            if test -f replica-1lss-restart-evidence.json; then
              echo '### Local D1 persistence after actual workerd restart'
              jq '{status,checks_passed,checks_total,expected_sequence,remote_d1_access}' replica-1lss-restart-evidence.json
            fi
            if test -f oge97-local-ccs-evidence.json; then
              echo '### OGE-97 — Local CCS policy/transition HTTP proof'
              jq '{status,checks_passed,checks_total,actual_lease_persisted,real_tool_invoked} ' oge97-local-ccs-evidence.json
            fi
            if test -f oge99-declared-parity-matrix.json; then
              echo '### OGE-99 — Declared Parity Matrix (honest partial proof)'
              jq '{result,source_sha,verified_domain_count,not_tested_domain_count,full_operational_1_to_1_certified,ready_to_close_stone_phase}' oge99-declared-parity-matrix.json
            fi
            if test -f athena-runner-context.json; then
              echo '### Stone Runner (commit / CI / deploy context)'
              jq '{source_sha,context_id,github_api_state,local_runtime,suggested_actions}' athena-runner-context.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Explicit staging deployment handoff only on manual approval
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.deploy_staging == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(jq -r '.status' replica-evidence.json)" = LOCAL_PROOF_PASS
          CURRENT="$(gh api 'repos/${{ github.repository }}/git/ref/heads/phase-vi-provider-incentive-metering' --jq '.object.sha')"
          test "$CURRENT" = "$GITHUB_SHA" || {
            echo '::error::staging HEAD moved since Replica proof; refuse to deploy untested head'
            exit 1
          }
          gh workflow run provider-incentive-staging-deploy.yml \
            --repo "$GITHUB_REPOSITORY" --ref phase-vi-provider-incentive-metering
          echo 'Existing protected staging deploy workflow dispatched after explicit manual selection.'
