name: GH2 WAVE Operations D1 Event Watch to Discord
on:
  push:
    branches: [feat/ccs-multi-protocol-docker-20261023]
    paths:
      - 'scripts/gh2-wave-ops-event-watch.mjs'
      - '.github/workflows/gh2-wave-ops-event-watch.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  owner-notification-readback:
    if: github.repository == 'Wave-Runner-2/Build-Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
      INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || 'ogenic-sio-ti-rv' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: staging
          secret-path: /
          recursive: false
      - name: Notify Owner from actual WAVE D1 metadata, receipt on both Discord channels
        run: node scripts/gh2-wave-ops-event-watch.mjs
      - name: Scope of proof
        if: always()
        run: echo 'GH2_STAGING_PUSH_ONLY; NO_STATUSPAGE_RESOLVED; NO_PRIVATE_D1_CONTENT; NO_7_OF_7_CLAIM'
