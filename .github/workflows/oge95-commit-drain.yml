name: OGE-95 Commit Drain - Continuous Staging Catchup

# Called by the existing, proven OGE-95 staging push Workflow.
# Intermediate push events can be coalesced by GitHub concurrency;
# audit first-parent backlog from verified artifact checkpoints.
on:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: oge95-staging-commit-drain
  cancel-in-progress: false

jobs:
  drain:
    name: Audit staging commits until the triggered HEAD is fully caught up
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    steps:
      - name: Full history, pinned exact event SHA, ephemeral checkout credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate branch identity and bind head to the event SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Ogenicchocolate21debug/Build-Platform"
          test "$GITHUB_REF_NAME" = "phase-vi-provider-incentive-metering"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e '9be0a339016ebf23a3a5f4108aaab56af19bd93a^{commit}'
          git update-ref refs/remotes/origin/phase-vi-provider-incentive-metering "$GITHUB_SHA"
      - name: Recover last audited checkpoint (fail closed if artifact retrieval fails)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100")"
          ID="$(printf '%s' "$JSON" | jq -r '
            [.artifacts[]? | select(.expired == false and (.name | test("^oge95-commit-drain-ledger-[0-9]+-[0-9]+$")))]
            | sort_by(.created_at,.id) | last | .id // empty
          ')"
          if [[ "$ID" =~ ^[0-9]+$ ]]; then
            curl --fail --silent --show-error --location --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" \
              --output "$RUNNER_TEMP/oge95-prior.zip"
            unzip -p "$RUNNER_TEMP/oge95-prior.zip" oge95-commit-drain-receipt.json > oge95-prior-drain-receipt.json
            test -s oge95-prior-drain-receipt.json
            PRIOR_SCHEMA="$(jq -r '.schema' oge95-prior-drain-receipt.json)"
            if test "$PRIOR_SCHEMA" = "OGE95_GITHUB_COMMIT_DRAIN_V1"; then
              # V1 used bare npm ci; those FAIL receipts are not a fair
              # source-code check. Keep history artifact, re-audit from bootstrap.
              mv oge95-prior-drain-receipt.json "$RUNNER_TEMP/oge95-prior-v1-superseded.json"
              echo "OGE95_DRAIN_V2_REAUDIT_ALL_PREVIOUS_NPM_LOCK_FAILURES"
            elif test "$PRIOR_SCHEMA" = "OGE95_GITHUB_COMMIT_DRAIN_V2"; then
              echo "OGE95_DRAIN_RESUMING_FROM_LAST_ARTIFACT"
            else
              echo "OGE95_DRAIN_UNKNOWN_CHECKPOINT_SCHEMA"
              exit 2
            fi
          else
            echo "OGE95_DRAIN_BOOTSTRAP_FROM_KNOWN_GOOD_CI_SHA"
          fi
      - name: Unit-test backlog ordering, SHA and historical-Fail classification
        run: node --test tests/oge95-commit-drain.test.mjs tests/oge95-drain-finalize.test.mjs
      - name: Process EVERY unseen source commit without manual re-trigger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oge95-commit-drain-batches
          if test -s oge95-prior-drain-receipt.json; then
            cp oge95-prior-drain-receipt.json oge95-inherited-checkpoint.json
          fi
          N=0
          FAILED=0
          while true; do
            if test -s oge95-prior-drain-receipt.json; then
              node scripts/oge95-commit-drain.mjs plan --previous=oge95-prior-drain-receipt.json
            else
              node scripts/oge95-commit-drain.mjs plan
            fi
            node scripts/oge95-commit-drain.mjs execute
            N=$((N+1))
            cp oge95-commit-drain-receipt.json "oge95-commit-drain-batches/batch-$N.json"
            cp oge95-commit-drain-receipt.json oge95-prior-drain-receipt.json
            MISSING="$(jq -r '.remaining_at_plan' oge95-commit-drain-receipt.json)"
            LAST="$(jq -r '.last_processed_sha' oge95-commit-drain-receipt.json)"
            HEAD="$(jq -r '.head_sha' oge95-commit-drain-receipt.json)"
            BAD="$(jq -r '.failed_shas | length' oge95-commit-drain-receipt.json)"
            FAILED=$((FAILED+BAD))
            echo "OGE95_DRAIN_PROGRESS batch=$N remaining=$MISSING failed_to_date=$FAILED"
            if test "$MISSING" -eq 0 && test "$LAST" = "$HEAD"; then
              echo "OGE95_DRAIN_ALL_KNOWN_COMMITS_AUDITED"
              break
            fi
            if test "$MISSING" -eq 0; then
              echo "OGE95_DRAIN_STALLED_NO_PROGRESS"
              exit 2
            fi
          done
          echo "$FAILED" > oge95-commit-drain-failed-count.txt
          if test -s oge95-inherited-checkpoint.json; then
            node scripts/oge95-drain-finalize.mjs \
              --head="$GITHUB_SHA" \
              --dir=oge95-commit-drain-batches \
              --prior=oge95-inherited-checkpoint.json \
              --output=oge95-commit-drain-final.json
          else
            node scripts/oge95-drain-finalize.mjs \
              --head="$GITHUB_SHA" \
              --dir=oge95-commit-drain-batches \
              --output=oge95-commit-drain-final.json
          fi
      - name: Upload all batch receipts with resume checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: oge95-commit-drain-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            oge95-commit-drain-plan.json
            oge95-commit-drain-receipt.json
            oge95-commit-drain-batches/
            oge95-commit-drain-failed-count.txt
            oge95-commit-drain-final.json
          retention-days: 30
          if-no-files-found: warn
      - name: Verify current HEAD, retain historical FAILs without claiming they passed
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if ! test -s oge95-commit-drain-final.json; then
            echo "OGE95_DRAIN_FINAL_EVIDENCE_MISSING"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const r=JSON.parse(readFileSync("oge95-commit-drain-final.json","utf8"));
          if(r.schema!=="OGE95_COMMIT_DRAIN_FINAL_V1" ||
             r.repository!=="Ogenicchocolate21debug/Build-Platform" ||
             r.branch!=="phase-vi-provider-incentive-metering" ||
             r.head_sha!==process.env.GITHUB_SHA ||
             r.last_processed_sha!==process.env.GITHUB_SHA ||
             r.all_commits_accounted_for!==true ||
             r.historical_results_rewritten!==false ||
             r.authority_to_commit!==false ||
             r.authority_to_deploy!==false)
            throw Error("CURRENT_HEAD_ATTESTATION_MISSING_OR_TAMPERED");
          console.log("OGE95_HISTORICAL_FAIL_RECEIPTS_RETAINED="+r.historical_failed_shas.length);
          console.log("OGE95_NEWLY_AUDITED="+r.newly_audited_count);
          if(!r.current_head_healthy){
            console.error("OGE95_CURRENT_HEAD_NOT_GREEN "+r.state);
            process.exitCode=1;
          }else{
            console.log("OGE95_CURRENT_HEAD_PASS_HISTORICAL_FAILS_NOT_REWRITTEN");
          }
          NODE
