name: OGE-28 GH-2 and GS existing self-host MCP readiness proof
on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths: [.github/workflows/oge-28-runner2-host-capability.yml]
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  runner2_probe:
    if: github.repository == 'Ogenicchocolate21debug/Build-Platform' && contains(fromJSON('["Ogenicchocolate21debug","Wave-Runner-2"]'), github.actor)
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 8
    steps:
      - name: Probe existing host and second-runner service without changing state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'OGE28_RUNNER2_HOST_CAPABILITY_BEGIN'
          echo "WORKFLOW_RUNNER=$RUNNER_NAME"
          echo "HOSTNAME=$(hostname)"
          echo "HOST_UID=$(id -u)"
          echo "HOST_GROUPS=$(id -Gn)"
          echo "STAGING_SHA=$GITHUB_SHA"
          if sudo -n true >/dev/null 2>&1; then
            echo HOST_NONINTERACTIVE_SUDO=YES
          else
            echo HOST_NONINTERACTIVE_SUDO=NO
          fi
          if command -v systemctl >/dev/null 2>&1; then
            systemctl --no-pager list-units --all --type=service 2>/dev/null | grep -E 'actions.runner|github.runner' | sed -E 's/[[:space:]]+/ /g' | cut -c1-200 || true
          fi
          for dir in /opt/wave/actions-runner /opt/wave/actions-runner-2 /opt/wave/runner-2 /home/wave/actions-runner-2; do
            if test -d "$dir"; then
              echo "RUNNER_DIRECTORY_EXISTS=$dir"
              if test -e "$dir/.runner"; then echo "RUNNER_REGISTRATION_FILE_PRESENT=$dir"; fi
              if test -x "$dir/config.sh"; then echo "RUNNER_BINARY_PRESENT=$dir"; fi
            fi
          done
          if command -v docker >/dev/null 2>&1 && timeout 8 docker info --format '{{.ServerVersion}}' >/dev/null 2>&1; then
            echo HOST_DOCKER_ACCESS=YES
          else
            echo HOST_DOCKER_ACCESS=NO
          fi
          if timeout 8 env -u GH_TOKEN -u GITHUB_TOKEN gh auth status >/dev/null 2>&1; then
            echo HOST_STORED_GITHUB_CLI_AUTH=YES
          else
            echo HOST_STORED_GITHUB_CLI_AUTH=NO
          fi
          # The job-scoped Actions token generally lacks repo administration. Probe only response status, not credentials.
          if timeout 12 gh api "repos/$GITHUB_REPOSITORY/actions/runners" --jq '.runners[] | [.id,.name,.status,.busy] | @tsv' > "$RUNNER_TEMP/oge28-runners-list" 2>/dev/null; then
            echo GITHUB_RUNNER_LIST_API=AVAILABLE
            cat "$RUNNER_TEMP/oge28-runners-list"
          else
            echo GITHUB_RUNNER_LIST_API=INSUFFICIENT_SCOPE_OR_UNAVAILABLE
          fi
          if timeout 12 env -u GH_TOKEN -u GITHUB_TOKEN gh api "repos/$GITHUB_REPOSITORY/actions/runners" --jq '.runners[] | [.id,.name,.status,.busy] | @tsv' > "$RUNNER_TEMP/oge28-runners-stored" 2>/dev/null; then
            echo STORED_ACCOUNT_RUNNER_LIST_API=AVAILABLE
            cat "$RUNNER_TEMP/oge28-runners-stored"
          else
            echo STORED_ACCOUNT_RUNNER_LIST_API=INSUFFICIENT_SCOPE_OR_UNAVAILABLE
          fi
          # Read-only capability receipt for existing GH-2-triggered workflow
          # vs host-local identities. A GitHub Actions actor is not a local login.
          test "${RUNNER_NAME:-}" = wave-runner-01
          echo "SELFHOST_RUNNER1=VERIFIED"
          if test "${GITHUB_ACTOR:-}" = Wave-Runner-2; then
            echo "GH2_ACTIONS_ACTOR=VERIFIED"
          else
            echo "GH2_ACTIONS_ACTOR=NOT_THIS_RUN"
          fi
          if command -v codex >/dev/null 2>&1; then
            echo "GS_CODEX_CLI_INSTALLED=YES"
            if env -u OPENAI_API_KEY -u CODEX_API_KEY CODEX_HOME=/home/wave/.codex timeout 12 codex login status >/dev/null 2>&1; then
              echo "GS_CODEX_LOCAL_LOGIN=SIGNED_IN"
            else
              echo "GS_CODEX_LOCAL_LOGIN=NOT_VERIFIED"
            fi
          else
            echo "GS_CODEX_CLI_INSTALLED=NO"
          fi
          if command -v copilot >/dev/null 2>&1; then
            echo "COPILOT_CLI_INSTALLED=YES"
            if COPILOT_AUTO_UPDATE=false timeout 12 copilot version >/dev/null 2>&1; then
              echo "COPILOT_CLI_COMMAND=WORKING"
            else
              echo "COPILOT_CLI_COMMAND=NOT_VERIFIED"
            fi
          else
            echo "COPILOT_CLI_INSTALLED=NO"
          fi
          if test -f "$HOME/.copilot/mcp-config.json"; then
            echo "COPILOT_USER_MCP_CONFIG=PRESENT"
            # Read only syntactic validity; never print server headers, URLs,
            # secret values or raw config from the runner account.
            if node -e 'JSON.parse(require("node:fs").readFileSync(process.env.HOME+"/.copilot/mcp-config.json","utf8"))' >/dev/null 2>&1; then
              echo "COPILOT_USER_MCP_CONFIG_SYNTAX=VALID"
            else
              echo "COPILOT_USER_MCP_CONFIG_SYNTAX=INVALID"
            fi
          else
            echo "COPILOT_USER_MCP_CONFIG=ABSENT"
          fi
          if command -v gh >/dev/null 2>&1; then
            # The runner can have a stored GH1 account even when GH2 pushes.
            # Unset job-token aliases to avoid misidentifying Github Actions.
            stored_login="$(env -u GH_TOKEN -u GITHUB_TOKEN -u COPILOT_GITHUB_TOKEN timeout 12 gh api user --jq .login 2>/dev/null || true)"
            if test "$stored_login" = Wave-Runner-2; then
              echo "GH2_HOST_LOCAL_GH_AUTH=VERIFIED"
            elif test -n "$stored_login"; then
              echo "GH2_HOST_LOCAL_GH_AUTH=OTHER_ACCOUNT"
            else
              echo "GH2_HOST_LOCAL_GH_AUTH=NOT_VERIFIED"
            fi
          else
            echo "GH2_HOST_LOCAL_GH_AUTH=GH_CLI_NOT_INSTALLED"
          fi
          echo "MCP_PROBE_SCOPE=READ_ONLY_NO_INSTALL_NO_TOKEN_OUTPUT"
          echo OGE28_RUNNER2_HOST_CAPABILITY_END
      - name: Install Copilot CLI user-local only for GH-2 on existing Runner-1
        if: github.actor == 'Wave-Runner-2'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = wave-runner-01
          test "$GITHUB_REPOSITORY" = Ogenicchocolate21debug/Build-Platform
          test "$GITHUB_REF_NAME" = phase-vi-provider-incentive-metering
          test "$GITHUB_ACTOR" = Wave-Runner-2
          test "$HOME" = /home/wave
          umask 077
          bin="$HOME/.local/bin/copilot"
          if test -x "$bin" && timeout 15 "$bin" --version >/dev/null 2>&1; then
            echo "GH2_COPILOT_USERLOCAL_INSTALL=ALREADY_PRESENT"
          else
            if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
              echo "GH2_COPILOT_INSTALL=BLOCKED_NODE_NPM_UNAVAILABLE"
              exit 80
            fi
            if ! node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 22 ? 0 : 1)'; then
              echo "GH2_COPILOT_INSTALL=BLOCKED_NODE_BELOW_22"
              exit 81
            fi
            mkdir -p "$HOME/.local"
            # Use only GitHub's official npm package. Do not run Copilot with
            # GITHUB_TOKEN, load another account's auth, or install a daemon.
            if ! timeout 240 npm install -g --prefix "$HOME/.local" \
                --no-audit --no-fund --silent @github/copilot \
                > "$RUNNER_TEMP/ogenic-copilot-install.log" 2>&1; then
              echo "GH2_COPILOT_INSTALL=FAILED_NETWORK_OR_PACKAGE"
              exit 82
            fi
            echo "GH2_COPILOT_USERLOCAL_INSTALL=NEW"
          fi
          if ! test -x "$bin" || ! timeout 15 "$bin" --version >/dev/null 2>&1; then
            echo "GH2_COPILOT_CLI_VERSION_PROOF=FAILED"
            exit 83
          fi
          echo "GH2_COPILOT_CLI_VERSION_PROOF=PASS"
          echo "GH2_COPILOT_CLI_PATH=~/.local/bin/copilot"
          echo "GH2_COPILOT_GITHUB_AUTH=NOT_ATTEMPTED"
          echo "GH2_COPILOT_MCP_INSTALL=NOT_ATTEMPTED_GITHUB_BUILTIN"
          echo "GH2_COPILOT_MCP_OUTBOUND_TOOLS=NOT_ENABLED"

      - name: Probe OGENIC SSH IDE OpenCode MCP and Cloudflare live readiness
        if: github.actor == 'Wave-Runner-2'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Ogenicchocolate21debug/Build-Platform"
          test "$GITHUB_REF_NAME" = "phase-vi-provider-incentive-metering"
          test "$RUNNER_NAME" = "wave-runner-01"
          echo "OCIAN_S_HOST_AUDIT=BEGIN"
          echo "OCIAN_S_HOST_RUNNER_IDENTITY=wave-runner-01"
          echo "OCIAN_S_HOST_SYSTEM_HOSTNAME=$(hostname)"
          echo "OCIAN_S_HOST_EFFECTIVE_USER=$(id -un)"
          for bin in ssh sshd ss git node npm npx docker wrangler infisical gh codex opencode code code-server cursor cline; do
            upper="$(printf '%s' "$bin" | tr '[:lower:]-' '[:upper:]_')"
            if command -v "$bin" >/dev/null 2>&1; then
              echo "OCIAN_CLI_$upper=INSTALLED"
            else
              echo "OCIAN_CLI_$upper=ABSENT"
            fi
          done
          if test -x /home/wave/.local/bin/copilot && timeout 12 /home/wave/.local/bin/copilot --version >/dev/null 2>&1; then
            echo "OCIAN_COPILOT_USERLOCAL=VERSION_OK_AUTH_UNVERIFIED"
          else
            echo "OCIAN_COPILOT_USERLOCAL=NOT_VERIFIED"
          fi
          if test -x /home/wave/.local/bin/opencode; then
            echo "OCIAN_OPENCODE_USERLOCAL=INSTALLED"
          else
            echo "OCIAN_OPENCODE_USERLOCAL=ABSENT"
          fi
          if command -v codex >/dev/null 2>&1 && env -u OPENAI_API_KEY -u CODEX_API_KEY CODEX_HOME=/home/wave/.codex timeout 12 codex login status >/dev/null 2>&1; then
            echo "OCIAN_GS_CODEX_PROFILE=SIGNED_IN"
          else
            echo "OCIAN_GS_CODEX_PROFILE=NOT_VERIFIED"
          fi
          if command -v ssh >/dev/null 2>&1 && timeout 5 ssh -V >/dev/null 2>&1; then echo "OCIAN_SSH_CLIENT=AVAILABLE"; else echo "OCIAN_SSH_CLIENT=NOT_VERIFIED"; fi
          if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet ssh; then echo "OCIAN_SSH_SERVICE=ACTIVE"; else echo "OCIAN_SSH_SERVICE=NOT_ACTIVE_OR_UNAVAILABLE"; fi
          if command -v ss >/dev/null 2>&1 && ss -ltn 2>/dev/null | awk '$4 ~ /:22$/ {found=1} END {exit !found}'; then echo "OCIAN_SSH_PORT22_LISTENING=YES"; else echo "OCIAN_SSH_PORT22_LISTENING=NO_OR_UNAVAILABLE"; fi
          for dir in "$HOME/.vscode-server" "$HOME/.vscode-remote" "$HOME/.code-server" "$HOME/.cursor-server"; do
            case "$dir" in
              *vscode-server) label=VSCODE_SERVER ;;
              *vscode-remote) label=VSCODE_REMOTE ;;
              *code-server) label=CODE_SERVER ;;
              *cursor-server) label=CURSOR_SERVER ;;
            esac
            if test -d "$dir"; then echo "OCIAN_IDE_$label=DIRECTORY_PRESENT"; else echo "OCIAN_IDE_$label=NOT_INSTALLED_FOR_RUNNER_USER"; fi
          done
          if command -v codex >/dev/null 2>&1 && timeout 10 env CODEX_HOME=/home/wave/.codex codex mcp list > "$RUNNER_TEMP/ocian-codex-mcp-list" 2>&1; then echo "OCIAN_GS_CODEX_MCP_CONFIG_CLI=READABLE"; else echo "OCIAN_GS_CODEX_MCP_CONFIG_CLI=NOT_VERIFIED"; fi
          for config in "$HOME/.copilot/mcp-config.json" "$HOME/.config/opencode/opencode.json" "$HOME/.config/opencode/opencode.jsonc"; do
            if test -f "$config"; then
              case "$config" in *copilot*) label=COPILOT;; *) label=OPENCODE;; esac
              echo "OCIAN_$label_MCP_CONFIG=FILE_PRESENT_NOT_RUNTIME_VERIFIED"
            fi
          done
          for route in /api/health /api/mcp-config/state /api/mcp-config/discover /api/connector-endpoint/v1/manifest /api/connector-endpoint/v1/status /api/local-agent-team/state /api/blue-diamond/registry; do
            code="$(timeout 13 curl --connect-timeout 4 --max-time 10 -L -s -o /dev/null -w '%{http_code}' "https://wave.ogenicchocolate.com$route" || true)"
            case "$code" in [12345][0-9][0-9]) ;; *) code=TRANSPORT_UNAVAILABLE;; esac
            key="$(printf '%s' "$route" | tr '[:lower:]/-' '[:upper:]__')"
            echo "OCIAN_CF_ROUTE_$key=$code"
          done
          echo "OCIAN_CF_PROTECTED_MCP_EXPECTED=AUTH_REQUIRED_NO_BYPASS"
          echo "OCIAN_IDE_SSH_LOGIN=NOT_PROVEN_BY_LOCAL_SHELL_PROBES"
          echo "OCIAN_PROVIDER_MCP_TOOL_CALLS=NOT_ATTEMPTED"
          echo "OCIAN_HOST_PROBE=END"

      - name: Install optional OpenCode CLI in isolated user-local prefix
        if: github.actor == 'Wave-Runner-2'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = wave-runner-01
          test "$HOME" = /home/wave
          umask 077
          bin="$HOME/.local/bin/opencode"
          if test -x "$bin" && timeout 15 "$bin" --version >/dev/null 2>&1; then
            echo "OCIAN_OPENCODE_INSTALL=ALREADY_PRESENT"
          else
            if ! command -v node >/dev/null || ! command -v npm >/dev/null; then
              echo "OCIAN_OPENCODE_INSTALL=BLOCKED_NODE_NPM_MISSING"
            elif ! node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 22 ? 0 : 1)'; then
              echo "OCIAN_OPENCODE_INSTALL=BLOCKED_NODE_BELOW_22"
            else
              mkdir -p "$HOME/.local"
              # Official current OpenCode v2 npm CLI; no root, no LLM calls,
              # no user auth, no API tokens, no background daemon.
              if timeout 240 env NODE_OPTIONS=--max-old-space-size=256 npm install -g \
                  --prefix "$HOME/.local" --no-audit --no-fund --silent @opencode/cli \
                  > "$RUNNER_TEMP/ocian-opencode-install.log" 2>&1; then
                echo "OCIAN_OPENCODE_INSTALL=NEW"
              else
                echo "OCIAN_OPENCODE_INSTALL=BLOCKED_PACKAGE_OR_MEMORY_OR_NETWORK"
              fi
            fi
          fi
          if test -x "$bin" && timeout 15 "$bin" --version >/dev/null 2>&1; then
            echo "OCIAN_OPENCODE_CLI_VERSION=PASS"
            if timeout 10 "$bin" mcp --help >/dev/null 2>&1; then
              echo "OCIAN_OPENCODE_MCP_CLIENT_COMMAND=AVAILABLE_AUTH_UNVERIFIED"
            else
              echo "OCIAN_OPENCODE_MCP_CLIENT_COMMAND=NOT_VERIFIED"
            fi
          else
            echo "OCIAN_OPENCODE_CLI_VERSION=NOT_VERIFIED"
          fi
          echo "OCIAN_OPENCODE_PROVIDER_AUTH=NOT_ATTEMPTED"
          echo "OCIAN_OPENCODE_PAID_MODEL_CALLS=ZERO"
      - name: Bind existing Owner staging key with Infisical OIDC
        if: github.actor == 'Wave-Runner-2'
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG || 'ogenic-sio-ti-rv' }}
          env-slug: staging
          domain: https://app.infisical.com
          secret-path: /
          secret-name: OGENIC_OPS_KEY
          include-imports: false
          recursive: false
      - name: Authenticated owner MCP inventory and D1 connector state
        if: github.actor == 'Wave-Runner-2'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = wave-runner-01
          umask 077
          jar="$RUNNER_TEMP/ocian-auth-$GITHUB_RUN_ID.cookies"
          response="$RUNNER_TEMP/ocian-auth-$GITHUB_RUN_ID.json"
          state="$RUNNER_TEMP/ocian-mcp-$GITHUB_RUN_ID.json"
          trap 'rm -f "$jar" "$response" "$state"' EXIT
          if test -z "$(printenv OGENIC_OPS_KEY || true)"; then echo 'OCIAN_MCP_OWNER_BINDING=MISSING'; exit 0; fi
          echo 'OCIAN_MCP_INFISICAL_OWNER_KEY=BOUND_NO_VALUE_PRINTED'
          code="$(jq -nc --arg v "$OGENIC_OPS_KEY" '{owner_key:$v}' | timeout 15 curl --silent --show-error --max-time 12 --cookie-jar "$jar" -H 'Content-Type: application/json' --data-binary @- -o "$response" -w '%{http_code}' https://wave.ogenicchocolate.com/api/session || true)"
          if test "$code" != 200 || ! jq -e '.ok == true and .authenticated == true and .user.role == "owner"' "$response" >/dev/null 2>&1; then echo "OCIAN_MCP_OWNER_SESSION=NOT_VERIFIED_HTTP_$code"; exit 0; fi
          echo 'OCIAN_MCP_OWNER_SESSION=VERIFIED'
          for pair in 'MCP_STATE:/api/mcp-config/state' 'MCP_FIXTURE:/api/mcp-config/discover?provider=simulated' 'CONNECTOR_MANIFEST:/api/connector-endpoint/v1/manifest' 'CONNECTOR_STATUS:/api/connector-endpoint/v1/status' 'LOCAL_TEAM:/api/local-agent-team/state' 'BLUE_REGISTRY:/api/blue-diamond/registry'; do
            label="$(printf '%s' "$pair" | cut -d: -f1)"
            path="$(printf '%s' "$pair" | cut -d: -f2-)"
            status="$(timeout 15 curl --silent --show-error --max-time 12 --cookie "$jar" -o "$response" -w '%{http_code}' "https://wave.ogenicchocolate.com$path" || true)"
            echo "OCIAN_AUTH_$label=HTTP_$status"
            if test "$label" = MCP_STATE && test "$status" = 200; then cp "$response" "$state"; jq -r '"OCIAN_MCP_BINDINGS_COUNT="+((.bindings|length)|tostring)' "$state"; jq -r '.bindings[]? | select(.provider_id|test("^[a-z0-9_-]+$")) | "OCIAN_MCP_REGISTERED_"+.provider_id+"="+.status' "$state" | head -n 15; fi
          done
          if test -s "$state"; then
            jq -r '.bindings[]? | select(.status=="configured" or .status=="active") | .provider_id | select(test("^[a-z0-9_-]+$"))' "$state" | head -n 4 | while IFS= read -r provider; do
              code="$(timeout 17 curl --silent --show-error --max-time 14 --cookie "$jar" --get --data-urlencode "provider=$provider" -o "$response" -w '%{http_code}' https://wave.ogenicchocolate.com/api/mcp-config/discover || true)"
              echo "OCIAN_MCP_REAL_DISCOVER_$provider=HTTP_$code"
              if test "$code" = 200; then jq -r '"OCIAN_MCP_LIVE="+((.real_available==true)|tostring)+";TOOL_COUNT="+((.tools|length)|tostring)' "$response" || true; fi
            done
          fi
          echo 'OCIAN_MCP_NO_TOOLS_CALL_OR_SECRET_EXPOSURE=TRUE'

      - name: CCS 15-mode real owner-authenticated runtime matrix
        if: github.actor == 'Wave-Runner-2'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = wave-runner-01
          test "$GITHUB_REF_NAME" = phase-vi-provider-incentive-metering
          test -n "$(printenv OGENIC_OPS_KEY || true)" || { echo CCS15_OWNER_KEY=NOT_BOUND; exit 81; }
          umask 077
          jar="$RUNNER_TEMP/ccs15-$GITHUB_RUN_ID.cookies"
          login="$RUNNER_TEMP/ccs15-$GITHUB_RUN_ID-login.json"
          payload="$RUNNER_TEMP/ccs15-$GITHUB_RUN_ID-response.json"
          manifest="$RUNNER_TEMP/ccs15-$GITHUB_RUN_ID-manifest.json"
          modes="$RUNNER_TEMP/ccs15-$GITHUB_RUN_ID-modes.json"
          trap 'rm -f "$jar" "$login" "$payload" "$manifest" "$modes"' EXIT
          auth_status="$(jq -nc --arg v "$OGENIC_OPS_KEY" '{owner_key:$v}' | timeout 15 curl -sS --max-time 12 --cookie-jar "$jar" -H 'Content-Type: application/json' --data-binary @- -o "$login" -w '%{http_code}' https://wave.ogenicchocolate.com/api/session)"
          test "$auth_status" = 200
          jq -e '.ok == true and .authenticated == true and .user.role == "owner"' "$login" >/dev/null
          echo CCS15_OWNER_SESSION=VERIFIED
          url=https://wave.ogenicchocolate.com
          status="$(timeout 15 curl -sS --max-time 12 --cookie "$jar" -o "$manifest" -w '%{http_code}' "$url/api/connector-endpoint/v1/manifest")"
          test "$status" = 200
          jq -e '.ok == true and .modes_documented == 15 and (.transports|length) == 15 and (.all_fifteen_modes_live_e2e_proven == false)' "$manifest" >/dev/null
          echo CCS15_ENDPOINT_MANIFEST=PASS_COUNT_15
          status="$(timeout 65 curl -sS --max-time 60 --cookie "$jar" -o "$modes" -w '%{http_code}' "$url/api/connector-modes/status?probe=1")"
          echo "CCS15_MODES_STATUS_HTTP=$status"
          test "$status" = 200
          jq -e '.ok == true and .modes_documented == 15 and (.modes|length)==15 and ([.modes[].mode]|unique|length)==15' "$modes" >/dev/null
          jq -e --slurpfile m "$manifest" '([.modes[].mode|ascii_downcase]|sort) == ([$m[0].transports[].id|if .=="npx_cli" then "npx_npx_cli" else . end]|sort)' "$modes" >/dev/null
          echo CCS15_MODES_INVENTORY=PASS_COUNT_15_UNIQUE
          jq -r '.modes[]|"CCS15_MODE_"+.mode+"="+.state' "$modes"
          jq -r '"CCS15_LIVE_TOOLS="+((.live_tools|length)|tostring)+";CCS15_REGISTRY="+((.connector_registry|length)|tostring)' "$modes"
          jq -r '"CCS15_DEPLOYED_SHA="+([.modes[]?.latest_verified_sha|select(type=="string")][0] // "UNKNOWN")' "$modes"
          for transport in token secret credential npx_cli sdk a2a_agent_relay; do
            code="$(jq -nc --arg t "$transport" '{transport:$t,command:"staging bounded check",capability:"read_file",provider:"github",environment:"staging"}' | timeout 13 curl -sS --max-time 10 --cookie "$jar" -H 'Content-Type: application/json' --data-binary @- -o "$payload" -w '%{http_code}' "$url/api/connector-endpoint/v1/command" || true)"
            if test "$code" = 422 && jq -e '.ok == false and (.code=="IDENTITY_REFERENCE_ONLY_NO_SECRET_EXPORT" or .code=="MODE_ADAPTER_NOT_VERIFIED_USE_EXISTING_SAFE_ROUTE")' "$payload" >/dev/null 2>&1; then
              echo "CCS15_SAFETY_BLOCK_$transport=PASS"
            else
              echo "CCS15_SAFETY_BLOCK_$transport=FAILED_HTTP_$code"
              exit 88
            fi
          done
          for mode in n8n mcp; do
            if test "$mode" = mcp; then extra='&provider=__nonexistent_ccs15__'; else extra=''; fi
            code="$(timeout 20 curl -sS --max-time 17 --cookie "$jar" -o "$payload" -w '%{http_code}' "$url/api/connector-endpoint/v1/probe?mode=$mode$extra" || true)"
            echo "CCS15_SAFE_PROBE_$mode=HTTP_$code"
          done
          echo CCS15_MCP_REAL_TOOLS_CALL=NOT_PERFORMED_NO_PROVIDER
          echo CCS15_PAID_MODEL_CALLS=ZERO
          echo CCS15_NO_NEW_GATEWAY_RUNNER_OR_SECRET=TRUE

      - name: CCS GitHub remote MCP Read-only registration and true discovery
        if: github.actor == 'Wave-Runner-2'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = wave-runner-01
          test "$GITHUB_REF_NAME" = phase-vi-provider-incentive-metering
          test -n "$(printenv OGENIC_OPS_KEY || true)"
          umask 077
          jar="$RUNNER_TEMP/ccs-github-$GITHUB_RUN_ID.cookies"
          response="$RUNNER_TEMP/ccs-github-$GITHUB_RUN_ID.json"
          state="$RUNNER_TEMP/ccs-github-$GITHUB_RUN_ID-state.json"
          trap 'rm -f "$jar" "$response" "$state"' EXIT
          root=https://wave.ogenicchocolate.com
          code="$(jq -nc --arg v "$OGENIC_OPS_KEY" '{owner_key:$v}' | timeout 15 curl -sS --max-time 12 --cookie-jar "$jar" -H 'Content-Type: application/json' --data-binary @- -o "$response" -w '%{http_code}' "$root/api/session")"
          if test "$code" != 200 || ! jq -e '.ok == true and .authenticated == true and .user.role == "owner"' "$response" >/dev/null; then echo CCS_GITHUB_MCP_AUTH=BLOCKED; exit 87; fi
          code="$(timeout 15 curl -sS --max-time 12 --cookie "$jar" -o "$state" -w '%{http_code}' "$root/api/mcp-config/state")"
          test "$code" = 200
          prior="$(jq -r '[.bindings[]? | select(.provider_id=="github")]|length' "$state")"
          if test "$prior" != 0; then
            echo CCS_GITHUB_MCP_BINDING=EXISTING_NOT_MUTATED
          else
            # Existing staging provider+binding D1 table; official remote
            # Github MCP service defaults to READ-ONLY via path /readonly.
            # Reference existing Worker environment key; no token in payload.
            code="$(jq -nc '{provider:"github",action:"register",approved:true,endpoint:"https://api.githubcopilot.com/mcp/readonly",secret_ref:"env:GITHUB_TOKEN",label:"GH2 ReadOnly MCP"}' | timeout 15 curl -sS --max-time 12 --cookie "$jar" -H 'Content-Type: application/json' --data-binary @- -o "$response" -w '%{http_code}' "$root/api/mcp-config/action" || true)"
            if test "$code" != 200; then
              echo "CCS_GITHUB_MCP_REGISTER=BLOCKED_HTTP_$code"
              jq -r '"CCS_GITHUB_MCP_REGISTER_CODE="+(.code // "UNKNOWN")' "$response" 2>/dev/null || true
              exit 0
            fi
            echo CCS_GITHUB_MCP_REGISTER=READONLY_REFERENCE_BOUND
          fi
          code="$(timeout 24 curl -sS --max-time 21 --cookie "$jar" --get --data-urlencode 'provider=github' -o "$response" -w '%{http_code}' "$root/api/mcp-config/discover" || true)"
          if test "$code" = 200 && jq -e '.ok == true and .real_available == true and (.tools|length)>0' "$response" >/dev/null 2>&1; then
            echo CCS_GITHUB_MCP_INITIALIZE_TOOLS_LIST=LIVE
            jq -r '"CCS_GITHUB_MCP_TOOL_COUNT="+((.tools|length)|tostring)' "$response"
          else
            echo "CCS_GITHUB_MCP_INITIALIZE_TOOLS_LIST=BLOCKED_HTTP_$code"
            jq -r '"CCS_GITHUB_MCP_DISCOVERY_CODE="+(.code // "UNKNOWN")' "$response" 2>/dev/null || true
            if test "$prior" = 0; then
              code="$(jq -nc '{provider:"github",action:"disable",approved:true}' | timeout 13 curl -sS --max-time 10 --cookie "$jar" -H 'Content-Type: application/json' --data-binary @- -o "$response" -w '%{http_code}' "$root/api/mcp-config/action" || true)"
              echo "CCS_GITHUB_MCP_FAILED_BINDING_DISABLED_HTTP_$code"
            fi
          fi
          echo CCS_GITHUB_MCP_TOOL_EXECUTION=NOT_ATTEMPTED
          echo CCS_GITHUB_MCP_NEW_SERVER_INSTALLED=FALSE

      - name: CCS/1.0 real Card Stone policy and safe lease verification
        if: github.actor == 'Wave-Runner-2'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = wave-runner-01
          test -n "$(printenv OGENIC_OPS_KEY || true)"
          umask 077
          cookie="$RUNNER_TEMP/ccs10-$GITHUB_RUN_ID.cookie"
          reply="$RUNNER_TEMP/ccs10-$GITHUB_RUN_ID.json"
          trap 'rm -f "$cookie" "$reply"' EXIT
          url=https://wave.ogenicchocolate.com
          auth="$(jq -nc --arg k "$OGENIC_OPS_KEY" '{owner_key:$k}' | timeout 15 curl -sS --max-time 12 --cookie-jar "$cookie" -H 'Content-Type: application/json' --data-binary @- -o "$reply" -w '%{http_code}' "$url/api/session")"
          test "$auth" = 200
          jq -e '.ok == true and .authenticated == true and .user.role == "owner"' "$reply" >/dev/null
          code="$(timeout 12 curl -sS --max-time 10 --cookie "$cookie" -o "$reply" -w '%{http_code}' "$url/api/ccs/status")"
          test "$code" = 200
          jq -e '.ok == true and .protocol == "CCS/1.0" and .direct_execution_bypass == false and (.verbs|length)==6' "$reply" >/dev/null
          echo CCS10_STATUS_OWNER_AUTH=PASS
          for pair in 'ABSENT:INSERT:INSERTED' 'INSERTED:VERIFY:VERIFIED' 'VERIFIED:USE:IN_USE' 'IN_USE:RETURN:RETURNED' 'VERIFIED:LEASE:LEASED' 'LEASED:REVOKE:REVOKED'; do
            from="$(printf '%s' "$pair" | cut -d: -f1)"
            verb="$(printf '%s' "$pair" | cut -d: -f2)"
            want="$(printf '%s' "$pair" | cut -d: -f3)"
            code="$(jq -nc --arg from "$from" --arg verb "$verb" '{state:$from,verb:$verb,card_id:"ccs.ogenic.staging.read",capability:"read_file"}' | timeout 15 curl -sS --max-time 12 --cookie "$cookie" -H 'Content-Type: application/json' --data-binary @- -o "$reply" -w '%{http_code}' "$url/api/ccs/envelope")"
            if test "$code" != 200 || ! jq -e --arg want "$want" '.ok == true and .card.state == $want and .direct_execution_bypass == false' "$reply" >/dev/null; then echo "CCS10_TRANSITION_$verb=FAILED_HTTP_$code"; exit 85; fi
            echo "CCS10_TRANSITION_$verb=PASS"
          done
          code="$(jq -nc '{state:"REVOKED",verb:"USE",card_id:"ccs.ogenic.staging.read",capability:"read_file"}' | timeout 15 curl -sS --max-time 12 --cookie "$cookie" -H 'Content-Type: application/json' --data-binary @- -o "$reply" -w '%{http_code}' "$url/api/ccs/envelope")"
          test "$code" = 409
          jq -e '.ok==false and .code=="CCS_TRANSITION_DENIED"' "$reply" >/dev/null
          echo CCS10_REVOKED_USE=DENIED_PASS
          # Existing USE CARD policy route. It returns a policy decision,
          # not a persisted lease or live invocation; no E2E escalation claim.
          for variant in valid cross escalation; do
            data="$(jq -nc --arg v "$variant" '{source:{card_id:"card.ccs.pool",provider_id:"github",capability_id:"read_file",permission_class:"READ",state:"READY",environment:"staging",lease_eligible:true},borrower:{card_id:"card.ccs.agent",provider_id:(if $v=="cross" then "linear" else "github" end),capability_id:"read_file",permission_class:"READ",state:"READY",environment:"staging",lease_eligible:true},reason:"RATE_LIMIT",requested_permission:(if $v=="escalation" then "WRITE" else "READ" end),requested_ttl_minutes:5,requested_max_calls:1,operation:"staging read"}')"
            code="$(printf '%s' "$data" | timeout 15 curl -sS --max-time 12 --cookie "$cookie" -H 'Content-Type: application/json' --data-binary @- -o "$reply" -w '%{http_code}' "$url/api/ccs/lease")"
            case "$variant" in
              valid) test "$code" = 200; jq -e '.ok == true and .code == "LEASE_ALLOWED_BY_SIGNED_POLICY" and .direct_execution_bypass == false and .evidence.state == "RUBY_PENDING"' "$reply" >/dev/null ;;
              cross) test "$code" = 409; jq -e '.code == "CROSS_PROVIDER_LEASE_DENIED_V1"' "$reply" >/dev/null ;;
              escalation) test "$code" = 409; jq -e '.code == "PERMISSION_ESCALATION_DENIED"' "$reply" >/dev/null ;;
            esac
            echo "CCS10_POLICY_$variant=PASS"
          done
          echo CCS10_POLICY_MODE=HTTP_POLICY_EVALUATION_NO_REAL_LEASE_PERSISTED
          echo CCS10_RUNTIME_6_VERBS=PASS
