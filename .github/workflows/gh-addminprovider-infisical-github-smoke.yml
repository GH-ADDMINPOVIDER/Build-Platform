name: GH-ADDMINPROVIDER Infisical GitHub Credential Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke-github-references:
    name: Read-only GH* / GITHUB* credential smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL || 'https://app.infisical.com' }}
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
      INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID }}
      INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG }}
      INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
      INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG || 'staging' }}
    steps:
      - name: Discover and smoke each GitHub credential reference without exposing values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for required in INFISICAL_IDENTITY_ID INFISICAL_ORG_ID INFISICAL_ORG_SLUG INFISICAL_PROJECT_SLUG INFISICAL_ENV_SLUG; do
            test -n "${!required}" || { echo "::error::CONFIGURATION_REQUIRED:$required"; exit 78; }
          done

          oidc_json="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          oidc_jwt="$(jq -r '.value // empty' <<<"$oidc_json")"
          test -n "$oidc_jwt" || { echo "::error::OIDC_TOKEN_UNAVAILABLE"; exit 1; }

          login_payload="$(jq -n --arg identityId "$INFISICAL_IDENTITY_ID" --arg jwt "$oidc_jwt" --arg organizationSlug "$INFISICAL_ORG_SLUG" \
            '{identityId:$identityId,jwt:$jwt,organizationSlug:$organizationSlug}')"
          login="$(curl --fail-with-body -sS -X POST -H 'Content-Type: application/json' \
            --data "$login_payload" "$INFISICAL_API_URL/api/v1/auth/oidc-auth/login")"
          infisical_token="$(jq -r '.accessToken // empty' <<<"$login")"
          test -n "$infisical_token" || { echo "::error::INFISICAL_OIDC_LOGIN_FAILED"; exit 1; }
          echo "::add-mask::$infisical_token"

          projects="$(curl --fail-with-body -sS -H "Authorization: Bearer $infisical_token" "$INFISICAL_API_URL/api/v1/projects")"
          project_id="$(jq -r --arg org "$INFISICAL_ORG_ID" --arg slug "$INFISICAL_PROJECT_SLUG" \
            '[.projects[]? | select(.orgId == $org and .slug == $slug)][0].id // empty' <<<"$projects")"
          test -n "$project_id" || { echo "::error::INFISICAL_PROJECT_NOT_FOUND"; exit 1; }

          encoded_env="$(jq -rn --arg value "$INFISICAL_ENV_SLUG" '$value|@uri')"
          secrets="$(curl --fail-with-body -sS -G -H "Authorization: Bearer $infisical_token" \
            --data-urlencode "projectId=$project_id" \
            --data-urlencode "environment=$INFISICAL_ENV_SLUG" \
            --data-urlencode "secretPath=/" \
            --data-urlencode "recursive=true" \
            --data-urlencode "viewSecretValue=true" \
            --data-urlencode "expandSecretReferences=false" \
            "$INFISICAL_API_URL/api/v4/secrets")"

          refs="$(jq -c '[.secrets[]? | select((.secretKey // "") | test("^(GH|GITHUB)(_|$)"; "i")) | {key:.secretKey,value:(.secretValue // "")}] | sort_by(.key)' <<<"$secrets")"
          count="$(jq 'length' <<<"$refs")"
          echo "GH_ADDMINPROVIDER_INFISICAL_GITHUB_REFERENCE_COUNT=$count"
          if [ "$count" -ne 6 ]; then
            echo "::error::EXPECTED_SIX_GITHUB_REFERENCES_FOUND_$count"
            exit 1
          fi

          while IFS= read -r item; do
            key="$(jq -r '.key' <<<"$item")"
            value="$(jq -r '.value' <<<"$item")"
            test -n "$value" || { echo "GH_CREDENTIAL_SMOKE key=$key result=EMPTY"; continue; }
            echo "::add-mask::$value"
            family="OTHER"
            case "$value" in
              ghp_*) family="CLASSIC_PAT" ;;
              github_pat_*) family="FINE_GRAINED_PAT" ;;
              gho_*) family="OAUTH_ACCESS_TOKEN" ;;
              ghu_*) family="GITHUB_APP_USER_TOKEN" ;;
              ghs_*) family="GITHUB_APP_INSTALLATION_TOKEN" ;;
            esac
            headers="$(mktemp)"
            body="$(mktemp)"
            http="$(curl -sS -o "$body" -D "$headers" -w '%{http_code}' \
              -H "Authorization: Bearer $value" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/user || true)"
            login_name="$(jq -r '.login // empty' <"$body" 2>/dev/null || true)"
            scopes="$(tr -d '\r' <"$headers" | awk -F': ' 'tolower($1)=="x-oauth-scopes"{print $2}' | paste -sd, -)"
            rm -f "$headers" "$body"
            if [ "$http" = "200" ] && [ -n "$login_name" ]; then
              echo "GH_CREDENTIAL_SMOKE key=$key family=$family result=PASS account=$login_name scopes=$scopes"
            else
              echo "GH_CREDENTIAL_SMOKE key=$key family=$family result=FAIL http=$http"
            fi
          done < <(jq -c '.[]' <<<"$refs")
