name: GH2 Notion RAG MASTER Snapshot to WAVE D1 Readback
on:
  push:
    branches: [feat/ccs-multi-protocol-docker-20261023]
    paths:
      - 'scripts/gh2-notion-snapshot-wave-d1-e2e.mjs'
      - 'config/wave-notion-rag-master.staging.json'
      - '.github/workflows/gh2-notion-snapshot-wave-d1-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  source-snapshot-d1:
    if: github.repository == 'Wave-Runner-2/Build-Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
      INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || 'ogenic-sio-ti-rv' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: staging
          secret-path: /
          recursive: false
      - name: Ingest Notion canonical provenance snapshot and read back independent 1LSS D1 receipt
        run: node scripts/gh2-notion-snapshot-wave-d1-e2e.mjs
      - name: Keep Notion native live API separate from source snapshot
        if: always()
        run: echo 'SOURCE_SNAPSHOT_ONLY; NATIVE_NOTION_TOKEN_AND_AUTO_REFRESH=NOT_PROVEN; GLOBAL_7_E2E=false'
