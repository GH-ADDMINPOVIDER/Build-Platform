name: Deploy Claude Yellow Stone tools to existing staging Worker
on:
  push:
    branches: [main]
    paths: [.github/workflows/gh-addminpovider-claude-mcp-deploy.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: gh-addminpovider-claude-mcp-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository_id == '1429580446' && github.repository_owner_id == '342175560'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 28c7233ad77068094803bd816ee8d17185352f7e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require native validation success
        env:
          GH_PROOF_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          req=urllib.request.Request("https://api.github.com/repos/GH-ADDMINPOVIDER/Build-Platform/actions/runs/41875392008",headers={"Authorization":"Bearer "+os.environ["GH_PROOF_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req) as r: data=json.load(r)
          assert data["conclusion"]=="success" and data["head_sha"]=="21e7e4a26dcbb8b830d6e94f08bc24f68436ddae"
          print("VALIDATED_SOURCE_8d61e1d06a78adcc84e755bdacfbb9911dd169bf")
          PY
      - name: Build validated source
        run: npm ci && node --test tests/claude-yellow-stone-mcp.test.mjs && npm run typecheck && npm run build
      - name: Resolve existing credentials and apply only MCP OAuth state migration
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error
          def mask(v):
              for s in str(v).splitlines():
                  if s: print("::add-mask::"+s,flush=True)
          def request(url,token=None,data=None,headers=None):
              h={"User-Agent":"GH-ADDMINPOVIDER-Claude-MCP-proof","Accept":"application/json"}
              h.update(headers or {})
              if token:h["Authorization"]="Bearer "+token
              body=None
              if data is not None:h["Content-Type"]="application/json";body=json.dumps(data).encode()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=h,data=body),timeout=25) as r:
                      raw=r.read(); status=r.status; ct=r.headers.get("content-type","")
              except urllib.error.HTTPError as e: raw=e.read();status=e.code;ct=e.headers.get("content-type","")
              try: value=json.loads(raw)
              except: value={}
              return status,ct,value
          assert os.environ["GITHUB_REPOSITORY_ID"]=="1429580446"
          assert os.environ["GITHUB_REPOSITORY_OWNER_ID"]=="342175560"
          oidc=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]+"&audience="+urllib.parse.quote("https://github.com/GH-ADDMINPOVIDER",safe="")
          s,_,j=request(oidc,os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]);assert s==200
          jwt=j["value"];mask(jwt)
          s,_,j=request("https://app.infisical.com/api/v1/auth/oidc-auth/login",data={"identityId":"b0962d69-bd33-4ac3-b4f4-48589535ca38","jwt":jwt});assert s==200
          session=j["accessToken"];mask(session)
          def secret(name):
              q=urllib.parse.urlencode({"projectId":"e8cfba67-ea99-4d79-bc9f-87b862f9129c","environment":"staging","secretPath":"/","type":"shared","viewSecretValue":"true","expandSecretReferences":"false"})
              s,_,j=request("https://app.infisical.com/api/v4/secrets/"+urllib.parse.quote(name,safe="")+"?"+q,session);assert s==200
              v=j["secret"]["secretValue"];mask(v);return v
          
          account=secret("CLOUDFLARE_ACCOUNT_ID"); cf=secret("CLOUDFLARE_API_TOKEN")
          base="https://api.cloudflare.com/client/v4/accounts/"+account
          s,_,j=request(base+"/workers/scripts/ogenic-phase-vi-staging/deployments",cf);assert s==200 and j["success"]
          old=j["result"]["deployments"][0]["versions"]
          assert len(old)==1 and old[0]["percentage"]==100, "Unexpected split deployment"
          s,_,j=request(base+"/workers/scripts/ogenic-phase-vi-staging/settings",cf);assert s==200 and j["success"]
          provenance={x["name"]:x.get("text") for x in j["result"].get("bindings",[]) if x.get("name") in ["OGENIC_GIT_SHA","OGENIC_GITHUB_BRANCH","OGENIC_GITHUB_REPO"]}
          assert provenance.get("OGENIC_GIT_SHA")=="8d61e1d06a78adcc84e755bdacfbb9911dd169bf", "Worker source changed; reconcile before deploy"
          print(json.dumps({"previous_versions":old,"previous_provenance":provenance}))
          import pathlib,subprocess
          config=json.loads(pathlib.Path("wrangler.jsonc").read_text())
          assert config["name"]=="ogenic-phase-vi-staging"
          assert config["d1_databases"][0]["database_id"]=="b4ac3a33-df80-47cf-8e75-7574e025b87b"
          sql=pathlib.Path("database/migrations/0016_oge_athena_oauth.sql").read_text()
          s,_,j=request(base+"/d1/database/b4ac3a33-df80-47cf-8e75-7574e025b87b/query",cf,{"sql":sql,"params":[]})
          assert s==200 and j["success"] and all(r.get("success") for r in j.get("result",[]))
          print("STAGING_MCP_OAUTH_SCHEMA_APPLIED")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("CLOUDFLARE_ACCOUNT_ID="+account+"\nCLOUDFLARE_API_TOKEN="+cf+"\n")
          
          PY
      - name: Deploy existing staging Worker
        run: npx wrangler deploy --keep-vars --name ogenic-phase-vi-staging --var OGENIC_GIT_SHA:28c7233ad77068094803bd816ee8d17185352f7e --var OGENIC_GITHUB_BRANCH:Unified-on-Progress --var OGENIC_GITHUB_REPO:GH-ADDMINPOVIDER/Build-Platform
      - name: Verify live OAuth metadata and protected MCP
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          base="https://wave.ogenicchocolate.com"
          for path in ["/.well-known/oauth-authorization-server","/.well-known/oauth-protected-resource/mcp"]:
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={"User-Agent":"GH-ADDMINPOVIDER-Claude-MCP-proof"}),timeout=25) as r:
                  data=json.load(r);assert r.status==200
              assert "ogenic:write" in data["scopes_supported"] and "ogenic:execute" in data["scopes_supported"]
          req=urllib.request.Request(base+"/mcp",data=json.dumps({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"live-proof","version":"1"}}}).encode(),headers={"Content-Type":"application/json","User-Agent":"GH-ADDMINPOVIDER-Claude-MCP-proof"})
          try:
              urllib.request.urlopen(req,timeout=25);raise AssertionError("UNAUTHENTICATED_MCP_MUST_FAIL")
          except urllib.error.HTTPError as e:
              assert e.code==401 and "oauth-protected-resource/mcp" in e.headers.get("www-authenticate","")
          print("LIVE_OAUTH_AND_MCP_AUTH_BOUNDARY_PASS")
          PY
