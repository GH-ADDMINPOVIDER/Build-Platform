name: OGE-65 Shared Theme Proof

on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - "src/WaveThemeToggle.tsx"
      - "src/wave-theme.css"
      - "src/main.tsx"
      - "src/LegacyControlSurface.tsx"
      - "src/unified-chat.css"
      - "src/landing.css"
      - "src/wave-next.css"
      - "tests/oge-65-shared-theme.test.mjs"
      - ".github/workflows/oge-65-shared-theme-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: OGE-65 deterministic theme contract
        run: node --test tests/oge-65-shared-theme.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: One-controller guard
        run: |
          set -euo pipefail
          test "$(grep -o '<WaveThemeToggle />' src/main.tsx | wc -l | tr -d ' ')" = "1"
          ! grep -Eq 'WaveThemeToggle|ThemeController' src/LegacyControlSurface.tsx
