name: OGE-65 Shared Theme Proof\n\non:\n  push:\n    branches: [phase-vi-provider-incentive-metering]\n    paths:\n      - "src/WaveThemeToggle.tsx"\n      - "src/wave-theme.css"\n      - "src/main.tsx"\n      - "src/LegacyControlSurface.tsx"\n      - "src/unified-chat.css"\n      - "src/landing.css"\n      - "src/wave-next.css"\n      - "tests/oge-65-shared-theme.test.mjs"\n      - ".github/workflows/oge-65-shared-theme-proof.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  proof:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n\n      - name: Install dependencies\n        run: npm install --no-audit --no-fund\n\n      - name: OGE-65 deterministic theme contract\n        run: node --test tests/oge-65-shared-theme.test.mjs\n\n      - name: Typecheck\n        run: npm run typecheck\n\n      - name: Build\n        run: npm run build\n\n      - name: One-controller guard\n        run: |\n          set -euo pipefail\n          test "$(grep -o '<WaveThemeToggle />' src/main.tsx | wc -l | tr -d ' ')" = "1"\n          ! grep -Eq 'WaveThemeToggle|ThemeController' src/LegacyControlSurface.tsx\n