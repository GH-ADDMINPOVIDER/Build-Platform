name: OGE-65 Shared Theme Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: OGE-65 deterministic theme contract
        run: node --test tests/oge-65-shared-theme.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: One-controller guard
        run: |
          set -euo pipefail
          test "$(grep -o '<WaveThemeToggle />' src/main.tsx | wc -l | tr -d ' ')" = "1"
          ! grep -Eq 'WaveThemeToggle|ThemeController' src/LegacyControlSurface.tsx
