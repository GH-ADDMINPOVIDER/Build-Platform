name: GH-ADDMINPOVIDER Host Inventory (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: [GH-ADDMINPOVIDER]
    timeout-minutes: 10
    steps:
      - name: Inventory (no secrets, no file contents, no env)
        shell: bash
        run: |
          set +e
          echo "## identity"; hostname; whoami; uname -srm; uptime -p
          echo "## cpu/mem/disk"; nproc; free -m | sed -n '1,2p'; df -h / | tail -1
          echo "## tools"; for t in git node npm pnpm docker python3 gh curl jq; do printf '%s: ' $t; ($t --version 2>/dev/null | head -1) || echo missing; done
          echo "## listening ports (proto/addr only)"; ss -ltn 2>/dev/null | awk 'NR>1{print $4}' | sort -u
          echo "## systemd running services"; systemctl list-units --type=service --state=running --no-legend 2>/dev/null | awk '{print $1}'
          echo "## actions runner services"; systemctl list-units 'actions.runner*' --no-legend 2>/dev/null | awk '{print $1,$3,$4}'
          echo "## docker"; docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}}' 2>&1 | head -30
          echo "## top dirs by size"; du -sh /home/* /opt/* /srv/* /var/lib/docker 2>/dev/null | sort -rh | head -15
          echo "## counts only"; echo "cron_user_jobs: $(crontab -l 2>/dev/null | grep -vc '^#')"; echo "authorized_keys_root: $(grep -c . /root/.ssh/authorized_keys 2>/dev/null)"
          echo "## openclaw/n8n present?"; ls -d /opt/openclaw ~/openclaw ~/.openclaw /opt/n8n 2>&1 | head
