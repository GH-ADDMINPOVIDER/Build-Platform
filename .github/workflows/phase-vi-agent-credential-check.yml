name: OGENIC Phase VI Agent Credential Check

on:
  push:
    branches: [phase-vi-unified-cloudflare]
    paths:
      - ".github/workflows/phase-vi-agent-credential-check.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}

jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging]
    steps:
      - uses: actions/checkout@v4

      - name: Auto-discover Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: ${{ matrix.environment }}
          secret-path: /

      - name: Report agent credential presence without revealing values
        shell: bash
        run: |
          set -euo pipefail
          report() {
            name="$1"
            if [ -n "${!name:-}" ]; then
              echo "${name}=PRESENT"
            else
              echo "${name}=MISSING"
            fi
          }

          echo "Environment: ${{ matrix.environment }}"
          report OPENAI_API_KEY
          report OPENAI_PROJECT_ID
          report ANTHROPIC_API_KEY
          report CLAUDE_API_KEY
          report AUSTRA_API_KEY
          report OGENIC_OPS_KEY

      - name: Require staging Codex and Claude credentials
        if: matrix.environment == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::CONFIGURATION_REQUIRED: OPENAI_API_KEY missing from Infisical staging"
            exit 1
          fi
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${CLAUDE_API_KEY:-}" ]; then
            echo "::error::CONFIGURATION_REQUIRED: ANTHROPIC_API_KEY or CLAUDE_API_KEY missing from Infisical staging"
            exit 1
          fi

      - name: Check Codex API connectivity on staging
        id: codex_connect
        if: matrix.environment == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          HEADERS=(-H "Authorization: Bearer ${OPENAI_API_KEY}")
          if [ -n "${OPENAI_PROJECT_ID:-}" ]; then
            HEADERS+=(-H "OpenAI-Project: ${OPENAI_PROJECT_ID}")
          fi
          STATUS="$(curl -sS -o /tmp/openai-models.json -w '%{http_code}' \
            "${HEADERS[@]}" \
            https://api.openai.com/v1/models)"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            CODE="$(jq -r '.error.code // .error.type // "unknown"' /tmp/openai-models.json 2>/dev/null || true)"
            echo "::error::Codex connectivity failed: HTTP ${STATUS}, code=${CODE}"
            exit 1
          fi
          MODEL="$(jq -r '[.data[]?.id | select(. == "gpt-5.3-codex" or startswith("gpt-5.3-codex"))][0] // empty' /tmp/openai-models.json)"
          if [ -n "$MODEL" ]; then
            echo "Codex connectivity: READY model=${MODEL}"
          else
            echo "::warning::OpenAI API authenticated, but gpt-5.3-codex was not listed for this key"
            echo "Codex connectivity: AUTHENTICATED"
          fi

      - name: Check Claude API connectivity on staging
        id: claude_connect
        if: matrix.environment == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          CLAUDE_KEY="${ANTHROPIC_API_KEY:-${CLAUDE_API_KEY:-}}"
          STATUS="$(curl -sS -o /tmp/claude-models.json -w '%{http_code}' \
            -H "x-api-key: ${CLAUDE_KEY}" \
            -H "anthropic-version: 2023-06-01" \
            https://api.anthropic.com/v1/models)"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            TYPE="$(jq -r '.error.type // "unknown"' /tmp/claude-models.json 2>/dev/null || true)"
            echo "::error::Claude connectivity failed: HTTP ${STATUS}, type=${TYPE}"
            exit 1
          fi
          MODEL="$(jq -r '[.data[]?.id | select(. == "claude-sonnet-5" or . == "claude-sonnet-4-6" or startswith("claude-sonnet-4-5"))][0] // empty' /tmp/claude-models.json)"
          if [ -n "$MODEL" ]; then
            echo "Claude connectivity: READY model=${MODEL}"
          else
            echo "::warning::Anthropic API authenticated, but no supported Sonnet model was listed for this key"
            echo "Claude connectivity: AUTHENTICATED"
          fi

      - name: Enforce staging agent connectivity
        if: matrix.environment == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          echo "Codex connectivity outcome: ${{ steps.codex_connect.outcome }}"
          echo "Claude connectivity outcome: ${{ steps.claude_connect.outcome }}"
          if [ "${{ steps.codex_connect.outcome }}" != "success" ] || [ "${{ steps.claude_connect.outcome }}" != "success" ]; then
            echo "::error::CONFIGURATION_REQUIRED: one or more agent provider connectivity checks failed"
            exit 1
          fi
          echo "Agent provider wiring is connected. Billing/funding is intentionally not enforced by this check."
