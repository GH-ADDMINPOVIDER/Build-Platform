name: OGENIC Phase VI Agent Credential Check

on:
  push:
    branches: [phase-vi-unified-cloudflare]
    paths:
      - ".github/workflows/phase-vi-agent-credential-check.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}

jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging]
    steps:
      - uses: actions/checkout@v4

      - name: Auto-discover Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: ${{ matrix.environment }}
          secret-path: /

      - name: Report agent credential presence without revealing values
        shell: bash
        run: |
          set -euo pipefail
          report() {
            name="$1"
            if [ -n "${!name:-}" ]; then
              echo "${name}=PRESENT"
            else
              echo "${name}=MISSING"
            fi
          }

          echo "Environment: ${{ matrix.environment }}"
          report OPENAI_API_KEY
          report OPENAI_PROJECT_ID
          report ANTHROPIC_API_KEY
          report CLAUDE_API_KEY
          report AUSTRA_API_KEY
          report OGENIC_OPS_KEY
