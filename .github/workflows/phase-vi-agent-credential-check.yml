name: OGENIC Phase VI Agent Credential Check

on:
  push:
    branches: [phase-vi-unified-cloudflare]
    paths:
      - ".github/workflows/phase-vi-agent-credential-check.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}

jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging]
    steps:
      - uses: actions/checkout@v4

      - name: Auto-discover Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: ${{ matrix.environment }}
          secret-path: /

      - name: Report agent credential presence without revealing values
        shell: bash
        run: |
          set -euo pipefail
          report() {
            name="$1"
            if [ -n "${!name:-}" ]; then
              echo "${name}=PRESENT"
            else
              echo "${name}=MISSING"
            fi
          }

          echo "Environment: ${{ matrix.environment }}"
          report OPENAI_API_KEY
          report OPENAI_PROJECT_ID
          report ANTHROPIC_API_KEY
          report CLAUDE_API_KEY
          report AUSTRA_API_KEY
          report OGENIC_OPS_KEY

      - name: Require staging Codex and Claude credentials
        if: matrix.environment == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::CONFIGURATION_REQUIRED: OPENAI_API_KEY missing from Infisical staging"
            exit 1
          fi
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${CLAUDE_API_KEY:-}" ]; then
            echo "::error::CONFIGURATION_REQUIRED: ANTHROPIC_API_KEY or CLAUDE_API_KEY missing from Infisical staging"
            exit 1
          fi

      - name: Smoke Codex API on staging
        if: matrix.environment == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          HEADERS=(-H "Authorization: Bearer ${OPENAI_API_KEY}" -H "Content-Type: application/json")
          if [ -n "${OPENAI_PROJECT_ID:-}" ]; then
            HEADERS+=(-H "OpenAI-Project: ${OPENAI_PROJECT_ID}")
          fi
          STATUS="$(curl -sS -o /tmp/openai-response.json -w '%{http_code}' \
            "${HEADERS[@]}" \
            -X POST https://api.openai.com/v1/responses \
            --data '{"model":"gpt-5.3-codex","input":"Reply exactly OGENIC_CODEX_READY","max_output_tokens":32,"store":false}')"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            CODE="$(jq -r '.error.code // .error.type // "unknown"' /tmp/openai-response.json 2>/dev/null || true)"
            echo "::error::Codex smoke failed: HTTP ${STATUS}, code=${CODE}"
            exit 1
          fi
          jq -e '.id and (.status == "completed" or .status == "in_progress")' /tmp/openai-response.json >/dev/null
          echo "Codex staging smoke: READY"

      - name: Smoke Claude API on staging
        if: matrix.environment == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          CLAUDE_KEY="${ANTHROPIC_API_KEY:-${CLAUDE_API_KEY:-}}"
          STATUS="$(curl -sS -o /tmp/claude-response.json -w '%{http_code}' \
            -H "x-api-key: ${CLAUDE_KEY}" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -X POST https://api.anthropic.com/v1/messages \
            --data '{"model":"claude-sonnet-5","max_tokens":32,"messages":[{"role":"user","content":"Reply exactly OGENIC_CLAUDE_READY"}]}')"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            TYPE="$(jq -r '.error.type // "unknown"' /tmp/claude-response.json 2>/dev/null || true)"
            echo "::error::Claude smoke failed: HTTP ${STATUS}, type=${TYPE}"
            exit 1
          fi
          jq -e '.id and .type == "message"' /tmp/claude-response.json >/dev/null
          echo "Claude staging smoke: READY"
