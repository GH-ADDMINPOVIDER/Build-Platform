name: OGENIC Phase VI CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - "worker/**"
      - "config/**"
      - "tests/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/phase-vi-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate unified toolkit contract
        run: python scripts/validate_toolkit.py

      - name: Install dependencies
        run: npm install --package-lock-only && npm ci

      - name: Autonomous WAVE command contract tests
        run: node --test tests/wave-command-contract.test.mjs tests/athena-guarded-command-handoff.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build Cloudflare application
        run: npm run build

      - name: Verify generated Cloudflare deployment config
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/ogenic_phase_vi/wrangler.json
          test -d dist/client
          test -f dist/client/index.html
          grep -q 'ogenic-phase-vi' dist/ogenic_phase_vi/wrangler.json

      - name: Upload staging build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogenic-phase-vi-staging-build
          path: dist/
          if-no-files-found: error
