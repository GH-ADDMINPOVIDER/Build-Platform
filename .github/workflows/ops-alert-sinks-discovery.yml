name: GH2 WAVE Slack Atlassian Statuspage Credentials Readiness
on:
  push:
    branches: [feat/ccs-multi-protocol-docker-20261023]
    paths:
      - 'scripts/ops-alert-sinks-discovery.mjs'
      - '.github/workflows/ops-alert-sinks-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  credential-names-only:
    if: github.repository == 'Wave-Runner-2/Build-Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
      INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || 'ogenic-sio-ti-rv' }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: staging
          secret-path: /
          recursive: true
      - name: Inspect Slack Statuspage Discord OpenAI credential names without values
        run: node scripts/ops-alert-sinks-discovery.mjs
      - name: Readiness does not certify external integration
        run: echo 'ACTUAL_PROVIDER_SEND=NOT_EXECUTED; STATUSPAGE_INCIDENT_NOT_CHANGED'
