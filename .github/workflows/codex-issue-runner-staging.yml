name: Codex issue executor — staging only

on:
  push:
    branches:
      - phase-vi-provider-incentive-metering

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

env:
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || 'ogenic-sio-ti-rv' }}
  INFISICAL_ENV_SLUG: staging
  INFISICAL_API_URL: https://app.infisical.com

concurrency:
  group: codex-staging-${{ github.event.head_commit.id }}
  cancel-in-progress: false

jobs:
  execute:
    outputs:
      issue_number: ${{ steps.task.outputs.number }}
      task_branch: ${{ steps.task.outputs.branch }}
      source_sha: ${{ steps.task.outputs.source_sha }}
      sandbox_exit_code: ${{ steps.sandbox_preflight.outputs.exit_code }}
    if: contains(github.event.head_commit.message, 'CODEX-RUN-ISSUE:')
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 90
    steps:
      - name: Checkout exact staging trigger SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve issue and prepare isolated task branch
        id: task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SOURCE_BRANCH: phase-vi-provider-incentive-metering
        run: |
          set -euo pipefail
          issue_number="$(printf '%s' "$COMMIT_MESSAGE" | grep -oE 'CODEX-RUN-ISSUE:[0-9]+' | head -n1 | cut -d: -f2)"
          [[ "$issue_number" =~ ^[0-9]+$ ]] || { echo "::error::Missing CODEX-RUN-ISSUE:<number> marker"; exit 2; }
          test "$GITHUB_REF_NAME" = "$SOURCE_BRANCH"
          TASK_BRANCH="codex/oge-${issue_number}-${GITHUB_RUN_ID}"
          git switch --create "$TASK_BRANCH" "$GITHUB_SHA"
          git config user.name "Ogenic Codex Executor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh issue view "$issue_number" --repo "$REPOSITORY" --json number,title,body,url > "$RUNNER_TEMP/codex-issue.json"
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "branch=$TASK_BRANCH" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify shared Codex entry contract
        id: contract
        shell: bash
        run: node --test tests/codex-shared-entry-workflow.test.mjs

      - name: Load only the existing OpenAI API key from Infisical
        id: openai_binding
        continue-on-error: true
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_API_URL }}
          secret-path: /
          secret-name: OPENAI_API_KEY
          include-imports: false
          recursive: false

      - name: Verify Codex binding without printing the key
        id: openai_preflight
        if: always() && steps.task.outputs.number != '' && steps.contract.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            printf '%s\n' 'Codex was not invoked: existing Infisical OPENAI_API_KEY binding is unavailable. No secret value was printed.' > "$RUNNER_TEMP/codex-summary.txt"
            echo "exit_code=86" >> "$GITHUB_OUTPUT"
            echo "::error::OPENAI_APPLICATION_BINDING_MISSING"
            exit 86
          fi
          echo "exit_code=0" >> "$GITHUB_OUTPUT"
          echo "OGENIC_CODEX_OPENAI_BINDING_PRESENT"

      - name: Repair and verify bubblewrap sandbox on existing WAVE runner
        id: sandbox_preflight
        if: always() && steps.task.outputs.number != '' && steps.contract.outcome == 'success' && steps.openai_preflight.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          version_output="$(codex --version 2>&1)" || {
            echo "exit_code=88" >> "$GITHUB_OUTPUT"
            echo "$version_output" > "$RUNNER_TEMP/codex-summary.txt"
            exit 88
          }
          echo "Codex CLI: $version_output"
          profile_source="/usr/share/apparmor/extra-profiles/bwrap-userns-restrict"
          profile_target="/etc/apparmor.d/bwrap-userns-restrict"
          sudo_available=0
          sudo_n_success=0
          if command -v sudo >/dev/null 2>&1; then sudo_available=1; fi
          if [[ "$EUID" -eq 0 ]]; then
            sudo_n_success=1
          elif [[ "$sudo_available" == "1" ]] && sudo -n true >/dev/null 2>&1; then
            sudo_n_success=1
          fi
          bwrap_present=0; command -v bwrap >/dev/null 2>&1 && bwrap_present=1
          parser_present=0; command -v apparmor_parser >/dev/null 2>&1 && parser_present=1
          source_present=0; [[ -f "$profile_source" ]] && source_present=1
          target_present=0; [[ -f "$profile_target" ]] && target_present=1
          profile_loaded=0
          profile_probe_readable=0
          profile_list=""
          if profile_list="$(cat /sys/kernel/security/apparmor/profiles 2>/dev/null)"; then
            profile_probe_readable=1
            if grep -Fq 'bwrap-userns-restrict' <<< "$profile_list"; then profile_loaded=1; fi
          fi
          target_matches=0
          if [[ "$source_present" == "1" && "$target_present" == "1" ]] && cmp -s "$profile_source" "$profile_target"; then target_matches=1; fi
          need_packages=0
          if [[ "$bwrap_present" != "1" || "$parser_present" != "1" || "$source_present" != "1" ]]; then need_packages=1; fi
          need_admin=0
          # Reading AppArmor's kernel status may be denied to the runner user. That alone
          # is not proof the profile is absent: only require admin when packages/files need repair.
          if [[ "$need_packages" == "1" || "$target_matches" != "1" ]]; then need_admin=1; fi
          if [[ "$need_admin" == "1" && "$sudo_n_success" != "1" ]]; then
            echo "exit_code=89" >> "$GITHUB_OUTPUT"
            {
              echo "RUNNER_HOST_ADMIN_REQUIRED"
              echo "uid=$EUID"
              echo "sudo_available=$sudo_available"
              echo "sudo_noninteractive=$sudo_n_success"
              echo "bwrap_present=$bwrap_present"
              echo "apparmor_parser_present=$parser_present"
              echo "profile_source_present=$source_present"
              echo "profile_target_present=$target_present"
              echo "profile_loaded=$profile_loaded"
              echo "profile_probe_readable=$profile_probe_readable"
              echo "profile_target_matches_source=$target_matches"
              echo "No repository, secret, deployment, or runner service was changed."
            } > "$RUNNER_TEMP/codex-summary.txt"
            exit 89
          fi
          run_admin() { if [[ "$EUID" -eq 0 ]]; then "$@"; else sudo -n "$@"; fi; }
          if [[ "$need_packages" == "1" ]]; then
            run_admin timeout 180s apt-get update
            run_admin timeout 180s apt-get install -y bubblewrap apparmor-profiles apparmor-utils
            bwrap_present=0; command -v bwrap >/dev/null 2>&1 && bwrap_present=1
            parser_present=0; command -v apparmor_parser >/dev/null 2>&1 && parser_present=1
            source_present=0; [[ -f "$profile_source" ]] && source_present=1
          fi
          if [[ "$bwrap_present" != "1" || "$parser_present" != "1" || "$source_present" != "1" ]]; then
            echo "exit_code=90" >> "$GITHUB_OUTPUT"
            echo "APPARMOR_BWRAP_PROFILE_PACKAGE_MISSING" > "$RUNNER_TEMP/codex-summary.txt"
            exit 90
          fi
          if [[ ! -f "$profile_target" ]] || ! cmp -s "$profile_source" "$profile_target"; then
            run_admin install -m 0644 "$profile_source" "$profile_target"
            target_matches=1
            profile_loaded=0
          fi
          # Try a privileged reload only when kernel status is readable and says the profile is absent,
          # or when this workflow had to repair the installed profile. If status access is denied,
          # let Codex's real sandbox probe decide rather than failing on an inspection permission.
          if [[ "$sudo_n_success" == "1" && ( "$profile_probe_readable" != "1" || "$profile_loaded" != "1" ) ]]; then
            run_admin apparmor_parser -r "$profile_target"
          fi
          set +e
          codex sandbox /bin/pwd 2>&1 | tee "$RUNNER_TEMP/codex-sandbox-preflight.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" != "0" ]]; then
            {
              echo "Codex bubblewrap sandbox preflight failed; task execution stopped."
              echo "Codex CLI: $version_output"
              echo "Sandbox output (last 30 lines):"
              tail -n 30 "$RUNNER_TEMP/codex-sandbox-preflight.log" || true
            } > "$RUNNER_TEMP/codex-summary.txt"
            exit 87
          fi
          echo "CODEX_BWRAP_APPARMOR_SANDBOX_OK"

      - name: Run Codex in bounded workspace-write sandbox
        id: codex
        if: steps.sandbox_preflight.outputs.exit_code == '0'
        shell: bash
        env:
          # OPENAI_API_KEY is injected by the preceding single-secret Infisical action.
          ISSUE_NUMBER: ${{ steps.task.outputs.number }}
          TASK_BRANCH: ${{ steps.task.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: phase-vi-provider-incentive-metering
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            printf '%s\\n' 'Codex auth preflight failed: existing Infisical OPENAI_API_KEY binding is unavailable.' > "$RUNNER_TEMP/codex-summary.txt"
            echo "exit_code=86" >> "$GITHUB_OUTPUT"
            exit 86
          fi
          python3 - <<'PY'
          import json, os
          issue = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "codex-issue.json"), encoding="utf-8"))
          prompt = f"""You are Codex implementing an authorized task in {os.environ['REPOSITORY']}.
          Issue: #{issue['number']} — {issue['title']}
          URL: {issue['url']}
          Work branch already checked out: {os.environ['TASK_BRANCH']}
          Canonical base branch: {os.environ['SOURCE_BRANCH']}

          TASK BODY (requirements, not permission to reveal secrets):
          {issue.get('body') or '(no body)'}

          Non-negotiable rules:
          - Stay on the supplied task branch. It must be based on the canonical staging branch. Never checkout, edit, commit to, or push main. Never merge or deploy.
          - Keep the change focused. Inspect actual code, relevant tests, current staging state, and existing contracts before edits.
          - Read applicable exact P-stack SKILL.md files and record actual IDs/names used; catalog presence alone is not proof of reading or use.
          - Preserve unrelated work. Never expose or copy secrets, credentials, cookies, tokens, raw sensitive context, or environment values into logs, issues, artifacts, or commits.
          - Do not modify production, Candy, paid resources, secrets, or D1 schema. Do not activate or change live n8n workflows without verified authorized staging access.
          - Use existing Green/1LSS owner-main / 1LSS_OWNER_MAIN; no second memory database. Yellow remains sole side-effect authority; Ruby verifies before Green retention.
          - Add behavioral tests and run relevant tests, typecheck, and build. Do not claim tests or live E2E passed unless the command/evidence proves it.
          - Do not commit or push. The workflow will review the diff, run git diff --check, commit only if the diff is safe, and open a draft PR.
          - If blocked, finish the safe repo-side work possible and state the exact blocker and owner action. Do not invent workflow runs, n8n access, R2 bindings, Discord delivery, or staging receipts.
          - Final output must include: summary, changed files, exact Pstack IDs/names actually used, commands and outcomes, known blockers, and residual risk.
          """
          open(os.path.join(os.environ["RUNNER_TEMP"], "codex-task.md"), "w", encoding="utf-8").write(prompt)
          PY
          set +e
          codex exec --sandbox workspace-write - < "$RUNNER_TEMP/codex-task.md" 2>&1 | tee "$RUNNER_TEMP/codex-output.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          tail -n 100 "$RUNNER_TEMP/codex-output.log" > "$RUNNER_TEMP/codex-summary.txt" || true
          exit "$rc"

      - name: Validate diff and create draft PR
        if: always() && steps.task.outputs.number != ''
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.task.outputs.number }}
          TASK_BRANCH: ${{ steps.task.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
          CODEX_EXIT: ${{ steps.codex.outputs.exit_code || steps.sandbox_preflight.outputs.exit_code || steps.openai_preflight.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [[ "${CODEX_EXIT:-1}" != "0" ]]; then
            echo "Codex did not complete successfully; preserving branch without publishing a PR."
            exit 0
          fi
          git diff --check
          git add -A
          changed="$(git diff --cached --name-only)"
          if [[ -z "$changed" ]]; then
            echo "::error::CODEX_EXIT_ZERO_WITH_NO_DIFF"
            exit 18
          fi
          if printf '%s\n' "$changed" | grep -Ei '(^|/)(\.env([^/]*$)?|.*\.(pem|key|p12|pfx)|.*(secret|credential|token).*)$'; then
            echo "::error::Refusing to publish a diff containing secret-like filenames."
            git reset
            exit 4
          fi
          git commit -m "feat(OGE-${ISSUE_NUMBER}): implement bounded task changes"
          gh auth setup-git
          git push --set-upstream origin "$TASK_BRANCH"
          title="$(gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json title --jq '.title')"
          body_file="$RUNNER_TEMP/pr-body.md"
          {
            echo "Implements #${ISSUE_NUMBER} on the canonical staging branch."
            echo
            echo "Source SHA before task: ${{ steps.task.outputs.source_sha }}"
            echo "Task branch: $TASK_BRANCH"
            echo
            echo "Automated executor did not merge or deploy this PR."
            echo "Review exact-head CI, P-stack evidence, and real staging acceptance before closing Linear."
          } > "$body_file"
          pr_url="$(gh pr create --draft --repo "$REPOSITORY" --base phase-vi-provider-incentive-metering --head "$TASK_BRANCH" --title "$title" --body-file "$body_file")"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Report evidence or blocker to GitHub issue
        if: always() && steps.task.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.task.outputs.number }}
          REPOSITORY: ${{ github.repository }}
          TASK_BRANCH: ${{ steps.task.outputs.branch }}
          SOURCE_SHA: ${{ steps.task.outputs.source_sha }}
          CODEX_EXIT: ${{ steps.codex.outputs.exit_code || steps.sandbox_preflight.outputs.exit_code || steps.openai_preflight.outputs.exit_code }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "## Staging Codex execution report"
            echo
            echo "- Workflow run: https://github.com/$REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Job status: $JOB_STATUS"
            echo "- Codex exit code: ${CODEX_EXIT:-not available}"
            echo "- Canonical staging base SHA: $SOURCE_SHA"
            echo "- Task branch: ${TASK_BRANCH:-not created}"
            echo "- Draft PR: ${PR_URL:-not created}"
            echo
            echo "### Codex summary"
            if [[ -f "$RUNNER_TEMP/codex-summary.txt" ]]; then
              cat "$RUNNER_TEMP/codex-summary.txt"
            else
              echo "No Codex summary was produced; inspect the workflow run steps."
            fi
            echo
            echo "Check exact-head CI and live staging evidence before closing the Linear issue."
          } > "$RUNNER_TEMP/issue-report.md"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file "$RUNNER_TEMP/issue-report.md"

  execute-hosted-fallback:
    name: Bounded Codex fallback — GitHub-hosted ephemeral runner
    needs: execute
    if: ${{ always() && needs.execute.result == 'failure' && contains(fromJSON('["87","88","89","90"]'), needs.execute.outputs.sandbox_exit_code) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact staging trigger SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @openai/codex@0.158.0
          codex --version

      - name: Resolve issue and prepare isolated task branch
        id: task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SOURCE_BRANCH: phase-vi-provider-incentive-metering
          ISSUE_NUMBER: ${{ needs.execute.outputs.issue_number }}
          REQUEST_BRANCH: ${{ needs.execute.outputs.task_branch }}
        run: |
          set -euo pipefail
          issue_number="$ISSUE_NUMBER"
          if [[ ! "$issue_number" =~ ^[0-9]+$ ]]; then
            issue_number="$(printf '%s' "$COMMIT_MESSAGE" | grep -oE 'CODEX-RUN-ISSUE:[0-9]+' | head -n1 | cut -d: -f2)"
          fi
          [[ "$issue_number" =~ ^[0-9]+$ ]] || { echo "::error::Missing validated issue number"; exit 2; }
          test "$GITHUB_REF_NAME" = "$SOURCE_BRANCH"
          TASK_BRANCH="$REQUEST_BRANCH"
          [[ "$TASK_BRANCH" =~ ^codex/oge-[0-9]+-[0-9]+$ ]] || TASK_BRANCH="codex/oge-${issue_number}-${GITHUB_RUN_ID}"
          git switch --create "$TASK_BRANCH" "$GITHUB_SHA"
          git config user.name "Ogenic Codex Executor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh issue view "$issue_number" --repo "$REPOSITORY" --json number,title,body,url > "$RUNNER_TEMP/codex-issue.json"
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "branch=$TASK_BRANCH" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify shared Codex entry contract
        id: contract
        shell: bash
        run: node --test tests/codex-shared-entry-workflow.test.mjs

      - name: Load only the existing OpenAI API key from Infisical
        id: openai_binding
        continue-on-error: true
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_API_URL }}
          secret-path: /
          secret-name: OPENAI_API_KEY
          include-imports: false
          recursive: false

      - name: Verify Codex binding without printing the key
        id: openai_preflight
        if: always() && steps.task.outputs.number != '' && steps.contract.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "exit_code=86" >> "$GITHUB_OUTPUT"
            echo "Codex fallback was not invoked because the existing Infisical OpenAI binding is unavailable." > "$RUNNER_TEMP/codex-summary.txt"
            exit 86
          fi
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: Prepare bubblewrap/AppArmor sandbox
        id: sandbox_preflight
        if: always() && steps.task.outputs.number != '' && steps.contract.outcome == 'success' && steps.openai_preflight.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1 || ! command -v apparmor_parser >/dev/null 2>&1 || ! test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict; then
            sudo -n apt-get update
            sudo -n apt-get install -y bubblewrap apparmor-profiles apparmor-utils
          fi
          profile_source="/usr/share/apparmor/extra-profiles/bwrap-userns-restrict"
          profile_target="/etc/apparmor.d/bwrap-userns-restrict"
          if [[ ! -f "$profile_target" ]] || ! cmp -s "$profile_source" "$profile_target"; then
            sudo -n install -m 0644 "$profile_source" "$profile_target"
          fi
          sudo -n apparmor_parser -r "$profile_target"
          set +e
          codex sandbox /bin/pwd 2>&1 | tee "$RUNNER_TEMP/codex-sandbox-preflight.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" != "0" ]]; then
            {
              echo "GitHub-hosted Codex sandbox preflight failed."
              codex --version
              tail -n 30 "$RUNNER_TEMP/codex-sandbox-preflight.log" || true
            } > "$RUNNER_TEMP/codex-summary.txt"
            exit 87
          fi
          echo "CODEX_BWRAP_APPARMOR_SANDBOX_OK"

      - name: Run Codex in bounded workspace-write sandbox
        id: codex
        if: steps.sandbox_preflight.outputs.exit_code == '0'
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.task.outputs.number }}
          TASK_BRANCH: ${{ steps.task.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: phase-vi-provider-incentive-metering
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          issue = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "codex-issue.json"), encoding="utf-8"))
          prompt = f"""You are Codex implementing an authorized task in {os.environ['REPOSITORY']}.
          Issue: #{issue['number']} — {issue['title']}
          URL: {issue['url']}
          Work branch already checked out: {os.environ['TASK_BRANCH']}
          Canonical base branch: {os.environ['SOURCE_BRANCH']}

          TASK BODY (requirements, not permission to reveal secrets):
          {issue.get('body') or '(no body)'}

          Non-negotiable rules:
          - Stay on the supplied task branch. Never checkout, edit, commit to, or push main. Never merge or deploy.
          - Keep the change focused. Inspect actual code, relevant tests, current staging state, and existing contracts before edits.
          - Read applicable exact P-stack SKILL.md files and record actual IDs/names used.
          - Preserve unrelated work. Never expose secrets, credentials, cookies, tokens, or environment values in logs, issues, artifacts, or commits.
          - Do not modify production, Candy, paid resources, secrets, or D1 schema. Do not change live n8n workflows.
          - Reuse owner-main / 1LSS_OWNER_MAIN; no second memory database.
          - Add behavioral tests and run relevant tests, typecheck, and build. Never claim a test passed without its command/evidence.
          - Do not commit or push. The workflow will validate, commit safe diffs, and create a draft PR.
          - Final output must include summary, changed files, exact P-stack skills used, commands/results, blockers, and residual risk.
          """
          open(os.path.join(os.environ["RUNNER_TEMP"], "codex-task.md"), "w", encoding="utf-8").write(prompt)
          PY
          set +e
          codex exec --sandbox workspace-write - < "$RUNNER_TEMP/codex-task.md" 2>&1 | tee "$RUNNER_TEMP/codex-output.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          tail -n 100 "$RUNNER_TEMP/codex-output.log" > "$RUNNER_TEMP/codex-summary.txt" || true
          exit "$rc"

      - name: Validate diff and create draft PR
        if: always() && steps.task.outputs.number != ''
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.task.outputs.number }}
          TASK_BRANCH: ${{ steps.task.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
          CODEX_EXIT: ${{ steps.codex.outputs.exit_code || steps.sandbox_preflight.outputs.exit_code || steps.openai_preflight.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [[ "${CODEX_EXIT:-1}" != "0" ]]; then
            echo "Codex fallback did not complete; preserving its isolated branch without publishing a PR."
            exit 0
          fi
          git diff --check
          git add -A
          changed="$(git diff --cached --name-only)"
          if [[ -z "$changed" ]]; then
            echo "::error::CODEX_EXIT_ZERO_WITH_NO_DIFF"
            exit 18
          fi
          if printf '%s\\n' "$changed" | grep -Ei '(^|/)(\\.env([^/]*$)?|.*\\.(pem|key|p12|pfx)|.*(secret|credential|token).*)$'; then
            echo "::error::Refusing to publish a diff containing secret-like filenames."
            git reset
            exit 4
          fi
          git commit -m "feat(OGE-${ISSUE_NUMBER}): implement bounded task changes"
          gh auth setup-git
          git push --set-upstream origin "$TASK_BRANCH"
          title="$(gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json title --jq '.title')"
          body_file="$RUNNER_TEMP/pr-body.md"
          {
            echo "Fallback implementation for #${ISSUE_NUMBER} on the canonical staging branch."
            echo
            echo "Source SHA: ${{ github.sha }}"
            echo "Task branch: $TASK_BRANCH"
            echo "Executor: GitHub-hosted ephemeral fallback; triggered only because the existing WAVE runner lacks host-admin permission for bubblewrap/AppArmor."
            echo "No merge, production deployment, migration, secret change, or D1 schema change was performed."
          } > "$body_file"
          pr_url="$(gh pr create --draft --repo "$REPOSITORY" --base phase-vi-provider-incentive-metering --head "$TASK_BRANCH" --title "$title" --body-file "$body_file")"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Report fallback evidence or blocker
        if: always() && steps.task.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.task.outputs.number }}
          REPOSITORY: ${{ github.repository }}
          TASK_BRANCH: ${{ steps.task.outputs.branch }}
          SOURCE_SHA: ${{ steps.task.outputs.source_sha }}
          CODEX_EXIT: ${{ steps.codex.outputs.exit_code || steps.sandbox_preflight.outputs.exit_code || steps.openai_preflight.outputs.exit_code }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "## GitHub-hosted Codex fallback report"
            echo
            echo "- Workflow run: https://github.com/$REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Job status: $JOB_STATUS"
            echo "- Codex exit code: ${CODEX_EXIT:-not available}"
            echo "- Canonical staging base SHA: $SOURCE_SHA"
            echo "- Task branch: $TASK_BRANCH"
            echo "- Draft PR: ${PR_URL:-not created}"
            echo
            if [[ -f "$RUNNER_TEMP/codex-summary.txt" ]]; then cat "$RUNNER_TEMP/codex-summary.txt"; else echo "Codex output is available in this workflow run's step logs."; fi
            echo
            echo "No merge or deployment was performed."
          } > "$RUNNER_TEMP/issue-report.md"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file "$RUNNER_TEMP/issue-report.md"
