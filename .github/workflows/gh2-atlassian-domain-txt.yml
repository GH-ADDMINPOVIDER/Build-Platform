name: Owner Atlassian WAVE Domain DNS TXT Verify
on:
  push:
    branches: [feat/ccs-multi-protocol-docker-20261023]
    paths:
      - 'scripts/gh2-atlassian-domain-txt.mjs'
      - '.github/workflows/gh2-atlassian-domain-txt.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  wave-atlassian-txt:
    if: github.repository == 'Wave-Runner-2/Build-Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
      INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || 'ogenic-sio-ti-rv' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authorized Infisical GitHub OIDC scoped staging credentials
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: staging
          secret-path: /
          recursive: true
      - name: Create only exact Atlassian TXT in authoritative Cloudflare zone and GET readback
        run: node scripts/gh2-atlassian-domain-txt.mjs
      - name: Preserve all existing WAVE routing
        if: always()
        run: echo 'NO_EXISTING_DNS_REPLACED; DNS_API_RECEIPT_IS_NOT_ATLASSIAN_VERIFIED'
