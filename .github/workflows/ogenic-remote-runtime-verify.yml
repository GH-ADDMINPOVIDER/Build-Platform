name: OGENIC Remote Runtime Verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ogenic-remote-runtime-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: apps/ogenic-control-tower
        run: npm ci
      - name: Verify production MCP end to end
        working-directory: apps/ogenic-control-tower
        env:
          OGENIC_STAGING_ORIGIN: https://ogenic-control-tower.vercel.app
        run: npm run test:remote
