name: OGENIC Unifiend Install Docker Compose CLI (No Containers)
on:
  push:
    branches: [Unified-on-Progress]
    paths: ['.github/workflows/oge-unifiend-compose-client.yml']
permissions:
  contents: read
jobs:
  install_client:
    if: github.repository == 'Wave-Runner-2/Build-Platform' && github.actor == 'Wave-Runner-2'
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 8
    steps:
      - name: Install verified official compose client to user home without root
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_NAME" = wave-runner-01
          test "$(id -un)" = unifiend
          test "$(uname -m)" = x86_64
          mkdir -p "$HOME/.docker/cli-plugins"
          binary="$HOME/.docker/cli-plugins/docker-compose"
          if [[ -x "$binary" ]] && "$binary" version | grep -q 'v5.6.0'; then
            echo COMPOSE_CLIENT_ALREADY_PRESENT=YES
          else
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            curl -fL --proto '=https' --tlsv1.2 --retry 2 --connect-timeout 15 --max-time 180 -o "$tmp/docker-compose" \
              https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64
            printf '%s  %s\n' '40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a' "$tmp/docker-compose" | sha256sum -c -
            echo COMPOSE_SHA256_VERIFIED=YES
            install -m 0755 "$tmp/docker-compose" "$binary"
          fi
          echo "COMPOSE_CLIENT_LOCATION=$binary"
          docker compose version
          echo COMPOSE_CLIENT_COMMAND_PASS=YES
          echo CONTAINERS_CREATED_OR_STARTED=NO
          echo ROOT_PRIVILEGES_USED=NO
          echo SECRETS_ACCESSED=NO
          echo PRODUCTION_DEPLOYED=NO
