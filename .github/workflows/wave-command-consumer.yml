# Staging-only default-branch registration; runs only on phase-vi staging ref.
name: WAVE Command Consumer
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Yellow-Stone / Owner-approved WAVE task id
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: wave-command-${{ inputs.task_id }}
  cancel-in-progress: false
env:
  WAVE_URL: https://wave.ogenicchocolate.com
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_ENV_SLUG: staging
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}
jobs:
  consume:
    if: github.repository == 'Wave-Runner-2/Build-Platform' && github.ref_name == 'phase-vi-provider-incentive-metering'
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 20
    steps:
      - name: Checkout staging, never main
        uses: actions/checkout@v4
        with:
          ref: phase-vi-provider-incentive-metering
          persist-credentials: false
          fetch-depth: 0
      - name: Verify task scope and secure Terminal Solo availability
        shell: bash
        env:
          WAVE_TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          [[ "$WAVE_TASK_ID" =~ ^wavecmd_[a-f0-9]{64}$ ]]
          test "$RUNNER_NAME" = wave-runner-01
          test "$(git branch --show-current)" = phase-vi-provider-incentive-metering
          test "$GITHUB_REF_NAME" = phase-vi-provider-incentive-metering
          test "$GITHUB_REPOSITORY" = Wave-Runner-2/Build-Platform
          test -f scripts/wave-terminal-solo.sh
          bash -n scripts/wave-terminal-solo.sh
          command -v flock >/dev/null
      - name: Discover Infisical staging identity via OIDC
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh
      - name: Load approved staging runtime authorization through Infisical OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true
      - name: Run ONLY through host-wide Terminal Solo + Yellow-approved consumer
        env:
          WAVE_TASK_ID: ${{ inputs.task_id }}
          WAVE_EVIDENCE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/wave-terminal-solo.sh
