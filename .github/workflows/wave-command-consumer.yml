# GH-ADDMINPROVIDER staging-only command admission on OCIAN-S-Host.
name: GH-ADDMINPROVIDER Command Consumer
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Yellow-Stone / Owner-approved WAVE task id
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: gh-addminprovider-command-${{ inputs.task_id }}
  cancel-in-progress: false
env:
  # Canonical runtime identity: configure once as GitHub repository variables.
  GH_ADDMINPROVIDER_REPOSITORY: \${{ vars.GH_ADDMINPROVIDER_REPOSITORY }}
  GH_ADDMINPROVIDER_HOST: \${{ vars.GH_ADDMINPROVIDER_HOST }}
  GH_ADDMINPROVIDER_STAGING_REF: \${{ vars.GH_ADDMINPROVIDER_STAGING_REF }}
  WAVE_URL: \${{ vars.GH_ADDMINPROVIDER_WAVE_URL }}
  INFISICAL_IDENTITY_ID: \${{ vars.INFISICAL_IDENTITY_ID }}
  INFISICAL_ORG_ID: \${{ vars.INFISICAL_ORG_ID }}
  INFISICAL_ORG_SLUG: \${{ vars.INFISICAL_ORG_SLUG }}
  INFISICAL_ENV_SLUG: \${{ vars.INFISICAL_ENV_SLUG }}
  INFISICAL_PROJECT_SLUG: \${{ vars.INFISICAL_PROJECT_SLUG }}
jobs:
  consume:
    if: github.repository == vars.GH_ADDMINPROVIDER_REPOSITORY && github.ref_name == vars.GH_ADDMINPROVIDER_STAGING_REF
    runs-on: ${{ fromJSON(vars.GH_ADDMINPROVIDER_RUNNER_LABELS_JSON) }}
    timeout-minutes: 20
    steps:
      - name: Checkout staging, never main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GH_ADDMINPROVIDER_STAGING_REF }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify GH-ADDMINPROVIDER scope and OCIAN-S-Host Terminal Solo availability
        shell: bash
        env:
          WAVE_TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          for required in GH_ADDMINPROVIDER_REPOSITORY GH_ADDMINPROVIDER_HOST GH_ADDMINPROVIDER_STAGING_REF WAVE_URL INFISICAL_IDENTITY_ID INFISICAL_ENV_SLUG; do
            test -n "${!required}"
          done
          [[ "$WAVE_TASK_ID" =~ ^wavecmd_[a-f0-9]{64}$ ]]
          test "$RUNNER_NAME" = "$GH_ADDMINPROVIDER_HOST"
          test "$(git branch --show-current)" = "$GH_ADDMINPROVIDER_STAGING_REF"
          test "$GITHUB_REF_NAME" = "$GH_ADDMINPROVIDER_STAGING_REF"
          test "$GITHUB_REPOSITORY" = "$GH_ADDMINPROVIDER_REPOSITORY"
          test -f scripts/wave-terminal-solo.sh
          bash -n scripts/wave-terminal-solo.sh
          command -v flock >/dev/null
      - name: Discover Infisical staging identity via OIDC
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh
      - name: Load approved staging runtime authorization through Infisical OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true
      - name: Run ONLY through OCIAN-S-Host Terminal Solo + Yellow-approved consumer
        env:
          WAVE_TASK_ID: ${{ inputs.task_id }}
          WAVE_EVIDENCE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/wave-terminal-solo.sh
