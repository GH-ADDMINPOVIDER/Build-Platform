name: GH-ADDMINPROVIDER Command Consumer

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Owner-approved WAVE command task ID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  # Per-task dispatch deduplication; a *stable host flock* enforces SOLO without coalescing other tasks.
  group: gh-addminprovider-command-${{ inputs.task_id }}
  cancel-in-progress: false

env:
  # GH-ADDMINPROVIDER is configured once as repository variables; no legacy identity is embedded here.
  GH_ADDMINPROVIDER_REPOSITORY: \${{ vars.GH_ADDMINPROVIDER_REPOSITORY }}
  GH_ADDMINPROVIDER_HOST: \${{ vars.GH_ADDMINPROVIDER_HOST }}
  GH_ADDMINPROVIDER_STAGING_REF: \${{ vars.GH_ADDMINPROVIDER_STAGING_REF }}
  WAVE_URL: \${{ vars.GH_ADDMINPROVIDER_WAVE_URL }}
  INFISICAL_IDENTITY_ID: \${{ vars.INFISICAL_IDENTITY_ID }}
  INFISICAL_ORG_ID: \${{ vars.INFISICAL_ORG_ID }}
  INFISICAL_ORG_SLUG: \${{ vars.INFISICAL_ORG_SLUG }}
  INFISICAL_ENV_SLUG: \${{ vars.INFISICAL_ENV_SLUG }}
  INFISICAL_PROJECT_SLUG: \${{ vars.INFISICAL_PROJECT_SLUG }}
jobs:
  consume:
    if: github.ref_name == 'phase-vi-provider-incentive-metering'
    runs-on: ${{ fromJSON(vars.GH_ADDMINPROVIDER_RUNNER_LABELS_JSON) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.GH_ADDMINPROVIDER_STAGING_REF }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate task scope
        shell: bash
        env:
          WAVE_TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          for required in GH_ADDMINPROVIDER_REPOSITORY GH_ADDMINPROVIDER_HOST GH_ADDMINPROVIDER_STAGING_REF WAVE_URL INFISICAL_IDENTITY_ID INFISICAL_ENV_SLUG; do
            test -n "${!required}"
          done
          [[ "$WAVE_TASK_ID" =~ ^wavecmd_[a-f0-9]{64}$ ]]
          test "$(git branch --show-current)" = "phase-vi-provider-incentive-metering"
          test "$(hostname)" = "wave-runner-01"

      - name: Discover Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load runtime authorization through Infisical OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true

      - name: Execute owner-approved command
        env:
          WAVE_TASK_ID: ${{ inputs.task_id }}
          WAVE_EVIDENCE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/wave-terminal-solo.sh
