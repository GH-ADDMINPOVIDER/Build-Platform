name: WAVE Command Consumer

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Owner-approved WAVE command task ID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: wave-command-${{ inputs.task_id }}
  cancel-in-progress: false

env:
  WAVE_URL: https://wave.ogenicchocolate.com
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}

jobs:
  consume:
    if: github.ref_name == 'phase-vi-provider-incentive-metering'
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-vi-provider-incentive-metering
          fetch-depth: 0

      - name: Validate task scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.task_id }}" =~ ^wavecmd_[a-f0-9]{64}$ ]]
          test "$(git branch --show-current)" = "phase-vi-provider-incentive-metering"
          test "$(hostname)" = "wave-runner-01"

      - name: Discover Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh

      - name: Load runtime authorization through Infisical OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
          recursive: true

      - name: Execute owner-approved command
        env:
          WAVE_TASK_ID: ${{ inputs.task_id }}
          WAVE_EVIDENCE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/wave-command-consumer.mjs
