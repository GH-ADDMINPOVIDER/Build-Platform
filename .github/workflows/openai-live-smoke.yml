name: OpenAI Live Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
  INFISICAL_ORG_ID: ${{ vars.INFISICAL_ORG_ID || 'ccafcbb6-950c-47d5-96f8-7023961895a5' }}
  INFISICAL_ORG_SLUG: ${{ vars.INFISICAL_ORG_SLUG || 'ogenic-sio-r5-nd' }}
  INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || '' }}

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Auto-discover Infisical project
        id: infisical_project
        shell: bash
        run: bash scripts/infisical-discover-project.sh
      - name: Load staging secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG || steps.infisical_project.outputs.project_slug }}
          env-slug: staging
          secret-path: /
      - name: Run one bounded Luna inference
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "::error::OPENAI_API_KEY missing"; exit 1; }
          cat >/tmp/request.json <<'JSON'
          {"model":"gpt-5.6-luna","input":"Reply exactly: OK","max_output_tokens":32,"store":false}
          JSON
          STATUS="$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @/tmp/request.json \
            https://api.openai.com/v1/responses)"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            CODE="$(jq -r '.error.code // .error.type // "unknown"' /tmp/response.json 2>/dev/null || true)"
            echo "::error::OpenAI live smoke failed: HTTP ${STATUS}, code=${CODE}"
            exit 1
          fi
          TEXT="$(jq -r '[.output[]?.content[]? | select(.type=="output_text") | .text] | join("\n")' /tmp/response.json)"
          TOKENS="$(jq -r '.usage.total_tokens // 0' /tmp/response.json)"
          echo "OpenAI live smoke: SUCCESS"
          echo "model=gpt-5.6-luna total_tokens=${TOKENS}"
          echo "output=${TEXT}"
          test "$TEXT" = "OK"
