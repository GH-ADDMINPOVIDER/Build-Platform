name: OGENIC WAVE Standby Tools Activation Proof
on:
  push:
    branches: [phase-vi-provider-incentive-metering]
    paths:
      - .github/workflows/oge-wave-tools-activation-proof.yml
      - .github/actions/ogenic-wave-tools/action.yml
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'Wave-Runner-2/Build-Platform' && github.actor == 'Wave-Runner-2'
    runs-on: [self-hosted, linux, x64, wave]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Activate installed toolkit for this workflow only
        uses: ./.github/actions/ogenic-wave-tools
      - name: Run no-network smoke of all tool entrypoints
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          command -v rg
          command -v yq
          command -v uv
          command -v uvx
          command -v infisical
          echo 'foo: bar' | yq -r .foo | grep -Fx bar
          printf 'hello\n' | rg -q '^hello$'
          echo OGENIC_WAVE_TOOL_ACTIVATION_PASS
          if docker compose version >/dev/null 2>&1; then
            docker compose version
            echo DOCKER_COMPOSE_PLUGIN=READY
          else
            echo DOCKER_COMPOSE_PLUGIN=NOT_CONFIGURED
          fi
