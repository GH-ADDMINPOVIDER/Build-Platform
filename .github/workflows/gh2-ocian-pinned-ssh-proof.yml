name: GH2 OCIAN Pinned SSH Authentication Readback
on:
  push:
    branches: [feat/ccs-multi-protocol-docker-20261023]
    paths:
      - 'scripts/gh2-ocian-ssh-pin-auth-proof.mjs'
      - '.github/workflows/gh2-ocian-pinned-ssh-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  pinned-ssh-readonly:
    if: github.repository == 'Wave-Runner-2/Build-Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || 'b0962d69-bd33-4ac3-b4f4-48589535ca38' }}
      INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || 'ogenic-sio-ti-rv' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: staging
          secret-path: /
          recursive: false
      - name: SSH fingerprint-gated authentication and read-only OCIAN host command
        run: node scripts/gh2-ocian-ssh-pin-auth-proof.mjs
      - name: Confirm no execute or E2E promotion
        run: echo 'SSH_READONLY_AUDIT_ONLY=TRUE; HOST_DOCKER_AND_CODEX_E2E=NOT_CLAIMED'
