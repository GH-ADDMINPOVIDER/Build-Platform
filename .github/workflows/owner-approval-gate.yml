name: Owner approval gate

on:
  # This workflow reads PR metadata only. It never checks out or executes PR
  # code, so forked/untrusted changes cannot alter the approval decision.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: owner-approval-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  owner-approval:
    name: owner-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require current-head approval from repository owner
        uses: actions/github-script@v7
        env:
          OWNER_LOGIN: Wave-Runner-2
        with:
          script: |
            const pull = context.payload.pull_request;
            if (!pull || !pull.number || !pull.head?.sha) {
              core.setFailed("OWNER_APPROVAL_REQUIRED: pull request metadata is unavailable");
              return;
            }

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner: context.repo.owner, repo: context.repo.repo, pull_number: pull.number, per_page: 100 },
            );
            reviews.sort((a, b) => {
              const left = Date.parse(a.submitted_at || a.updated_at || a.created_at || "");
              const right = Date.parse(b.submitted_at || b.updated_at || b.created_at || "");
              return left - right;
            });
            const latestByReviewer = new Map();
            for (const review of reviews) {
              const login = review.user?.login;
              if (login) latestByReviewer.set(login.toLowerCase(), review);
            }

            const owner = latestByReviewer.get(process.env.OWNER_LOGIN.toLowerCase());
            if (!owner || owner.state !== "APPROVED") {
              core.setFailed(`OWNER_APPROVAL_REQUIRED: ${process.env.OWNER_LOGIN} must approve this PR`);
              return;
            }
            if (owner.commit_id !== pull.head.sha) {
              core.setFailed("OWNER_APPROVAL_REQUIRED: approval is stale for the current PR commit");
              return;
            }
            core.info(`Owner approval verified for ${pull.head.sha}`);
